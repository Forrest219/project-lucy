# 初始化：T00（2026-10-18，runId t00-20261018-0042），基线 lucy-v2.0 / fbed6d4；评估 v1.1（V-01～V-08、D-01～D-02、G-01～G-05、依赖条目）。
# 规则：P0/P1 只能 open | fixed，不得 accepted_risk；fixed 必须填 fixedIn（提交 SHA）且 verifiedBy 全部为本次 release evidence 中 passed 的 case variant id；
#       仅 P2 可 accepted_risk（acceptedBy 填 owner 姓名与日期）；依赖 high/critical 只能 fixed 或附可复核说明的 not_reachable。
#       D-03 的验证路径只按下方专例③，不沿用本段对 verifiedBy 的 release evidence passed 要求；其他条目不因此放宽。
# 每个整改任务在关闭/推进对应条目的同一提交内更新本文件。
#
# 【取证口径澄清 —— 这是澄清，不是规则放松】
#   ① `verifiedBy` 只要求「**本次 release evidence 中 status=passed 的 case variant id**」，
#      **不要求**该 evidence 来自受信 CI runner 或客户 amd64 K8s。因此开发机 Stage 1
#      跑出的 bundle 同样满足本规则，可以据以把条目置 fixed。
#      但那只证明「**修复本身在真实环境里有效**」（真实数据库 + 真实浏览器 + 真实断言），
#      **不构成发布级验收**：G-01（受保护 amd64 runner 未注册）、G-06（GHCR 推送
#      permission_denied）等发布门禁**不因此解除**，Wave 0b 与 blocked_delivery 同理。
#      置 fixed 的条目若引用本地 bundle，必须在自己的 note 里写明该 bundle 的
#      gate 结论（status / exitCode / releaseReady / provenance / topology）。
#   ② 反向：条目保持 `open` 的真正判据是「**对应 case variant 是否真的在修复后的
#      代码上跑过并 passed**」，**不是**「real-e2e 有没有被调度过」。前者是
#      「证据不存在」，后者只是「证据来源不同」——两者不可混为一谈。
#   ③ D-03 专例（只此一条，不是全表豁免）：verifiedBy 可以是 ROW25-V19 与 ROW25-V22。
#      这两条由仓库测试 webui/server/__tests__/row-policy-d03-uppercase.test.ts
#      与 webui/server/__tests__/row-policy-d03-realfs.test.ts 验证，
#      不要求它们出现在本次 release evidence 的 passed 集合里。
#      该例外不把这两条 E2E 记为 passed，不把 releaseReady 置真，
#      不关闭 G-01、G-06 或 Wave 0b，也不宣称客户 Linux 大写 schema 场景已交付。
#      其他条目的 verifiedBy 仍必须是本次 release evidence 中 passed 的 case variant id。
#      P0/P1 仍然不得 accepted_risk。
