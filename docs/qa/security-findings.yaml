  #   判定文件名是否存在；造一份 _schema/BIDM.yaml（含目标列）与同名 overlay，跑一次带 scoped 行级条件的角色编译；
  #   同一内容仅清单文件名大小写不同（大写 BIDM.yaml / 小写 bidm.yaml），结果从 row_policy_field_unresolved:unknown 变为可绑定。
