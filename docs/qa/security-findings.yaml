  # gray-matter 4.0.3：真实风险为默认 JS 引擎（V-08，已由 server/markdown-frontmatter.ts 唯一入口封堵）；本条 moderate 仅是经 js-yaml 3.x → argparse → sprintf-js 的传递链告警。
  - package: gray-matter
    severity: moderate
    status: not_reachable
    rationale: "gray-matter 只经 js-yaml 库入口解析 YAML；告警源 sprintf-js<=1.1.3（GHSA-hp3w-g68c-fv3c，不受控精度说明符致 DoS）仅被 argparse 加载，而 argparse 在 js-yaml 3.15.2 中只被 CLI `bin/js-yaml.js` require（`grep -rn require('argparse') node_modules/js-yaml/{lib,index.js}` 无结果）。Lucy 不调用 js-yaml CLI，不向 sprintf-js 传入任何外部格式串；不宣称为远程可利用。若升级 gray-matter 大版本再复核。"
  - package: js-yaml
    severity: moderate
    status: not_reachable
    rationale: "仅作为 gray-matter 的传递依赖（3.15.2，lock 中由 overrides 固定）。受影响路径在 argparse/sprintf-js（见 gray-matter 条目），库入口 `require('js-yaml')` 不加载 argparse；无 Lucy 代码直接 import js-yaml（Lucy 自有 YAML 解析用 `yaml` 包）。"
  - package: argparse
    severity: moderate
    status: not_reachable
    rationale: "argparse 1.0.10 只被 js-yaml 的 CLI 入口 `bin/js-yaml.js` 引用，运行时服务进程不加载；其唯一告警来自 sprintf-js 传递依赖，无外部可控参数进入 argparse 的格式化路径。"
  - package: sprintf-js
    severity: moderate
    status: not_reachable
    rationale: "sprintf-js 1.0.3（GHSA-hp3w-g68c-fv3c，需向 sprintf 传入攻击者可控的超大精度说明符）仅被 argparse 间接使用；该调用链不在 Lucy 运行时加载路径内，也没有任何外部输入作为格式串。性质为本地/构建期 DoS 类告警，不是远程漏洞。"
