  # D-12 v0.25 实施期发现的**冻结契约破坏**缺陷：D-10 的修复方式改写了 combinedComplete 的语义
  # 现象（2026-10-25 v0.25 W4 重建前全量回归实证）：D-10 修复给 combinedComplete 加了第四个合取项
  #   `&& asOfBoundEnforced`，而 combinedComplete = scopeComplete AND fileHashOk AND relationCheckOk
  #   是 audit-trust R1 验收矩阵的**冻结判据 #6**（scripts/audit-trust/2026-10-19-r1-acceptance-matrix.mjs
  #   的 EXPECTED_CRITERIA_NAMES，配套双向防漂移守卫测试）。该判据只允许三项 AND。
  #   后果：manifest conformance 用例 2 条红；更严重的是判据 #6 在「无 ledger_seq 列」的库上会被判
  #   fail（truthy=3/3 但 combined=false），即**冻结判据被自身的修复破坏**。
  # 处置：不改冻结判据、不改判据文本。改为把 as-of 上界闸门折进 scopeComplete
