  # D-04 v0.25 实施期发现的 fail-open：问询预算在「无 turnId 且无续跑凭据」时自动重置窗口
  # 现象（2026-10-25 v0.25 W3 Codex 对抗式审查实证）：applyConsume 用 `continueToken === turnId` 判断续跑；
  #   当两者都缺失时该表达式为 `undefined === undefined` → true，于是首次预算耗尽时自动把 calls 归零并重开窗口。
  #   后果：Spec 162 的 20 次数据工具上限实际变成 40 次，且没有任何续跑凭据。
  # 同批实证的相邻两处：① 预算持久层「已装配但读写失败」被返回为 `question_budget_exhausted`，使存储故障冒充
  #   合法的 budget_stopped 凭据；② 并发占用 `currentConcurrency` 只增不减（release 无生产调用点）。
  # 处置：续跑要求非空且匹配作用域的凭据；存储故障独立成 `question_budget_unavailable`（503，不记 budget_stop）；
  #   请求结束时经 res.once("close") 释放占用。
  # 影响面：问询预算（Spec 162 §10.3／§10.5）与审计主状态 budget_stopped 桶的真实性。
  - id: D-04
    severity: P1
    status: fixed
    spec: "L25-09 §10.3 / §10.5"
    fixedIn: null
    verifiedBy: []
    acceptedBy: null
