  # D-03 行级策略字段绑定对 Schema Manifest 文件名大小写敏感：大写 schema 下合法列被判 unknown
  # 现象（2026-10-22 客户环境诊断报告）：角色 finbp_cdn 对 sql_server / BIDM / hs_sy_bu_metric 设置行级条件
  #   hs_manage_bu_l2 = 'CDN产品'（该列在 SQL Server 物理表与 Lucy 语义模型中均存在），PATCH /api/admin/roles/finbp_cdn
  #   （dryRun: true）返回 400 / INVALID_ROLE / role_resolution_failed:finbp_cdn:row_policy_field_unresolved:unknown；
  #   移除行级策略后返回 200。正式角色配置与版本回读未变化，新权限未保存生效。
  # 根因（已用复现用例证明，非推测）：同一份 Schema Manifest 有两条读取路径，对 schema 名的处理不一致——
  #   源映射 acl.ts:300 用 normalizeRef(basename) 得到小写化名，但通过 glob("**/_schema/*.yaml") 取磁盘真实文件名，能命中 BIDM.yaml；
  #   字段目录 webui/server/proxy/row-policy.ts 的 loadPhysicalColumnsFromSchema 用已小写化的 entry.schema 拼路径
  #   （.../_schema/bidm.yaml），在大小写敏感文件系统上不存在 → 物理列集合为空 → overlay 普通列因不在物理列集合中被丢弃、
  #   计算列因 isProvenRowLevelExpr 依赖物理列也被丢弃 → catalog.columns 为空 → bindRowPolicyField 判定 unknown。
  # 影响面：清单文件名保留原始大小写（大写 schema，SQL Server / Oracle 常见）的连接上，该表无法保存任何行级条件；
  #   开发期不可见——macOS / APFS 默认大小写不敏感，bidm.yaml 能命中 BIDM.yaml；客户环境为 Linux，问题必现。
  #   仓库既有行策略测试全部使用小写 schema（fin），该路径从未被覆盖。
  # 处置（2026-10-24 Final 决议）：归属 0.20.Z 维护线（当前基线 0.20.0）；本次只登记设计，不授权实现。
  #   它是受影响客户场景的交付价值依赖，不是 L25-14 R2/R4/R5 的开工依赖；V19／V22 证据齐全前不得宣称受影响场景交付价值。
