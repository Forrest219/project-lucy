  #   直接覆盖写（**非原子**：先截断、内容后落），读者若落在截断与落盘之间即读到半截文件，
  #   `JSON.parse` 抛 SyntaxError；该异常不是 SemanticAssetValidationError，于是从发布路由
  #   `throw error` 逃逸为 HTTP 500，而不是返回同一个 release id。
