# Versioned registry of real product clients for the user-e2e layer (Spec §6.3, R4/R7).
# Authority: docs/specs/lucy-20261018-enterprise-security-and-real-e2e-spec.md §6.3 and §10 (R4, R7, R9, R10).
# A required client may not be removed to turn a failed run green; removal needs a reviewed change here and a profile bump.
# `version` is the version proven by the adapter probe at run time (never trusted from this file).
#
# 2026-10-18 owner decisions (xingchen):
#   v2 — WorkBuddy + Cursor Agent CLI
#   v3 — WorkBuddy GUI + Cursor Agent GUI (automated)
#   v4 — Scheme A: automated Codex+Claude Code+OpenClaw; manual WorkBuddy+Cursor GUI
#   v5 — Drop Codex CLI from automated required; automated = Claude Code + OpenClaw only.
version: 5
clients:
  - product: claude-code
    required: true
    execution: automated
    transport: cli
    integration: "Claude Code CLI (`claude -p`) with --mcp-config pointing at a generated MCP JSON (Bearer via env var name)"
    adapter: scripts/e2e/adapters/claude-code.mjs
    os: [darwin, linux]
    version: null
    auth: "claude login / ANTHROPIC_API_KEY (probe accepts either)"
    protocols: [streamable-http]
    cases: [SEC-07-V12, SEC-14-V12, SEC-16-V01, SEC-16-V02, SEC-16-V03, SEC-21-V06, UX-01-V01, UX-02, UX-03, UX-04, UX-05]
    credentialEnv: [ANTHROPIC_API_KEY]
  - product: openclaw
    required: true
    execution: automated
    transport: cli
    integration: "OpenClaw CLI (`openclaw`) with MCP config generated from the WebUI"
    adapter: scripts/e2e/adapters/openclaw.mjs
    os: [darwin, linux]
    version: null
    auth: "product-native login or OPENCLAW_API_KEY when required by the binary"
    protocols: [streamable-http]
    cases: [SEC-07-V12, SEC-14-V12, SEC-16-V01, SEC-16-V02, SEC-16-V03, SEC-21-V06, UX-01-V01, UX-02, UX-03, UX-04, UX-05]
    credentialEnv: [OPENCLAW_API_KEY]
  - product: workbuddy
    required: true
    execution: manual
    transport: gui
    integration: "WorkBuddy desktop Agent GUI — human-executed forever; checklist docs/qa/manual-gui-e2e-checklist.md"
    adapter: null
    manualChecklist: docs/qa/manual-gui-e2e-checklist.md
    os: [darwin]
    version: null
    auth: "in-app login; Lucy Bearer via MCP config copied from WebUI"
    protocols: [streamable-http]
    cases: [SEC-07-V12, SEC-14-V12, SEC-16-V01, SEC-16-V02, SEC-16-V03, SEC-21-V06, UX-01-V01, UX-02, UX-03, UX-04, UX-05]
    credentialEnv: []
  - product: cursor
    required: true
    execution: manual
    transport: gui
    integration: "Cursor Agent GUI (Agent panel in Cursor.app) — human-executed forever; checklist docs/qa/manual-gui-e2e-checklist.md"
    adapter: null
    manualChecklist: docs/qa/manual-gui-e2e-checklist.md
    os: [darwin]
    version: null
    auth: "in-app login; Lucy Bearer via project .cursor/mcp.json from WebUI"
    protocols: [streamable-http]
    cases: [SEC-07-V12, SEC-14-V12, SEC-16-V01, SEC-16-V02, SEC-16-V03, SEC-21-V06, UX-01-V01, UX-02, UX-03, UX-04, UX-05]
    credentialEnv: []
  - product: codex
    required: false
    execution: automated
    transport: cli
    integration: "Codex CLI (`codex exec`) — dropped from automated required (v5); optional local experiments only"
    adapter: scripts/e2e/adapters/codex.mjs
    os: [darwin, linux]
    version: null
    auth: "OPENAI_API_KEY or ChatGPT login"
    protocols: [streamable-http]
    cases: []
    credentialEnv: [OPENAI_API_KEY]
  - product: cursor-cli
    required: false
    execution: automated
    transport: cli
    integration: "Cursor Agent CLI — optional experiments only; not in first-release denominator"
    adapter: scripts/e2e/adapters/cursor-cli.mjs
    os: [darwin, linux]
    version: null
    auth: "CURSOR_API_KEY"
    protocols: [streamable-http]
    cases: []
    credentialEnv: [CURSOR_API_KEY]
notCounted:
  - "Two Hermes profiles count as ONE product and can never replace Claude Code or OpenClaw."
  - "Direct HTTP scripts are not real clients; they only prove protocol behavior in the security-integration layer."
  - "Manual GUI evidence cannot be fabricated by the automated runner; missing manual packs block customer GO."
  - "Codex CLI is not a substitute for the automated required pair after v5."
unsupportedAuth: "If a product cannot send the Lucy Bearer token it is reported blocked; never routed through KTX stdio or :7878."
