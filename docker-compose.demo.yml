services:
  demo-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: lucy_demo_root
      MYSQL_DATABASE: dataforai
      MYSQL_USER: lucy
      MYSQL_PASSWORD: lucy_demo
    ports:
      - "${LUCY_DEMO_MYSQL_HOST_PORT:-53306}:3306"
    volumes:
      - ./examples/docker-demo/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ulucy -plucy_demo --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  lucy:
    build:
      context: .
      args:
        KTX_VERSION: "${KTX_VERSION:-0.16.0}"
        # Dockerfile pins `--platform=$TARGETPLATFORM` (not BUILDPLATFORM) so image
        # metadata and layer ELFs match. Plain compose does not always inject
        # TARGETPLATFORM — defaults assume Apple Silicon. Prefer
        # `npm run demo:rebuild`, which sets BUILDX_BUILDER=default and host arch.
        # amd64 hosts: TARGETPLATFORM=linux/amd64 TARGETARCH=amd64, or use the script.
        TARGETPLATFORM: "${TARGETPLATFORM:-linux/arm64}"
        TARGETARCH: "${TARGETARCH:-arm64}"
        # Optional PyPI mirror (see Dockerfile ARG block). Empty = official pypi.org.
        UV_INDEX_URL: "${UV_INDEX_URL:-}"
    image: project-lucy:demo
    environment:
      KTX_PROJECT_ROOT: /data/lucy
      LUCY_TEMPLATE_ROOT: /app/examples/docker-demo/project-template
      LUCY_WEBUI_HOST: 0.0.0.0
      LUCY_WEBUI_PORT: "5174"
      LUCY_PROXY_HOST: 0.0.0.0
      LUCY_PROXY_PORT: "7879"
      LUCY_PROXY_UPSTREAM_HOST: 127.0.0.1
      LUCY_PROXY_UPSTREAM_PORT: "7878"
      # Advertise URL for Agent / WebUI copy. Default matches host publish port
      # below (57881). If you override LUCY_DEMO_PROXY_HOST_PORT, also set
      # LUCY_PUBLIC_MCP_URL to the same host:port (or your reverse-proxy URL).
      LUCY_PUBLIC_MCP_URL: "${LUCY_PUBLIC_MCP_URL:-http://127.0.0.1:57881/mcp}"
      POSTHOG_DISABLED: "1"
    ports:
      - "${LUCY_DEMO_WEBUI_HOST_PORT:-55176}:5174"
      - "${LUCY_DEMO_PROXY_HOST_PORT:-57881}:7879"
    volumes:
      - lucy-demo-data:/data/lucy
      # Mount the eval suites so wiki_search / KTX eval tools can reach them.
      # Read-only; demo-data volume still owns runtime state.
      - ./evals:/data/lucy/evals:ro
    depends_on:
      demo-db:
        condition: service_healthy

volumes:
  lucy-demo-data:
