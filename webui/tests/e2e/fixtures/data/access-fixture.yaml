# E2E contract fixture access policy (seeded by scripts/demo/init-e2e-fixture.sh).
# Role/connection/schema/tables must stay aligned with ktx-fixture.yaml and
# semantic-layer-fixture/mysql-aliyun/_schema/dataforai.yaml. Contract-only: never a real E2E policy.
roles:
  e2e_fixture_reader:
    description: E2E fixture Superstore readonly agent
    allow:
      connections:
        - mysql-aliyun
      tableSelectors:
        - connection: mysql-aliyun
          schema: dataforai
          names:
            - superstore_orders
            - superstore_people
      tools:
        - lucy_catalog
        - lucy_query
        - lucy_read_source
        - lucy_explain_query
        - lucy_begin_question
        - wiki_search
        - wiki_read
        - connection_list

users:
  - id: e2e-default
    name: E2E Default Agent
    enabled: true
    note: "Contract fixture agent; no token is provisioned."
    tokens: []
    role: e2e_fixture_reader

defaults:
  deny_tools:
    - sql_execution
    - sql_dialect_notes
    - memory_ingest
    - memory_ingest_status
    - sl_query
    - sl_read_source
  known_tools:
    - lucy_query
    - lucy_read_source
    - lucy_explain_query
    - lucy_catalog
    - lucy_freshness
    - lucy_begin_question
    - wiki_search
    - wiki_read
    - entity_details
    - dictionary_search
    - discover_data
    - connection_list
    - kx_catalog
    - sl_query
    - sl_read_source
    - sl_validate
    - sql_execution
    - sql_dialect_notes
    - memory_ingest
    - memory_ingest_status
  table_touching_tools:
    - lucy_query
    - lucy_read_source
    - lucy_explain_query
    - lucy_freshness
    - entity_details
    - sl_validate
    - sl_query
    - sl_read_source
  sensitive_metadata_tools:
    - dictionary_search
    - discover_data
  sensitive_table_prefixes: []
