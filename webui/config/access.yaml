# Lucy MCP Proxy — 用户访问配置
# Phase 1: tokens 使用明文 value（Phase 2 将改为 sha256 hash）
# 修改后 30 秒内自动生效（缓存 TTL）

users:
  - id: zhangsan
    name: 张三
    tokens:
      - hash: "sha256:b552dcabddbba25e148d05d8c2470c1f0d5f9585624c292afc9d57c78e4e5498"
        label: hermes-laptop
        created: 2026-06-18
    allow:
      tables:
        - dataforai.superstore_orders
      tools:
        - sl_query
        - sl_read_source
        - wiki_search
        - wiki_read
        - entity_details
        - dictionary_search
        - discover_data
        - connection_list

  - id: kx_guard_tester
    name: KX Guardrail Tester
    enabled: true
    note: "Security test agent: no tokens; limited to KX financial tables only."
    tokens: []
    allow:
      connections:
        - mysql-aliyun
      tables:
        - dataforai.kx_dim_company
        - dataforai.kx_dim_financial_item
        - dataforai.kx_fact_financial_amount
        - dataforai.kx_vw_balance_sheet_detail
        - dataforai.kx_vw_cash_flow_statement_detail
        - dataforai.kx_vw_income_statement_detail
      tools:
        - kx_catalog
        - sl_query
        - sl_read_source
        - entity_details

  - id: workhorse
    name: Hermes Workhorse
    enabled: true
    note: "Hermes workhorse profile; limited to KX financial tables only."
    tokens:
      - hash: "sha256:f5d0c6a8139acae01f5490ff159c4d378cf3b1b2904e83ba1748e1381d082ada"
        label: hermes-workhorse
        created: 2026-06-20
    allow:
      tables:
        - dataforai.kx_dim_company
        - dataforai.kx_dim_financial_item
        - dataforai.kx_fact_financial_amount
        - dataforai.kx_vw_balance_sheet_detail
        - dataforai.kx_vw_cash_flow_statement_detail
        - dataforai.kx_vw_income_statement_detail
      tools:
        - sl_query
        - sl_read_source
        - entity_details

  - id: lisi
    name: 李四
    tokens:
      - hash: "sha256:e845c2d9554bfb020dd1e8ec718d505bf891efc3e1c40d4c7c4c86cd766f138c"
        label: cursor-mac
        created: 2026-06-18
    allow:
      tables: ["*"]
      tools: ["*"]

defaults:
  deny_tools:
    - sql_execution
    - memory_ingest
    - memory_ingest_status
  known_tools:
    - sl_query
    - sl_read_source
    - sl_validate
    - wiki_search
    - wiki_read
    - entity_details
    - dictionary_search
    - discover_data
    - connection_list
    - kx_catalog
    - sql_execution
    - memory_ingest
    - memory_ingest_status
  table_touching_tools:
    - sl_query
    - sl_read_source
    - sl_validate
    - entity_details
  sensitive_metadata_tools:
    - dictionary_search
    - discover_data
  sensitive_table_prefixes:
    - dataforai.kx_
