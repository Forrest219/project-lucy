roles:
  lucy_r1_exact_readonly:
    description: Lucy R1 发布证据账号模板 — exact 6-tool controlled data service surface
    allow:
      connections:
        - poc-mysql-aliyun
      tableSelectors:
        - connection: poc-mysql-aliyun
          schema: data_agent_poc
          names:
            - poc_metric_catalog
            - poc_app_active_daily
            - poc_ad_revenue_daily
            - poc_ad_revenue_by_type_daily
            - poc_ceo_metric_snapshot
      tools:
        - lucy_catalog
        - lucy_read_source
        - lucy_query
        - lucy_explain_query
        - lucy_freshness
        - lucy_begin_question
  poc_readonly:
    description: POC内测只读角色 — 可访问5张POC授权表，forbidden_finance由ACL层deny
    allow:
      connections:
        - poc-mysql-aliyun
      tableSelectors:
        - connection: poc-mysql-aliyun
          schema: data_agent_poc
          names:
            - poc_metric_catalog
            - poc_app_active_daily
            - poc_ad_revenue_daily
            - poc_ad_revenue_by_type_daily
            - poc_ceo_metric_snapshot
            # forbidden_finance 故意不在此列表中：
            #   - 表在 enabled_tables 中，scan 生成了 manifest（表"存在"）
            #   - 但 tableSelector 不授权，lucy ACL 返回 deny 而非 "表不存在"
            #   - deny 事件记录进 audit，演示 ACL 拦截能力
      tools:
        - lucy_query
        - lucy_read_source
        - lucy_explain_query
        - lucy_freshness
        - lucy_catalog
        - lucy_begin_question
        - wiki_search
        - wiki_read
        - entity_details
        - connection_list
  kx_readonly:
    description: KX 财务数据只读问答
    allow:
      connections:
        - mysql-aliyun
      tableSelectors:
        - connection: mysql-aliyun
          schema: dataforai
          names:
            - kx_dim_company
            - kx_dim_financial_item
            - kx_fact_financial_amount
            - kx_vw_balance_sheet_detail
            - kx_vw_cash_flow_statement_detail
            - kx_vw_income_statement_detail
      tools:
        - lucy_catalog
        - kx_catalog
        - lucy_query
        - lucy_read_source
        - lucy_explain_query
        - lucy_freshness
        - lucy_begin_question
        - entity_details
  superstore_region_huadong:
    description: 华东区域经理 — 仅本区域订单（无 returns/people 关联）
    allow:
      connections:
        - mysql-aliyun
      tableSelectors:
        - connection: mysql-aliyun
          schema: dataforai
          names:
            - superstore_orders_huadong
      tools:
        - lucy_catalog
        - kx_catalog
        - lucy_query
        - lucy_read_source
        - lucy_explain_query
        - lucy_freshness
        - lucy_begin_question
        - entity_details
  local_dev_full_access:
    description: 本地开发全量只读访问（等价 ktx.yaml 直连范围）
    allow:
      connections:
        - mysql-aliyun
      tableSelectors:
        - connection: mysql-aliyun
          schema: dataforai
          names:
            - superstore_orders
            - superstore_returns
            - superstore_people
            - superstore_orders_huadong
            - kx_dim_company
            - kx_dim_financial_item
            - kx_fact_financial_amount
            - kx_vw_balance_sheet_detail
            - kx_vw_cash_flow_statement_detail
            - kx_vw_income_statement_detail
      tools:
        - lucy_catalog
        - kx_catalog
        - lucy_query
        - lucy_read_source
        - lucy_explain_query
        - lucy_freshness
        - lucy_begin_question
        - sl_query
        - sl_read_source
        - sl_validate
        - wiki_search
        - wiki_read
        - entity_details
        - dictionary_search
        - discover_data
        - connection_list
users:
  - id: poc_demo
    name: POC演示账号
    enabled: true
    note: 晨阳POC内测演示用户，仅可访问5张POC表，forbidden_finance由ACL deny
    tokens:
      - hash: sha256:81199e3ad07d78f11aace1e598ecea49739a5ca01f80ffdfe17cbae0e9faa5d7
        label: poc-demo-token
        created: 2026-06-29
    role: poc_readonly
  - id: zhangsan
    name: 张三
    tokens:
      - hash: sha256:b552dcabddbba25e148d05d8c2470c1f0d5f9585624c292afc9d57c78e4e5498
        label: hermes-laptop
        created: 2026-06-18
    role: kx_readonly
  - id: kx_guard_tester
    name: KX Guardrail Tester
    enabled: true
    note: "Security test agent: no tokens; limited to KX financial tables only."
    tokens: []
    role: kx_readonly
  - id: workhorse
    name: Hermes Workhorse
    enabled: true
    note: Hermes workhorse profile; limited to KX financial tables only.
    tokens:
      - hash: sha256:f5d0c6a8139acae01f5490ff159c4d378cf3b1b2904e83ba1748e1381d082ada
        label: hermes-workhorse
        created: 2026-06-20
    role: kx_readonly
  - id: forrest_local
    name: Forrest（本地开发）
    enabled: true
    note: Local development user for the Lucy MCP proxy path (wo-proxy-instructions-injection Task B). Token provisioned via admin API; never store plaintext in committed files.
    tokens:
      - hash: sha256:790d0fda16da474703723041f0293f2086a92b62978f07ea89a00ca493f84a1b
        label: lucy-mcp-dev-v4
        created: 2026-06-30
    role: local_dev_full_access
  - id: lisi
    name: 李四
    enabled: false
    note: High-privilege sample agent disabled after token rotation; create a new one-time token through the admin API only when explicitly needed.
    tokens: []
    allow:
      tables:
        - "*"
      tools:
        - "*"
  - id: demo_huadong_manager
    name: 华东区域经理 Demo
    note: "CIO demo: region-scoped agent, view-based row filter"
    enabled: true
    tokens:
      - hash: sha256:f20a97aef6305726634074edf7f7a2ad99566d7dba6023b686c6d3c53e4e9f30
        label: cio-demo
        created: 2026-06-22
        expires_at: 2026-06-24T00:00:00Z
    role: superstore_region_huadong
defaults:
  deny_tools:
    - sql_execution
    - memory_ingest
    - memory_ingest_status
  known_tools:
    - sl_query
    - sl_read_source
    - sl_validate
    - wiki_search
    - wiki_read
    - entity_details
    - dictionary_search
    - discover_data
    - connection_list
    - lucy_catalog
    - lucy_read_source
    - lucy_query
    - lucy_explain_query
    - lucy_freshness
    - lucy_begin_question
    - kx_catalog
    - sql_execution
    - memory_ingest
    - memory_ingest_status
  table_touching_tools:
    - sl_query
    - sl_read_source
    - lucy_query
    - lucy_read_source
    - lucy_explain_query
    - lucy_freshness
    - sl_validate
    - entity_details
  sensitive_metadata_tools:
    - dictionary_search
    - discover_data
  sensitive_table_prefixes:
    - dataforai.kx_
