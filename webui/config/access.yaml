roles:
  kx_readonly:
    description: KX 财务数据只读问答
    allow:
      connections:
        - mysql-aliyun
      tableSelectors:
        - connection: mysql-aliyun
          schema: dataforai
          names:
            - kx_dim_company
            - kx_dim_financial_item
            - kx_fact_financial_amount
            - kx_vw_balance_sheet_detail
            - kx_vw_cash_flow_statement_detail
            - kx_vw_income_statement_detail
      tools:
        - kx_catalog
        - sl_query
        - sl_read_source
        - entity_details
  superstore_region_huadong:
    description: 华东区域经理 — 仅本区域订单（无 returns/people 关联）
    allow:
      connections:
        - mysql-aliyun
      tableSelectors:
        - connection: mysql-aliyun
          schema: dataforai
          names:
            - superstore_orders_huadong
      tools:
        - kx_catalog
        - sl_query
        - sl_read_source
        - entity_details
  local_dev_full_access:
    description: 本地开发全量只读访问（等价 ktx.yaml 直连范围）
    allow:
      connections:
        - mysql-aliyun
      tableSelectors:
        - connection: mysql-aliyun
          schema: dataforai
          names:
            - superstore_orders
            - superstore_returns
            - superstore_people
            - superstore_orders_huadong
            - kx_dim_company
            - kx_dim_financial_item
            - kx_fact_financial_amount
            - kx_vw_balance_sheet_detail
            - kx_vw_cash_flow_statement_detail
            - kx_vw_income_statement_detail
      tools:
        - kx_catalog
        - sl_query
        - sl_read_source
        - sl_validate
        - wiki_search
        - wiki_read
        - entity_details
        - dictionary_search
        - discover_data
        - connection_list
users:
  - id: zhangsan
    name: 张三
    tokens:
      - hash: sha256:b552dcabddbba25e148d05d8c2470c1f0d5f9585624c292afc9d57c78e4e5498
        label: hermes-laptop
        created: 2026-06-18
    role: kx_readonly
  - id: kx_guard_tester
    name: KX Guardrail Tester
    enabled: true
