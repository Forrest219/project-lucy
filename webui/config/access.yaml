# Lucy MCP Proxy — 用户访问配置
# Phase 1: tokens 使用明文 value（Phase 2 将改为 sha256 hash）
# 修改后 30 秒内自动生效（缓存 TTL）

roles:
  kx_readonly:
    description: KX 财务数据只读问答
    allow:
      connections:
        - mysql-aliyun
      tableSelectors:
        - connection: mysql-aliyun
          schema: dataforai
          names:
            - kx_dim_company
            - kx_dim_financial_item
            - kx_fact_financial_amount
            - kx_vw_balance_sheet_detail
            - kx_vw_cash_flow_statement_detail
            - kx_vw_income_statement_detail
      tools:
        - kx_catalog
        - sl_query
        - sl_read_source
        - entity_details

users:
  - id: zhangsan
    name: 张三
    tokens:
      - hash: "sha256:b552dcabddbba25e148d05d8c2470c1f0d5f9585624c292afc9d57c78e4e5498"
        label: hermes-laptop
        created: 2026-06-18
    allow:
      tables:
        - dataforai.superstore_orders
      tools:
        - sl_query
        - sl_read_source
        - wiki_search
        - wiki_read
        - entity_details
        - dictionary_search
        - discover_data
        - connection_list

  - id: kx_guard_tester
    name: KX Guardrail Tester
    enabled: true
    note: "Security test agent: no tokens; limited to KX financial tables only."
    tokens: []
    role: kx_readonly

  - id: workhorse
    name: Hermes Workhorse
    enabled: true
    note: "Hermes workhorse profile; limited to KX financial tables only."
    tokens:
      - hash: "sha256:f5d0c6a8139acae01f5490ff159c4d378cf3b1b2904e83ba1748e1381d082ada"
        label: hermes-workhorse
        created: 2026-06-20
    role: kx_readonly

  - id: lisi
    name: 李四
    enabled: false
    note: "High-privilege sample agent disabled after token rotation; create a new one-time token through the admin API only when explicitly needed."
    tokens: []
    allow:
      tables: ["*"]
      tools: ["*"]

defaults:
  # ACL tool classification is a security boundary. When KTX adds a tool, decide
  # whether it belongs in known_tools, table_touching_tools, or sensitive_metadata_tools.
  deny_tools:
    - sql_execution
    - memory_ingest
    - memory_ingest_status
  known_tools:
    - sl_query
    - sl_read_source
    - sl_validate
    - wiki_search
    - wiki_read
    - entity_details
    - dictionary_search
    - discover_data
    - connection_list
    - kx_catalog
    - sql_execution
    - memory_ingest
    - memory_ingest_status
  table_touching_tools:
    - sl_query
    - sl_read_source
    - sl_validate
    - entity_details
  sensitive_metadata_tools:
    - dictionary_search
    - discover_data
  sensitive_table_prefixes:
    - dataforai.kx_
