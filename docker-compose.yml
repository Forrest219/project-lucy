services:
  lucy:
    build:
      context: .
      args:
        KTX_VERSION: "${KTX_VERSION:-0.16.0}"
        # Customer / production baseline is amd64. Override on arm64 hosts.
        TARGETPLATFORM: "${TARGETPLATFORM:-linux/amd64}"
        TARGETARCH: "${TARGETARCH:-amd64}"
    image: project-lucy:local
    environment:
      KTX_PROJECT_ROOT: /data/lucy
      LUCY_WEBUI_HOST: 0.0.0.0
      LUCY_WEBUI_PORT: "5174"
      LUCY_PROXY_HOST: 0.0.0.0
      LUCY_PROXY_PORT: "7879"
      LUCY_PROXY_UPSTREAM_HOST: 127.0.0.1
      LUCY_PROXY_UPSTREAM_PORT: "7878"
      # Advertise URL for Agent / WebUI copy. Default matches host publish port
      # below (7879). Remap LUCY_PROXY_HOST_PORT → also update this URL; for
      # Ingress / reverse proxy set the public https://…/mcp URL instead.
      LUCY_PUBLIC_MCP_URL: "${LUCY_PUBLIC_MCP_URL:-http://127.0.0.1:7879/mcp}"
      LUCY_ALLOW_PLACEHOLDER_KTX: "${LUCY_ALLOW_PLACEHOLDER_KTX:-}"
      POSTHOG_DISABLED: "1"
    ports:
      - "${LUCY_WEBUI_HOST_PORT:-5174}:5174"
      - "${LUCY_PROXY_HOST_PORT:-7879}:7879"
    volumes:
      - lucy-data:/data/lucy

volumes:
  lucy-data:
