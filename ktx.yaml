connections:
  mysql-aliyun:
    driver: mysql
    enabled_tables:
      # 本项目仅保留 dataforai 超市 domain。
      - dataforai.superstore_orders
      - dataforai.superstore_returns
      - dataforai.superstore_people
    host: rm-bp1t0ie3sj4g7561hpo.mysql.rds.aliyuncs.com
    port: 3306
    database: dataforai
    username: bi_zy
    password: file:/Users/zhangxingchen/Projects/project-lucy/.ktx/secrets/mysql-aliyun-password
    # NOTE: `schemas` 控制 scan 范围；`enabled_tables`（上方）控制问答可见范围。
    schemas:
      - dataforai
storage:
  state: sqlite
  search: sqlite-fts5
  git:
    author: ktx <ktx@example.com>
llm:
  provider:
    backend: claude-code
  models:
    default: sonnet
    # triage 是轻量分流，haiku 即可，省成本省延迟。
    triage: haiku
    # 候选抽取 / 整理 / 调和 / 修复属于结构化生成，保持 sonnet。
    candidateExtraction: sonnet
    curator: sonnet
    reconcile: sonnet
    repair: sonnet
    # NOTE: 高风险审查（reviewer skill）跑在 Claude Code 主会话里，模型由用户 /model 选定，不在此处控制。
ingest:
  embeddings:
    backend: sentence-transformers
    model: all-MiniLM-L6-v2
    dimensions: 384
  workUnits:
    stepBudget: 40
    maxConcurrency: 1
    failureMode: continue
agent:
  run_research:
    enabled: false
    max_iterations: 20
    default_toolset:
      - sl_query
      - wiki_search
      - sl_read_source
scan:
  enrichment:
    mode: llm
    embeddings:
      backend: sentence-transformers
      model: all-MiniLM-L6-v2
      dimensions: 384
  relationships:
    enabled: true
    llmProposals: true
    validationRequiredForManifest: true
    acceptThreshold: 0.85
    reviewThreshold: 0.55
    maxLlmTablesPerBatch: 40
    maxCandidatesPerColumn: 25
    profileSampleRows: 10000
    profileConcurrency: 4
    validationConcurrency: 4
setup:
  database_connection_ids:
    - mysql-aliyun
