connections:
  poc-mysql-aliyun:
    driver: mysql
    host: rm-bp1t0ie3sj4g7561hpo.mysql.rds.aliyuncs.com
    port: 3306
    database: data_agent_poc
    username: data_agent_poc_ro
    password: file:/Users/forrest/Projects/project-lucy/.ktx/secrets/poc-mysql-password
    enabled_tables:
      - data_agent_poc.poc_metric_catalog
      - data_agent_poc.poc_app_active_daily
      - data_agent_poc.poc_ad_revenue_daily
      - data_agent_poc.poc_ad_revenue_by_type_daily
      - data_agent_poc.poc_ceo_metric_snapshot
      - data_agent_poc.forbidden_finance
    schemas:
      - data_agent_poc
  mysql-aliyun:
    driver: mysql
    enabled_tables:
      # dataforai 当前启用超市样例与 KX 财务报表 source。
      - dataforai.superstore_orders
      - dataforai.superstore_returns
      - dataforai.superstore_people
      - dataforai.kx_dim_company
      - dataforai.kx_dim_financial_item
      - dataforai.kx_fact_financial_amount
      - dataforai.kx_vw_balance_sheet_detail
      - dataforai.kx_vw_cash_flow_statement_detail
      - dataforai.kx_vw_income_statement_detail
      - dataforai.superstore_orders_huadong
    host: rm-bp1t0ie3sj4g7561hpo.mysql.rds.aliyuncs.com
    port: 3306
    database: dataforai
    username: bi_zy
    password: file:/Users/zhangxingchen/Projects/project-lucy/.ktx/secrets/mysql-aliyun-password
    # NOTE: `schemas` 控制 scan 范围；`enabled_tables`（上方）控制问答可见范围。
    schemas:
      - dataforai
storage:
  state: sqlite
  search: sqlite-fts5
  git:
    author: ktx <ktx@example.com>
llm:
  provider:
    backend: anthropic
    anthropic:
      api_key: env:ANTHROPIC_AUTH_TOKEN
      base_url: https://api.minimaxi.com/anthropic/v1
  models:
    default: MiniMax-M3
    triage: MiniMax-M3
    candidateExtraction: MiniMax-M3
    curator: MiniMax-M3
    reconcile: MiniMax-M3
    repair: MiniMax-M3
    # NOTE: 高风险审查（reviewer skill）跑在 Claude Code 主会话里，模型由用户 /model 选定，不在此处控制。
  promptCaching:
    enabled: false
ingest:
  embeddings:
    backend: sentence-transformers
    model: all-MiniLM-L6-v2
    dimensions: 384
  workUnits:
    stepBudget: 40
    maxConcurrency: 1
    failureMode: continue
agent:
  run_research:
    enabled: false
    max_iterations: 20
    default_toolset:
      - sl_query
      - wiki_search
      - sl_read_source
scan:
  enrichment:
    mode: llm
    embeddings:
      backend: sentence-transformers
      model: all-MiniLM-L6-v2
      dimensions: 384
  relationships:
    enabled: true
    llmProposals: true
    validationRequiredForManifest: true
    acceptThreshold: 0.85
    reviewThreshold: 0.55
    maxLlmTablesPerBatch: 40
    maxCandidatesPerColumn: 25
    profileSampleRows: 10000
    profileConcurrency: 4
    validationConcurrency: 4
setup:
  database_connection_ids:
    - poc-mysql-aliyun
    - mysql-aliyun
