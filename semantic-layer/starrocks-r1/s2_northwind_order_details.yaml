# WO-202608-58 Phase 2 thin overlay (measures only; physical cols in Manifest)
name: s2_northwind_order_details
grain:
- orderid
- productid
measures:
- name: line_amount
  expr: sum(unitprice * quantity * (1 - discount))
  description: Net line amount after discount.
- name: line_count
  expr: count(*)
  description: Order detail line count.
