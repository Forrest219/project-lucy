# WO-202608-58 Phase 2 thin overlay (measures only; physical cols in Manifest)
name: s2_chinook_invoice_items
grain:
- InvoiceLineId
measures:
- name: line_revenue
  expr: sum(UnitPrice * Quantity)
  description: Invoice line revenue.
- name: line_count
  expr: count(InvoiceLineId)
  description: Invoice line count.
