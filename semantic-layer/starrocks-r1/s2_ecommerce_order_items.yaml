# WO-202608-58 Phase 2 thin overlay (measures only; physical cols in Manifest)
name: s2_ecommerce_order_items
grain:
- order_id
- order_item_id
measures:
- name: item_price_sum
  expr: sum(price)
  description: Sum of item prices.
- name: freight_sum
  expr: sum(freight_value)
  description: Sum of freight values.
- name: item_count
  expr: count(*)
  description: Order item rows.
