name: poc_ad_revenue_daily

# 行粒度：每行一条 (dt, position_name, country) 的广告收入与曝光日汇总
# 来源场景：何洲 — FineVis 营业收入-广告
# 对应上游：mojicom.ad_* 3表关联（原始字段名待何洲确认）
#
# ⚠️ DAU 口径警告：ad_dau 在同一 (dt, country) 下的所有广告位行中重复存储
#    （日级总广告DAU，4个广告位共享同一个值）。
#    分母必须用 max(ad_dau)，禁止 sum(ad_dau)；后者会将DAU放大4倍，ARPU差4倍。
grain:
  - dt
  - position_name
  - country

measures:
  - name: ad_revenue
    expr: sum(ad_revenue)
    description: 广告收入，单位：元。

  - name: ad_impressions
    expr: sum(ad_impressions)
    description: 广告曝光量，单位：次。

  - name: ad_dau
    expr: max(ad_dau)
    description: |
      广告域日活跃用户数（友盟三端合计），单位：人。
      ⚠️ 字段在同一(dt,country)的各广告位行重复，必须用max()而非sum()。
      此值与产品DAU（poc_app_active_daily.dau_noback）来源不同、数值不同，详见wiki poc-ad-revenue.md。

  - name: ecpm
    expr: sum(ad_revenue) / nullif(sum(ad_impressions), 0) * 1000
    description: eCPM，单位：元/千次曝光。开屏eCPM最高（曝光量少、单价高）；信息流总收入最高（曝光量大）。

  - name: arpu
    expr: sum(ad_revenue) / nullif(max(ad_dau), 0)
    description: |
      广告ARPU，单位：元/人。IDM层正式口径：广告收入/广告域DAU。
      ⚠️ 分母用max(ad_dau)而非sum(ad_dau)。
      ARPU双公式待何洲确认：另有"收入/总打开次数"口径来自APP层，本表不采用。

segments:
  - name: domestic
    expr: country = '国内'
    description: 仅国内业务。默认过滤条件。

  - name: kaipingad
    expr: position_name = '开屏'
    description: 开屏广告位。eCPM最高。

  - name: infofeed
    expr: position_name = '信息流'
    description: 信息流广告位。总收入最高。
