name: poc_ad_revenue_by_type_daily

# 行粒度：每行一条 (dt, revenue_type, country, platform) 的IDM层广告收入日汇总
# 来源场景：陶峙桦 — CEO一眼报，IDM治理层（idm_ad_revenue_a_d）
# 对应上游：idm_ad_revenue_a_d（字段名为描述推断，待数据平台核实）；
#           DAU/打开次数来自 odm_umeng_all_threeends（act_num→dau，start_num→打开次数）
# 日期口径：dt 是北京时间自然日；MCP/JSON 的 UTC ISO 展示值必须先转 Asia/Shanghai 再用于展示或对账。
#
# ⚠️ DAU/打开次数口径警告：
#    ad_dau_idm、total_opens 在同一 (dt, country, platform) 下的各收入品类行中重复存储。
#    绝对量必须用 max()；比率（avg_opens_per_user、arpu_idm）可用 sum/sum（重复倍数抵消）。
#    绝对DAU不支持跨平台直接sum；跨平台总DAU请按平台分别取max后相加。
#
# seed data 约定：只插 Android/iPhone 明细行，不插 platform='ALL' 汇总行。
# 一致性约束：sum(ad_revenue GROUP BY dt,country) == poc_ad_revenue_daily 同粒度总收入。
grain:
  - dt
  - revenue_type
  - country
  - platform

measures:
  - name: ad_revenue
    expr: sum(ad_revenue)
    description: 分品类广告收入，单位：元。效果品类占比最大（~40%）。四品类合计=poc_ad_revenue_daily同日同国总收入（内置一致性校验）。

  - name: ad_impressions
    expr: sum(ad_impressions)
    description: 分品类广告曝光量，单位：次。

  - name: ad_dau_idm
    expr: max(ad_dau_idm)
    description: |
      IDM层广告DAU（友盟单端），单位：人。
      ⚠️ 字段在同一(dt,country,platform)的各品类行重复，必须用max()；
      查询跨平台总DAU时，请分别对Android/iPhone取max后加总，或过滤单一platform后取max。
      此DAU与产品DAU（poc_app_active_daily.dau_noback）来源不同，数值更大，详见wiki poc-idm-governance.md。

  - name: total_opens
    expr: max(total_opens)
    description: |
      总打开次数（友盟单端），单位：次。来源：odm_umeng_all_threeends.start_num。
      ⚠️ 与ad_dau_idm同理，字段在各品类行重复，必须用max()。

  - name: avg_opens_per_user
    expr: sum(total_opens) / nullif(sum(ad_dau_idm), 0)
    description: 人均打开次数，单位：次/人。sum/sum口径正确（重复倍数在分子分母中抵消）。

  - name: arpu_idm
    expr: sum(ad_revenue) / nullif(sum(ad_dau_idm), 0)
    description: |
      IDM层广告ARPU，单位：元/人。正式口径：广告收入/广告DAU（§4.2）。
      sum/sum口径正确（DAU重复倍数在分母中抵消）。
      仅限同一platform粒度内聚合；跨平台解读时注意DAU含义变化。

  - name: ecpm_idm
    expr: sum(ad_revenue) / nullif(sum(ad_impressions), 0) * 1000
    description: 治理层eCPM，单位：元/千次曝光。字段映射待数据平台核实。

segments:
  - name: domestic
    expr: country = '国内'
    description: 仅国内业务。

  - name: android_platform
    expr: platform = 'Android'
    description: 仅Android平台。

  - name: iphone_platform
    expr: platform = 'iPhone'
    description: 仅iPhone平台。

  - name: effect_type
    expr: revenue_type = '效果'
    description: 效果广告品类。占比最大（~40%）。
