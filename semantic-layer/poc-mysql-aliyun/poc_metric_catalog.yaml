name: poc_metric_catalog

# 行粒度：每行一个指标定义（metric_code 唯一）
# 用途：POC 指标字典，承载口径说明、来源线索、证据等级；
#       Agent 可通过 wiki_search + sl_read_source 读取，作为业务路由和口径参考。
grain:
  - metric_code

measures:
  - name: metric_count
    expr: count(metric_code)
    description: 指标总数。

  - name: high_evidence_count
    expr: sum(case when evidence_level = 'high' then 1 else 0 end)
    description: 高证据等级指标数（表/字段/公式明确）。

  - name: pending_count
    expr: sum(case when pending_confirmation is not null then 1 else 0 end)
    description: 有待确认事项的指标数。

segments:
  - name: by_niuyuting
    expr: owner_name = '牛玉婷'
    description: 牛玉婷负责的指标（FineBI活跃分析域）。

  - name: by_heze
    expr: owner_name = '何洲'
    description: 何洲负责的指标（FineVis广告经营域）。

  - name: by_taozhuhua
    expr: owner_name = '陶峙桦'
    description: 陶峙桦负责的指标（CEO一眼报IDM治理层域）。

  - name: high_evidence
    expr: evidence_level = 'high'
    description: 来源表/字段/公式均已明确的指标。

  - name: medium_evidence
    expr: evidence_level = 'medium'
    description: 部分线索明确、待核实的指标。
