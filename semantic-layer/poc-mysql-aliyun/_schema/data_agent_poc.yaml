tables:
  forbidden_finance:
    table: data_agent_poc.forbidden_finance
    columns:
      - name: dt
        type: time
        pk: true
        nullable: false
        descriptions:
          db: 统计日期，日粒度；dummy 字段，仅用于 ACL deny 演示
      - name: finance_metric
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 财务指标名称，例如净利润、现金流；dummy 字段，不代表真实财务数据
      - name: amount
        type: number
        nullable: false
        descriptions:
          db: 财务指标金额，单位：元；dummy 值，仅用于未授权访问演示
      - name: note
        type: string
        descriptions:
          db: 备注，说明该表不应被 poc_readonly role 授权
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 记录创建时间
    descriptions:
      db: 未授权 dummy 表：模拟财务敏感数据，仅用于 lucy ACL deny 和审计演示
  poc_metric_catalog:
    table: data_agent_poc.poc_metric_catalog
    columns:
      - name: metric_code
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 指标编码，POC 内唯一，例如 dau_noback、ad_revenue、ecpm
          ai: POC 内唯一指标编码
      - name: metric_name
        type: string
        nullable: false
        descriptions:
          db: 指标中文名称，例如 DAU 不含刷新、广告收入、eCPM
          ai: 指标中文业务名称
      - name: owner_name
        type: string
        nullable: false
        descriptions:
          db: 指标业务 owner 姓名，例如牛玉婷、何洲、陶峙桦
          ai: 指标业务负责人姓名
      - name: source_asset
        type: string
        nullable: false
        descriptions:
          db: 来源资产名称，例如 FineBI 活跃分析、FineVis 营业收入-广告、CEO 一眼报溯源报告
          ai: 来源资产如 BI 报表或文档
      - name: source_location
        type: string
        descriptions:
          db: 来源资产中的具体位置，例如 Sheet 编号、widget 名称、docx 章节或页面
          ai: 来源资产中具体位置
      - name: source_table_hint
        type: string
        descriptions:
          db: 原始表或数据集线索，例如 rpt.rpt_app_basic_1d_d、report_r_ymsm、idm_ad_revenue_a_d
          ai: 原始表或数据集线索
      - name: source_field_hint
        type: string
        descriptions:
          db: 原始字段或公式线索，例如 app_aty_user_cnt_1d_noback、广告收入/曝光*1000
          ai: 原始字段或计算公式线索
      - name: formula
        type: string
        descriptions:
          db: 指标计算公式；原子指标可为空，比率指标需写清分子、分母和倍数
          ai: 指标计算公式，原子指标可空
      - name: grain
        type: string
        descriptions:
          db: 指标统计粒度，例如日-包名、日-广告位-国家、日-收入品类-国家
          ai: 指标统计粒度
      - name: dimensions
        type: string
        descriptions:
          db: 指标可分析维度列表，例如日期、包名、广告位、国家、收入品类
          ai: 可分析维度列表
      - name: unit
        type: string
        descriptions:
          db: 指标单位，例如人、次、元、次曝光、元/人、元/千次曝光
          ai: 指标计量单位
      - name: description
        type: string
        descriptions:
          db: 指标业务口径说明，包括适用范围、排除条件、含/不含后台刷新等
          ai: 指标业务口径与适用范围说明
      - name: evidence_level
        type: string
        nullable: false
        descriptions:
          db: 来源证据等级：high=表/字段/公式明确，medium=部分线索明确，low=仅页面或业务名称
          ai: 来源证据等级高低
      - name: pending_confirmation
        type: string
        descriptions:
          db: 待 owner 或数据平台确认的问题，例如字段名待解析、ARPU 双公式待确认
          ai: 待确认问题或字段疑点
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 记录创建时间
          ai: 记录创建时间戳
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 记录最近更新时间
          ai: 记录最近更新时间戳
    descriptions:
      db: POC 指标字典表：承载指标中文口径、来源线索、公式、粒度、维度、证据等级
      ai: POC 阶段指标目录，登记业务指标口径、来源与负责人，支撑溯源
  poc_ad_revenue_by_type_daily:
    table: data_agent_poc.poc_ad_revenue_by_type_daily
    columns:
      - name: dt
        type: time
        pk: true
        nullable: false
        descriptions:
          db: 统计日期，日粒度，北京时间自然日；若 MCP/JSON 以 UTC ISO 展示，需转换为 Asia/Shanghai 业务日期后再解释
          ai: Daily business date in Asia/Shanghai. Convert UTC ISO transport values to Beijing business dates before display or reconciliation.
      - name: revenue_type
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 收入品类，取值：品牌、电商、效果、外包；来自 CEO 一眼报 docx §4.5 IDM 字段描述
      - name: country
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 国家或区域，默认国内；与广告经营表口径对齐
      - name: platform
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 平台维度，取值示例：Android、iPhone、ALL；来源 SQL 中 AndroidLite 合并到 Android，ALL 表示 POC 已聚合到全平台
      - name: ad_revenue
        type: number
        nullable: false
        descriptions:
          db: 分品类广告收入，单位：元；同一日期/国家/业务范围下，四品类合计应等于广告经营表总收入
      - name: ad_impressions
        type: number
        nullable: false
        descriptions:
          db: 分品类广告曝光量，单位：次；用于计算治理层 eCPM
      - name: ad_dau_idm
        type: number
        nullable: false
        descriptions:
          db: IDM 层广告 DAU，单位：人；来源表 odm_umeng_all_threeends，来源字段 act_num，聚合口径为 sum(act_num) as dau
      - name: total_opens
        type: number
        nullable: false
        descriptions:
          db: 总打开次数，单位：次；来源表 odm_umeng_all_threeends，来源字段 start_num，聚合口径为 sum(start_num) as start_num
      - name: avg_opens_per_user_check
        type: number
        nullable: false
        descriptions:
          db: 人均打开次数校验列，单位：次/人；仅供 eval 校验，正式 measure 使用 sum(total_opens)/sum(ad_dau_idm) 重算
      - name: arpu_check
        type: number
        nullable: false
        descriptions:
          db: 广告 ARPU 校验列，单位：元/人；对应 IDM 正式口径广告收入/DAU，正式 measure 使用 sum(ad_revenue)/sum(ad_dau_idm) 重算
      - name: ecpm_idm_check
        type: number
        nullable: false
        descriptions:
          db: 治理层 eCPM 校验列，单位：元/千次曝光；正式 measure 使用 sum(ad_revenue)/sum(ad_impressions)*1000 重算
      - name: consistency_group
        type: string
        descriptions:
          db: 一致性校验分组，用于标识与 poc_ad_revenue_daily 汇总对账的范围，例如同日国内全平台广告收入
      - name: seed_scenario
        type: string
        descriptions:
          db: 造数场景标记，例如效果收入占比最大、品类合计等于总收入
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 记录创建时间
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 记录最近更新时间
    descriptions:
      db: 陶峙桦场景：CEO 一眼报 IDM 治理层模拟日表，按收入品类、国家、平台记录广告收入、曝光、IDM 广告 DAU 和打开次数
  poc_ad_revenue_daily:
    table: data_agent_poc.poc_ad_revenue_daily
    columns:
      - name: dt
        type: time
        pk: true
        nullable: false
        descriptions:
          db: 统计日期，日粒度，北京时间自然日；若 MCP/JSON 以 UTC ISO 展示，需转换为 Asia/Shanghai 业务日期后再解释
          ai: Statistics date at daily granularity, Beijing time natural day. Convert UTC ISO transport values to Asia/Shanghai before display or reconciliation.
      - name: position_name
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 广告位名称，例如开屏、天气首页中部、信息流、详情页
          ai: Ad slot name such as splash, weather home, or feed.
      - name: country
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 国家或区域，默认国内；用于区分国内和国际广告业务
          ai: Country or region distinguishing domestic versus international ad business.
      - name: ad_revenue
        type: number
        nullable: false
        descriptions:
          db: 广告收入，单位：元；何洲 FineVis 广告经营场景核心收入指标
          ai: Ad revenue amount in yuan, core monetization KPI.
      - name: ad_impressions
        type: number
        nullable: false
        descriptions:
          db: 广告曝光量，单位：次；用于计算 eCPM
          ai: Total ad impression count used for eCPM calculation.
      - name: ad_dau
        type: number
        nullable: false
        descriptions:
          db: 广告域 DAU/货币化 DAU，单位：人；不同于产品活跃 DAU，来源可能为友盟三端，待 owner 确认
          ai: Monetized daily active users exposed to ads.
      - name: arpu_check
        type: number
        nullable: false
        descriptions:
          db: 广告 ARPU 校验列，单位：元/人；仅供 eval 校验，正式 measure 暂定 sum(ad_revenue)/sum(ad_dau)，ARPU 双公式待确认
          ai: ARPU verification value in yuan per user for evaluation only.
      - name: ecpm_check
        type: number
        nullable: false
        descriptions:
          db: eCPM 校验列，单位：元/千次曝光；仅供 eval 校验，正式 measure 使用 sum(ad_revenue)/sum(ad_impressions)*1000 重算
          ai: eCPM verification value in yuan per thousand impressions for evaluation.
      - name: seed_scenario
        type: string
        descriptions:
          db: 造数场景标记，例如开屏 eCPM 最高、信息流收入最高
          ai: Synthetic data scenario tag marking special generation cases.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 记录创建时间
          ai: Timestamp when the record was first created.
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 记录最近更新时间
          ai: Timestamp of the most recent record modification.
    descriptions:
      db: 何洲场景：FineVis 营业收入-广告模拟日表，按日期、广告位、国家记录收入、曝光、广告域 DAU
      ai: Daily ad revenue fact table by ad position and country for FineVis monetization scenarios.
  poc_app_active_daily:
    table: data_agent_poc.poc_app_active_daily
    columns:
      - name: dt
        type: time
        pk: true
        nullable: false
        descriptions:
          db: 统计日期，日粒度，北京时间自然日；若 MCP/JSON 以 UTC ISO 展示，需转换为 Asia/Shanghai 业务日期后再解释
          ai: Daily business date in Asia/Shanghai. Convert UTC ISO transport values to Beijing business dates before display or reconciliation.
      - name: pkg_name
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 包名或客户端名称，例如墨迹天气_Android、墨迹天气_iPhone、墨迹天气_Harmony
      - name: dau_noback
        type: number
        nullable: false
        descriptions:
          db: DAU 不含刷新，单位：人；对应 app_aty_user_cnt_1d_noback，iPhone 端不含后台启动
      - name: dau_with_back
        type: number
        nullable: false
        descriptions:
          db: DAU 含刷新，单位：人；对应 app_aty_user_cnt_1d，用于与不含刷新口径对比
      - name: start_cnt_noback
        type: number
        nullable: false
        descriptions:
          db: 日启动次数不含刷新，单位：次；对应 app_start_cnt_1d_noback
      - name: start_cnt_with_back
        type: number
        nullable: false
        descriptions:
          db: 日启动次数含刷新，单位：次；对应 app_start_cnt_1d
      - name: avg_start_cnt_check
        type: number
        nullable: false
        descriptions:
          db: 人均启动次数校验列，单位：次/人；仅供 eval 校验，正式 measure 使用 sum(start_cnt_noback)/sum(dau_noback) 重算
      - name: seed_scenario
        type: string
        descriptions:
          db: 造数场景标记，例如 Android 下降、Harmony 增长、iPhone 稳定
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 记录创建时间
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 记录最近更新时间
    descriptions:
      db: 牛玉婷场景：FineBI 活跃分析模拟日表，按日期和包名记录 DAU 与启动次数
  poc_ceo_metric_snapshot:
    table: data_agent_poc.poc_ceo_metric_snapshot
    columns:
      - name: snapshot_dt
        type: time
        pk: true
        nullable: false
        descriptions:
          db: 标杆快照日期，北京时间自然日，通常对应 CEO 一眼报前端截图或导出日期；若 MCP/JSON 以 UTC ISO 展示，需转换为 Asia/Shanghai 业务日期后再对账
          ai: Benchmark snapshot business date in Asia/Shanghai. Convert UTC ISO transport values to Beijing business dates before comparing with daily facts.
      - name: metric_code
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 指标编码，关联 poc_metric_catalog.metric_code
      - name: metric_name
        type: string
        nullable: false
        descriptions:
          db: 指标中文名称，与快照中展示名称保持一致
      - name: metric_value
        type: number
        nullable: false
        descriptions:
          db: 标杆指标值；单位由 metric_code 对应指标口径决定
      - name: dimension_desc
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 快照维度说明，例如 ALL、品牌、开屏、国内；无维度时填 ALL
      - name: source_page
        type: string
        descriptions:
          db: CEO 一眼报来源页面，例如营业收入-广告、DAU
      - name: benchmark_type
        type: string
        nullable: false
        descriptions:
          db: 标杆类型：owner_screenshot=owner 截图，frontend_export=前端导出，mock_value=模拟值
      - name: tolerance_rule
        type: string
        descriptions:
          db: 数值回归容差规则，例如整数完全一致、金额 ±1 元、比例 ±0.01pp
      - name: note
        type: string
        descriptions:
          db: 快照备注，例如截图文件名、导出口径、待确认事项
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 记录创建时间
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 记录最近更新时间
    descriptions:
      db: 陶峙桦场景：CEO 一眼报标杆快照表，用于 eval 数值一致性回归
