name: poc_app_active_daily

# 行粒度：每行一条 (dt, pkg_name) 的 DAU 与启动次数日汇总
# 来源场景：牛玉婷 — FineBI 活跃分析
# 对应上游：rpt.rpt_app_basic_1d_d
grain:
  - dt
  - pkg_name

measures:
  - name: dau_noback
    expr: sum(dau_noback)
    description: DAU不含刷新，单位：人。iPhone端排除后台启动。FineBI活跃分析的标准口径，优先使用此指标。

  - name: dau_with_back
    expr: sum(dau_with_back)
    description: DAU含刷新，单位：人。与dau_noback之差反映后台刷新规模，两者之比可量化后台刷新影响。

  - name: start_cnt_noback
    expr: sum(start_cnt_noback)
    description: 日启动次数不含刷新，单位：次。

  - name: avg_start_cnt
    expr: sum(start_cnt_noback) / nullif(sum(dau_noback), 0)
    description: 人均启动次数，单位：次/人。必须用sum/sum重算，禁止avg(avg_start_cnt_check)。

  - name: back_refresh_ratio
    expr: (sum(dau_with_back) - sum(dau_noback)) / nullif(sum(dau_with_back), 0)
    description: 后台刷新占含刷新DAU的比例。量化iPhone后台启动对DAU口径的影响。

segments:
  - name: android
    expr: pkg_name = '墨迹天气_Android'
    description: 仅 Android 端。

  - name: iphone
    expr: pkg_name = '墨迹天气_iPhone'
    description: 仅 iPhone 端。

  - name: harmony
    expr: pkg_name = '墨迹天气_Harmony'
    description: 仅鸿蒙端。
