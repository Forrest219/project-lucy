# Spec 149 §5.4 — 运维问数连接的 Manifest（只写物理列）。
#
# 本文件是**仓库模板**，由 `ensureOpsEvidence` 复制到解析后的内容根
# （`<ContentPaths.semanticLayer>/lucy-ops/_schema/main.yaml`），再镜像到
# KTX 读取的项目根同级目录。
#
# 两条硬约束：
# 1. **只写物理列**。派生列（`call_day`）只能写在 overlay 的 `columns:` 块，
#    写进 Manifest 会被静默丢弃（Spec 23 §派生列约束）。
# 2. `table:` 使用 T0 冻结的 physicalTable。当前交付 KTX 0.16.0 的 SQLite
#    目录返回**裸表名**（catalog/db 均为 null），所以是 `ops_calls` 而不是
#    `main.ops_calls`。
tables:
  ops_calls:
    table: ops_calls
    descriptions:
      db: 调用流水（每次工具调用一行）。
      ai: >-
        One row per tool call on the current instance, restricted to default usage
        (protocol handshakes and default-view-excluded eval probes are removed) and
        with this connection's own follow-up calls removed as a whole event.
        The population of this source is **active Agents**: distinct `agent_id`
        within the window. `token_label` is a per-Agent label, not a credential
        identity: two Agents may share one label, and an Agent that deletes and
        recreates the same label produces two indistinguishable labels. Never
        answer `count(distinct token_label)` as business active Tokens or as
        active users — use the usage overview for that population. `generated_sql`
        is a high-cardinality attribute: take it out of details only after
        filtering by table, Agent, outcome or `request_id`, and never use it as a
        default grouping.
    columns:
      - name: event_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 事件 ID
          ai: Stable identifier of the access log row behind this call.
      - name: ts
        type: time
        nullable: false
        descriptions:
          db: 调用时间（UTC ISO-8601）
          ai: UTC ISO-8601 timestamp of the call.
      - name: agent_id
        type: string
        nullable: false
        descriptions:
          db: Agent ID
          ai: The Agent that made the call. Distinct `agent_id` in the window is the active Agent population.
      - name: token_label
        type: string
        descriptions:
          db: Token 标签（同一 Agent 内有效）
          ai: >-
            Label attached to the Token used for this call. Unique within one Agent
            only; it is not a credential identity and must not be counted as a
            Token population.
      - name: tool
        type: string
        nullable: false
        descriptions:
          db: 工具名
          ai: Name of the MCP tool that was called.
      - name: outcome
        type: string
        nullable: false
        descriptions:
          db: 结果（ok / denied / error）
          ai: "Call result: ok, denied or error."
      - name: duration_ms
        type: number
        nullable: false
        descriptions:
          db: 耗时（毫秒）
          ai: Wall-clock duration of the call in milliseconds.
      - name: decision_reason
        type: string
        descriptions:
          db: 裁决原因
          ai: Why the call was allowed or denied; empty when not applicable.
      - name: error_detail
        type: string
        descriptions:
          db: 错误详情
          ai: Error text recorded for the call, when there was one.
      - name: generated_sql
        type: string
        descriptions:
          db: 生成 SQL
          ai: >-
            SQL generated for this call. High cardinality: read it from filtered
            details, not as a default grouping.
      - name: tables_json
        type: string
        descriptions:
          db: 涉及数据表（JSON）
          ai: JSON list of the tables the call touched.
      - name: request_id
        type: string
        nullable: false
        descriptions:
          db: 请求 ID
          ai: Request identifier of the call; the stable key for one call.
  ops_call_tables:
    table: ops_call_tables
    descriptions:
      db: 调用流水与涉及数据表（一行一个来源表）。
      ai: >-
        One row per (call, source table) pair, restricted to default usage and
        with this connection's own follow-up calls removed as a whole event — the
        same event set as `ops_calls`, so the two views never disagree. Use it to
        answer which table was queried most, and to take out denied rows and
        their generated SQL for one specific table. `token_label` is a per-Agent
        label, not a credential identity.
    columns:
      - name: event_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 事件 ID
          ai: Identifier of the access log row behind this call.
      - name: ts
        type: time
        nullable: false
        descriptions:
          db: 调用时间（UTC ISO-8601）
          ai: UTC ISO-8601 timestamp of the call.
      - name: agent_id
        type: string
        nullable: false
        descriptions:
          db: Agent ID
          ai: The Agent that made the call.
      - name: token_label
        type: string
        descriptions:
          db: Token 标签（同一 Agent 内有效）
          ai: Label attached to the Token used for this call; not a credential identity.
      - name: tool
        type: string
        nullable: false
        descriptions:
          db: 工具名
          ai: Name of the MCP tool that was called.
      - name: outcome
        type: string
        nullable: false
        descriptions:
          db: 结果（ok / denied / error）
          ai: "Call result: ok, denied or error."
      - name: duration_ms
        type: number
        nullable: false
        descriptions:
          db: 耗时（毫秒）
          ai: Wall-clock duration of the call in milliseconds.
      - name: decision_reason
        type: string
        descriptions:
          db: 裁决原因
          ai: Why the call was allowed or denied; empty when not applicable.
      - name: error_detail
        type: string
        descriptions:
          db: 错误详情
          ai: Error text recorded for the call, when there was one.
      - name: generated_sql
        type: string
        descriptions:
          db: 生成 SQL
          ai: >-
            SQL generated for this call. High cardinality: read it out of details
            only after filtering by table, Agent, outcome or `request_id`.
      - name: request_id
        type: string
        nullable: false
        descriptions:
          db: 请求 ID
          ai: Request identifier of the call; the stable key for one call.
      - name: connection_id
        type: string
        descriptions:
          db: 连接 ID
          ai: Connection the touched table belongs to; empty when the attribution is unknown.
      - name: schema_name
        type: string
        descriptions:
          db: schema 名
          ai: Schema of the touched table.
      - name: source_name
        type: string
        descriptions:
          db: 语义源名
          ai: Semantic-layer source name of the touched table.
      - name: physical_table
        type: string
        nullable: false
        descriptions:
          db: 物理表名
          ai: Physical table the call touched.
  ops_agents:
    table: ops_agents
    descriptions:
      db: 配置 Agent 人口（治理投影快照行）。
      ai: >-
        One row per configured Agent from access.yaml for a governance snapshot
        (`snapshot_id`). Population is the configured Agent set (including
        disabled). Use `agent_count` for Q1 configured Agent population; sum
        `available_token_count` for available Token population. Never answer
        `count(distinct token_label)` as a Token population. Filter by
        `snapshot_id` is injected by the proxy; do not invent zeros when the
        governance snapshot is unready.
    columns:
      - name: snapshot_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 物化代次
          ai: materialization_id of the governance snapshot.
      - name: agent_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: Agent ID
          ai: Configured Agent id from access.yaml.
      - name: agent_name
        type: string
        descriptions:
          db: Agent 显示名
          ai: Display name of the Agent.
      - name: enabled
        type: number
        nullable: false
        descriptions:
          db: 是否启用（1/0）
          ai: 1 when the Agent is enabled; 0 when disabled. Still counted in configured population.
      - name: role_id
        type: string
        descriptions:
          db: 绑定 Role ID
          ai: Role id bound to the Agent.
      - name: configured_token_count
        type: number
        nullable: false
        descriptions:
          db: 配置 Token 数
          ai: Number of Token entries on the Agent roster row.
      - name: available_token_count
        type: number
        nullable: false
        descriptions:
          db: 可用 Token 数
          ai: Roster availableTokenCount (enabled Agent, non-expired Tokens).
  ops_tokens:
    table: ops_tokens
    descriptions:
      db: Agent×token_label 调用量（问数归因 E）。
      ai: >-
        Call counts grouped by (agent_id, token_label) on the default-usage ∧
        self-exclusion event set (D23=E). Not aligned with the access-map
        credential-list aggregation. Same label across Agents is not one
        credential. Never use distinct token_label as a population.
    columns:
      - name: snapshot_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 物化代次
          ai: materialization_id of the governance snapshot.
      - name: agent_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: Agent ID
          ai: Agent that owns this token_label usage row.
      - name: token_label
        type: string
        pk: true
        nullable: false
        descriptions:
          db: Token 标签
          ai: Per-Agent label; not a credential identity across Agents.
      - name: call_count
        type: number
        nullable: false
        descriptions:
          db: 调用次数
          ai: Default-usage call count for (agent_id, token_label) in the window.
      - name: last_used
        type: time
        descriptions:
          db: 最近调用时间
          ai: Latest call timestamp for this (agent_id, token_label) in the window.
  ops_agent_activity:
    table: ops_agent_activity
    descriptions:
      db: 窗口活跃 Agent 日粒度（UTC call_day）。
      ai: >-
        Agent × UTC call_day activity from the same event set as ops_calls
        (default usage ∧ self-exclusion). Use for Q2 window-active Agents.
        Say in the answer that call_day is UTC. Silent Agents are configured
        population minus distinct agent_id here — not Spec 189 near-N active.
    columns:
      - name: snapshot_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 物化代次
          ai: materialization_id of the governance snapshot.
      - name: agent_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: Agent ID
          ai: Active Agent id in the window.
      - name: call_day
        type: time
        pk: true
        nullable: false
        descriptions:
          db: 调用日（UTC）
          ai: UTC calendar day (date(ts)).
      - name: call_count
        type: number
        nullable: false
        descriptions:
          db: 当日调用次数
          ai: Default-usage call count for the Agent on that UTC day.
  ops_question_kpi_agents:
    table: ops_question_kpi_agents
    descriptions:
      db: Agent×窗 MECE 五档（Q4）。
      ai: >-
        One row per configured Agent with a MECE tier for the query window
        (deepest wins ⑤→①). Tiers: window_no_record, window_connect_only,
        window_soft_usage (includes failed begin), window_query_without_ask,
        window_question_active. Never say 「从未连接」. Tool/question boundary
        follows Spec 194 access grades; real questions are reported
        conversation_turns.
    columns:
      - name: snapshot_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 物化代次
          ai: materialization_id of the governance snapshot.
      - name: agent_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: Agent ID
          ai: Configured Agent id.
      - name: tier
        type: string
        nullable: false
        descriptions:
          db: MECE 档位键
          ai: Machine tier id (window_*).
      - name: tier_label
        type: string
        nullable: false
        descriptions:
          db: MECE 主术语
          ai: Canonical Chinese tier term from the terminology standard.
      - name: protocol_count
        type: number
        nullable: false
        descriptions:
          db: 协议事件数
          ai: Protocol handshake/probe count in the window.
      - name: default_usage_count
        type: number
        nullable: false
        descriptions:
          db: 默认用量次数
          ai: Default-usage ∧ self-exclusion call count.
      - name: query_count
        type: number
        nullable: false
        descriptions:
          db: 查数次数
          ai: accessGrade=query call count in the window.
      - name: real_question_count
        type: number
        nullable: false
        descriptions:
          db: 真实问询数
          ai: Reported conversation_turns count for the Agent in the window.
  ops_grant_paths:
    table: ops_grant_paths
    descriptions:
      db: 授权路径（治理投影，同源 access-map builder）。
      ai: >-
        One authorization path per (agent, role, connection, schema, source)
        from buildAccessMap pathRefs.grant. Filter by snapshot_id (proxy-injected).
        Do not invent a second path algorithm. Token focus must not change this set.
    columns:
      - name: snapshot_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 物化代次
          ai: materialization_id of the governance snapshot.
      - name: path_key
        type: string
        pk: true
        nullable: false
        descriptions:
          db: pathKey
          ai: Stable grant path key from grantPathKey.
      - name: agent_id
        type: string
        nullable: false
        descriptions:
          db: Agent ID
          ai: Agent on the grant path.
      - name: role_id
        type: string
        nullable: false
        descriptions:
          db: Role ID
          ai: Role on the grant path.
      - name: connection_id
        type: string
        nullable: false
        descriptions:
          db: 连接 ID
          ai: Connection id on the grant path.
      - name: schema_name
        type: string
        nullable: false
        descriptions:
          db: schema 名
          ai: Schema on the grant path.
      - name: source_name
        type: string
        nullable: false
        descriptions:
          db: 语义源名
          ai: Semantic source name on the grant path.
      - name: physical_table
        type: string
        descriptions:
          db: 物理表名
          ai: Physical table when known.
  ops_access_paths:
    table: ops_access_paths
    descriptions:
      db: 访问路径（治理投影，同源 access-map builder）。
      ai: >-
        Access paths from buildAccessMap pathRefs.access (allow outcomes in window).
        Deny does not create an access path. Token focus may narrow this set.
    columns:
      - name: snapshot_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 物化代次
          ai: materialization_id of the governance snapshot.
      - name: path_key
        type: string
        pk: true
        nullable: false
        descriptions:
          db: pathKey
          ai: Stable access path key from accessPathKey.
      - name: agent_id
        type: string
        nullable: false
        descriptions:
          db: Agent ID
          ai: Agent on the access path.
      - name: role_id
        type: string
        nullable: false
        descriptions:
          db: Role ID
          ai: Role on the access path.
      - name: connection_id
        type: string
        nullable: false
        descriptions:
          db: 连接 ID
          ai: Connection id on the access path.
      - name: schema_name
        type: string
        nullable: false
        descriptions:
          db: schema 名
          ai: Schema on the access path.
      - name: source_name
        type: string
        nullable: false
        descriptions:
          db: 语义源名
          ai: Semantic source name on the access path.
  ops_edge_signals:
    table: ops_edge_signals
    descriptions:
      db: 边状态与确凿越权布尔（治理投影）。
      ai: >-
        Edges from buildAccessMap with state and confirmed_unauthorized boolean
        (confirmedUnauthorized). Wording follows Spec 187.
    columns:
      - name: snapshot_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 物化代次
          ai: materialization_id of the governance snapshot.
      - name: edge_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 边 ID
          ai: Edge id from the builder.
      - name: source_id
        type: string
        nullable: false
        descriptions:
          db: 源节点 ID
          ai: Source node id.
      - name: target_id
        type: string
        nullable: false
        descriptions:
          db: 目标节点 ID
          ai: Target node id.
      - name: state
        type: string
        nullable: false
        descriptions:
          db: 边状态
          ai: dormant / needs_review / overflow / (other builder states).
      - name: confirmed_unauthorized
        type: number
        nullable: false
        descriptions:
          db: 确凿越权（1/0）
          ai: Boolean confirmedUnauthorized from the builder (1=true).
      - name: grant_paths
        type: number
        nullable: false
        descriptions:
          db: 授权路径数
          ai: Grant path count on the edge.
      - name: access_paths
        type: number
        nullable: false
        descriptions:
          db: 访问路径数
          ai: Access path count on the edge.
      - name: access_calls
        type: number
        nullable: false
        descriptions:
          db: 访问调用数
          ai: Distinct access calls on the edge.
  ops_map_nodes:
    table: ops_map_nodes
    descriptions:
      db: 访问关系图节点（治理投影）。
      ai: Nodes from buildAccessMap (agent/role/connection/schema/table/token).
    columns:
      - name: snapshot_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 物化代次
          ai: materialization_id of the governance snapshot.
      - name: node_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 节点 ID
          ai: Node id from the builder.
      - name: kind
        type: string
        nullable: false
        descriptions:
          db: 节点类型
          ai: agent / role / connection / schema / table / token.
      - name: label
        type: string
        descriptions:
          db: 显示名
          ai: Display label.
      - name: depth
        type: number
        nullable: false
        descriptions:
          db: 层深
          ai: Layout depth.
      - name: grant_paths
        type: number
        nullable: false
        descriptions:
          db: 授权路径数
          ai: Grant paths through the node.
      - name: access_paths
        type: number
        nullable: false
        descriptions:
          db: 访问路径数
          ai: Access paths through the node.
  ops_map_meta:
    table: ops_map_meta
    descriptions:
      db: 图快照汇总（counts／raw／denied／coverage／orphan／versions）。
      ai: >-
        One row per snapshot with builder meta.counts.grantPaths/accessPaths,
        meta.access.rawCalls/deniedCalls, summarizeSnapshotCoverage (pathKey
        dedupe, D28), orphan_grants and config versions. Align to builder meta,
        not the chart page KPI strip or credential-list call counts.
    columns:
      - name: snapshot_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 物化代次
          ai: materialization_id of the governance snapshot.
      - name: grant_paths
        type: number
        nullable: false
        descriptions:
          db: 授权路径总数
          ai: meta.counts.grantPaths.
      - name: access_paths
        type: number
        nullable: false
        descriptions:
          db: 访问路径总数
          ai: meta.counts.accessPaths.
      - name: raw_calls
        type: number
        nullable: false
        descriptions:
          db: 原始调用数
          ai: meta.access.rawCalls.
      - name: denied_calls
        type: number
        nullable: false
        descriptions:
          db: 拒绝调用数
          ai: meta.access.deniedCalls.
      - name: coverage_review_paths
        type: number
        nullable: false
        descriptions:
          db: 覆盖率分母
          ai: snapshotCoverage.reviewPaths (pathKey dedupe).
      - name: coverage_matched
        type: number
        nullable: false
        descriptions:
          db: 覆盖率分子
          ai: snapshotCoverage.matched.
      - name: coverage_missing_or_invalid
        type: number
        nullable: false
        descriptions:
          db: 缺失或无效
          ai: snapshotCoverage.missingOrInvalid.
      - name: coverage_ratio
        type: number
        nullable: false
        descriptions:
          db: 覆盖率
          ai: snapshotCoverage.ratio.
      - name: orphan_grants
        type: number
        nullable: false
        descriptions:
          db: 孤儿授权数
          ai: meta.orphanGrants.
      - name: access_config_version
        type: string
        descriptions:
          db: access 配置代际
          ai: accessConfigVersion.
      - name: policy_version
        type: string
        descriptions:
          db: 策略代际
          ai: policyVersion.
      - name: source_map_version
        type: string
        descriptions:
          db: source map 代际
          ai: sourceMapVersion.
      - name: capability_digest
        type: string
        descriptions:
          db: 能力摘要
          ai: capabilityDigest.
      - name: grant_state
        type: string
        descriptions:
          db: 授权面状态
          ai: meta.grant.state.
      - name: access_state
        type: string
        descriptions:
          db: 访问面状态
          ai: meta.access.state.
      - name: trust
        type: string
        descriptions:
          db: trust 口径
          ai: confirmed or include_candidate.
  ops_table_adoption:
    table: ops_table_adoption
    descriptions:
      db: 表采用／近窗未访问／表活跃率（Q5／Q6）。
      ai: >-
        Population is grant-resolvable / enabled tables (authorization surface),
        not only tables seen in logs. window_unvisited = no allow non-probe access
        in the window (D17=C). activity_rate = active_days/denom_days (D19);
        Asia/Shanghai calendar days; deny and eval probes do not count. Never
        answer Q5 as 「从未访问」 or 「上线 30 天从未访问」 — rephrase to 近窗未访问.
    columns:
      - name: snapshot_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 物化代次
          ai: materialization_id of the governance snapshot.
      - name: connection_id
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 连接 ID
          ai: Connection of the authorized table.
      - name: schema_name
        type: string
        pk: true
        nullable: false
        descriptions:
          db: schema 名
          ai: Schema of the authorized table.
      - name: source_name
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 语义源名
          ai: Semantic source name of the authorized table.
      - name: physical_table
        type: string
        descriptions:
          db: 物理表名
          ai: Physical table when known.
      - name: window_unvisited
        type: number
        nullable: false
        descriptions:
          db: 近窗未访问（1/0）
          ai: 1 when no allow non-probe access in the query window.
      - name: active_days
        type: number
        nullable: false
        descriptions:
          db: 活跃天数
          ai: Distinct Asia/Shanghai days with access in the window.
      - name: denom_days
        type: number
        nullable: false
        descriptions:
          db: 分母天数
          ai: Shanghai calendar days intersecting [start,end); <1 → activity_rate null.
      - name: activity_rate
        type: number
        descriptions:
          db: 表活跃率
          ai: active_days/denom_days when denom_days>=1; else null.
      - name: days_online_in_window
        type: number
        nullable: false
        descriptions:
          db: 窗内在线天数披露
          ai: Currently equals denom_days (online anchor out of scope for Q5).
