tables:
  superstore_orders:
    table: dataforai.superstore_orders
    columns:
      - name: row_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 行 ID
          ai: Surrogate integer key uniquely identifying each order line item row.
      - name: order_id
        type: string
        nullable: false
        descriptions:
          db: 订单 ID
          ai: Business key grouping multiple line items belonging to one order.
      - name: order_date
        type: time
        nullable: false
        descriptions:
          db: 订单日期
          ai: Date the customer placed the order.
      - name: ship_date
        type: time
        nullable: false
        descriptions:
          db: 发货日期
          ai: Date the order was dispatched for delivery.
      - name: ship_mode
        type: string
        descriptions:
          db: 装运模式
          ai: Delivery speed tier chosen for the shipment.
      - name: customer_id
        type: string
        descriptions:
          db: 客户 ID
          ai: Unique business identifier for the purchasing customer.
      - name: customer_name
        type: string
        descriptions:
          db: 客户名称
          ai: Full name of the purchasing customer.
      - name: segment
        type: string
        descriptions:
          db: 细分
          ai: Market segment of the customer.
      - name: city
        type: string
        descriptions:
          db: 城市
          ai: City of the delivery destination.
      - name: province
        type: string
        descriptions:
          db: 省/自治区
          ai: Province or autonomous region of the delivery address.
      - name: country_region
        type: string
        descriptions:
          db: 国家/地区
          ai: Country or territory of the delivery destination.
      - name: region
        type: string
        descriptions:
          db: 区域
          ai: Broad geographic sales region grouping multiple provinces.
      - name: product_id
        type: string
        descriptions:
          db: 产品 ID
          ai: Unique identifier for the ordered product SKU.
      - name: category
        type: string
        descriptions:
          db: 类别
          ai: Top-level product classification.
      - name: sub_category
        type: string
        descriptions:
          db: 子类别
          ai: Second-level product classification.
      - name: product_name
        type: string
        descriptions:
          db: 产品名称
          ai: Full descriptive name of the ordered product.
      - name: sales
        type: number
        descriptions:
          db: 销售额
          ai: Total revenue for the line item after discount is applied.
      - name: quantity
        type: number
        descriptions:
          db: 数量
          ai: Number of product units ordered in this line item.
      - name: discount
        type: number
        descriptions:
          db: 折扣
          ai: Fractional discount rate applied to the line item price.
      - name: profit
        type: number
        descriptions:
          db: 利润
          ai: Net profit earned on the line item after deducting costs.
      - name: postal_code
        type: string
        descriptions:
          db: 邮政编码
          ai: Postal code of the delivery address.
      - name: source_system
        type: string
        nullable: false
        descriptions:
          db: 来源系统
          ai: Name of the originating system that provided this data.
      - name: source_file
        type: string
        nullable: false
        descriptions:
          db: 来源文件
          ai: File path of the source document from which data was loaded.
      - name: source_sheet
        type: string
        nullable: false
        descriptions:
          db: 来源工作表
          ai: Worksheet name within the source file containing this data.
      - name: source_row_number
        type: number
        nullable: false
        descriptions:
          db: 来源文件行号
          ai: Row number in the source file for lineage traceability.
      - name: batch_id
        type: string
        nullable: false
        descriptions:
          db: 导入批次 ID
          ai: Identifier for the ETL import batch that loaded this record.
      - name: row_hash
        type: string
        nullable: false
        descriptions:
          db: 业务字段 SHA-256 哈希
          ai: SHA-256 hash of business fields used for change detection.
      - name: is_deleted
        type: number
        nullable: false
        descriptions:
          db: 逻辑删除标记
          ai: Soft-delete flag; 1 indicates logically deleted, 0 indicates active.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 入库时间
          ai: Timestamp when the record was first inserted into the database.
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
          ai: Timestamp of the most recent update to the record.
    descriptions:
      db: Demo 超市订单 ODS 明细表
      ai: Demo superstore order line items for Lucy Docker smoke tests.
  superstore_people:
    table: dataforai.superstore_people
    columns:
      - name: region
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 区域
          ai: Geographic sales region name.
      - name: regional_manager
        type: string
        nullable: false
        descriptions:
          db: 区域经理
          ai: Manager responsible for the region.
      - name: source_system
        type: string
        nullable: false
      - name: source_file
        type: string
        nullable: false
      - name: source_sheet
        type: string
        nullable: false
      - name: source_row_number
        type: number
        nullable: false
      - name: batch_id
        type: string
        nullable: false
      - name: row_hash
        type: string
        nullable: false
      - name: is_deleted
        type: number
        nullable: false
      - name: created_at
        type: time
        nullable: false
      - name: updated_at
        type: time
        nullable: false
    descriptions:
      db: Demo 超市区域人员表
      ai: Demo region-manager mapping.
  superstore_returns:
    table: dataforai.superstore_returns
    columns:
      - name: id
        type: number
        pk: true
        nullable: false
      - name: order_id
        type: string
        nullable: false
      - name: returned
        type: string
        nullable: false
      - name: source_system
        type: string
        nullable: false
      - name: source_file
        type: string
        nullable: false
      - name: source_sheet
        type: string
        nullable: false
      - name: source_row_number
        type: number
        nullable: false
      - name: batch_id
        type: string
        nullable: false
      - name: row_hash
        type: string
        nullable: false
      - name: is_deleted
        type: number
        nullable: false
      - name: created_at
        type: time
        nullable: false
      - name: updated_at
        type: time
        nullable: false
    descriptions:
      db: Demo 超市退货表
      ai: Demo return status records.
