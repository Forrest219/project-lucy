# 投放账户日级漏斗（standalone source，供 WebUI 上传）。
# 含全部物理列 + measures/segments。单表无 joins。
# 列上不含 pk/nullable（KTX TS/Python contract）。

name: ad_account_daily
table: dataforai.ad_account_daily
descriptions:
  human: '投放账户日级漏斗。粒度：广告账户 × 日。

    漏斗：有效客户 → 优质客户 → 良好客户 → 预约。

    默认「获客成本 / CPA」= 预约 CPA = sum(spend)/sum(appointments)，禁止对日 CPA 再平均。

    相对时间锚定本表 max(date)，不用系统今天。

    '
  ai: '投放账户日漏斗。grain=账户×日。默认 CPA=预约 CPA（SUM/SUM）。

    相对「最近」锚定 max(date)。自运营/代理看 account_name 是否含对应文字。

    '
grain:
- date
- account_name
columns:
- name: date
  type: time
  role: time
  descriptions:
    db: 投放业务日。相对「最近/本周/近N天」锚定本表 max(date)，不用系统今天。
    ai: 投放日期；相对时间锚定 max(date)。
- name: account_name
  type: string
  descriptions:
    db: 广告账户名。含「自运营」或「代理」表示运营类型（无独立字段）。每个账户固定对应一个渠道、一个客户等级。
    ai: 账户名；自运营/代理从名称识别；账户与渠道绑定。
- name: channel
  type: string
  descriptions:
    db: 投放渠道。枚举：巨量引擎 / 腾讯广告 / 百度营销 / 小红书 / 快手磁力引擎。调渠道预算=调该渠道下账户花费。
    ai: 投放渠道。
- name: customer_level
  type: string
  descriptions:
    db: 账户客户等级。枚举：A级 / B级 / C级。
    ai: 客户等级 A/B/C。
- name: spend
  type: number
  descriptions:
    db: 当日广告花费，单位元人民币。业务别名：花费、消耗。
    ai: 日花费（元）。
- name: valid_customers
  type: number
  descriptions:
    db: 当日有效客户数。漏斗最上层；应 ≥ quality_customers。
    ai: 有效客户数。
- name: quality_customers
  type: number
  descriptions:
    db: 当日优质客户数。应满足 valid_customers ≥ quality_customers ≥ good_customers。
    ai: 优质客户数。
- name: good_customers
  type: number
  descriptions:
    db: 当日良好客户数。应 ≥ appointments。
    ai: 良好客户数。
- name: appointments
  type: number
  descriptions:
    db: 当日预约数。漏斗最下层。默认 CPA / 获客成本分母。
    ai: 预约数。
measures:
- name: spend
  expr: sum(spend)
  description: 广告花费合计，单位元人民币。
- name: valid_customers
  expr: sum(valid_customers)
  description: 有效客户合计，单位人。
- name: quality_customers
  expr: sum(quality_customers)
  description: 优质客户合计，单位人。
- name: good_customers
  expr: sum(good_customers)
  description: 良好客户合计，单位人。
- name: appointments
  expr: sum(appointments)
  description: 预约合计，单位人/次。
- name: 预约CPA
  expr: sum(spend) / nullif(sum(appointments), 0)
  description: '预约 CPA / 默认获客成本 = 花费合计 ÷ 预约合计。

    必须 SUM/SUM，禁止 AVG(日CPA) 或先按日算再平均。

    '
- name: 有效客户CPA
  expr: sum(spend) / nullif(sum(valid_customers), 0)
  description: 有效客户 CPA = 花费合计 ÷ 有效客户合计。须 SUM/SUM。
- name: 优质客户CPA
  expr: sum(spend) / nullif(sum(quality_customers), 0)
  description: 优质客户 CPA = 花费合计 ÷ 优质客户合计。须 SUM/SUM。
- name: 良好客户CPA
  expr: sum(spend) / nullif(sum(good_customers), 0)
  description: 良好客户 CPA = 花费合计 ÷ 良好客户合计。须 SUM/SUM。
- name: 优质率
  expr: sum(quality_customers) / nullif(sum(valid_customers), 0)
  description: 优质率 = 优质客户合计 ÷ 有效客户合计。须 SUM/SUM。
- name: 良好转化率
  expr: sum(good_customers) / nullif(sum(quality_customers), 0)
  description: 良好转化率 = 良好客户合计 ÷ 优质客户合计。
- name: 预约转化率
  expr: sum(appointments) / nullif(sum(good_customers), 0)
  description: 预约转化率 = 预约合计 ÷ 良好客户合计。
- name: 有效到预约转化率
  expr: sum(appointments) / nullif(sum(valid_customers), 0)
  description: 有效→预约转化率 = 预约合计 ÷ 有效客户合计。
- name: appointment_cpa
  expr: sum(spend) / nullif(sum(appointments), 0)
  description: 预约 CPA（ASCII 别名）= 花费合计÷预约合计。须 SUM/SUM。
- name: valid_customer_cpa
  expr: sum(spend) / nullif(sum(valid_customers), 0)
  description: 有效客户 CPA（ASCII 别名）。
- name: quality_rate
  expr: sum(quality_customers) / nullif(sum(valid_customers), 0)
  description: 优质率（ASCII 别名）。
- name: valid_to_appointment_rate
  expr: sum(appointments) / nullif(sum(valid_customers), 0)
  description: 有效→预约转化率（ASCII 别名）。
segments:
- name: 自运营
  expr: account_name LIKE '%自运营%'
  description: 账户名含「自运营」的行。
- name: 代理
  expr: account_name LIKE '%代理%'
  description: 账户名含「代理」的行。
- name: 巨量引擎
  expr: channel = '巨量引擎'
  description: 巨量引擎渠道。
- name: 腾讯广告
  expr: channel = '腾讯广告'
  description: 腾讯广告渠道。
- name: 百度营销
  expr: channel = '百度营销'
  description: 百度营销渠道。
- name: 小红书
  expr: channel = '小红书'
  description: 小红书渠道。
- name: 快手磁力引擎
  expr: channel = '快手磁力引擎'
  description: 快手磁力引擎渠道。
