name: kx_vw_balance_sheet_detail

# Period derived columns are intentionally duplicated across the three KX
# statement views. Keep the six `期间*` columns in sync when editing.
descriptions:
  human: >-
    KX 资产负债表明细视图。用于回答资产负债率、流动比率、资产/负债/所有者权益合计、
    资产负债表关键行和按展示顺序查看资产负债表等报表展示口径问题。默认金额口径为
    `期末余额`；需要期初对比时使用 `年初余额`。资产负债表是时点报表，不存在利润表/
    现金流量表的 `本月金额` / `本年累计金额` 展示口径。如果用户明确要求底层金额明细、
    amount_type、quarter_no、来源追溯或自定义事实聚合，应改走 `kx_fact_financial_amount`。
  ai: >-
    Balance sheet statement-layout view. Prefer this source for debt-to-asset
    ratio, current ratio, total assets, total liabilities, total equity,
    balance sheet key rows, and display-order questions. Default amount field is
    `期末余额`; use `年初余额` only for beginning-balance comparison. Balance
    sheets are point-in-time statements and do not have `本月金额` /
    `本年累计金额` display fields. Use `kx_fact_financial_amount` instead for
    underlying detail rows, amount_type, quarter_no, lineage fields, or custom
    fact aggregation.

grain:
  - 公司名称
  - 报表期间
  - 项目名称

columns:
  - name: 期间年份
    type: number
    expr: CASE WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL ELSE (SUBSTRING(`报表期间`, 1, 4) + 0) END
    descriptions:
      db: 报表期间年份，从 YYYYMM 派生。
      ai: Year derived from reporting period.

  - name: 期间月份
    type: number
    expr: CASE WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL ELSE (SUBSTRING(`报表期间`, 5, 2) + 0) END
    descriptions:
      db: 报表期间月份，从 YYYYMM 派生。
      ai: Month derived from reporting period.

  - name: 期间月份标签
    type: string
    expr: CASE WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL ELSE CONCAT(SUBSTRING(`报表期间`, 1, 4), '-', SUBSTRING(`报表期间`, 5, 2)) END
    descriptions:
      db: 月份标签，例如 2026-05。
      ai: Month label such as 2026-05.

  - name: 期间季度
    type: number
    expr: CASE WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL ELSE CEILING((SUBSTRING(`报表期间`, 5, 2) + 0) / 3) END
    descriptions:
      db: 报表期间所属季度，1-4。
      ai: Quarter number derived from reporting period.

  - name: 期间季度标签
    type: string
    expr: CASE WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL ELSE CONCAT(SUBSTRING(`报表期间`, 1, 4), 'Q', CEILING((SUBSTRING(`报表期间`, 5, 2) + 0) / 3)) END
    descriptions:
      db: 季度标签，例如 2026Q1。
      ai: Quarter label such as 2026Q1.

  - name: 是否季末月份
    type: number
    expr: >-
      CASE
        WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL
        WHEN (SUBSTRING(`报表期间`, 5, 2) + 0) IN (3, 6, 9, 12) THEN 1
        ELSE 0
      END
    descriptions:
      db: 是否为季度末月份：1 = 是（3/6/9/12 月），0 = 否；报表期间为 NULL 或非 6 位时返回 NULL（不可判定）。
      ai: Quarter-close month flag; 1 yes, 0 no, null when report_period is missing or malformed.

measures:
  - name: 资产合计_期末余额
    expr: sum(case when `项目名称` = '资产合计' then `期末余额` else null end)
    description: 资产合计期末余额；资产负债表默认资产总额口径。未找到对应合计行时返回 NULL，不代表金额为 0。

  - name: 负债合计_期末余额
    expr: sum(case when `项目名称` = '负债合计' then `期末余额` else null end)
    description: 负债合计期末余额；资产负债率分子。未找到对应合计行时返回 NULL，不代表金额为 0。

  - name: 所有者权益合计_期末余额
    expr: sum(case when `项目名称` = '所有者权益合计' then `期末余额` else null end)
    description: 所有者权益合计期末余额。未找到对应合计行时返回 NULL，不代表金额为 0。

  - name: 资产负债率
    expr: sum(case when `项目名称` = '负债合计' then `期末余额` else null end) / nullif(sum(case when `项目名称` = '资产合计' then `期末余额` else null end), 0)
    description: 负债合计期末余额 / 资产合计期末余额。若分子/分母合计行缺失或资产合计为 0，则返回 NULL；NULL 表示不可计算，不代表 0。

  - name: 权益比率
    expr: sum(case when `项目名称` = '所有者权益合计' then `期末余额` else null end) / nullif(sum(case when `项目名称` = '资产合计' then `期末余额` else null end), 0)
    description: 所有者权益合计期末余额 / 资产合计期末余额。若分子/分母合计行缺失或资产合计为 0，则返回 NULL；NULL 表示不可计算，不代表 0。

  - name: 流动资产合计_期末余额
    expr: sum(case when `项目名称` = '流动资产合计' then `期末余额` else null end)
    description: 流动资产合计期末余额；流动比率分子。未找到对应合计行时返回 NULL，不代表金额为 0。

  - name: 流动负债合计_期末余额
    expr: sum(case when `项目名称` = '流动负债合计' then `期末余额` else null end)
    description: 流动负债合计期末余额；流动比率分母。未找到对应合计行时返回 NULL，不代表金额为 0。

  - name: 流动比率
    expr: sum(case when `项目名称` = '流动资产合计' then `期末余额` else null end) / nullif(sum(case when `项目名称` = '流动负债合计' then `期末余额` else null end), 0)
    description: 流动资产合计期末余额 / 流动负债合计期末余额。若分子/分母合计行缺失或流动负债合计为 0，则返回 NULL；NULL 表示不可计算，不代表 0。
