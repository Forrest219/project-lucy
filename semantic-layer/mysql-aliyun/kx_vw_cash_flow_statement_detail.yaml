name: kx_vw_cash_flow_statement_detail

# Period derived columns are intentionally duplicated across the three KX
# statement views. Keep the six `期间*` columns in sync when editing.
descriptions:
  human: >-
    KX 现金流量表明细视图。用于回答经营活动、投资活动、筹资活动现金流量净额，
    期末现金余额、现金流结构和按期间查看现金流量表等报表展示口径问题。默认金额口径：
    “2026 年 / 截至某月 / 截至 Q1”等累计问题使用 `本年累计金额`；“每月 / 月度”
    问题使用 `本月金额`。如果用户明确问单季度发生额、amount_type、quarter_no、
    来源追溯或底层金额明细，应改走 `kx_fact_financial_amount`。
  ai: >-
    Cash flow statement-layout view. Prefer this source for operating,
    investing, and financing cash flow net amounts, ending cash balance, cash
    flow structure, and period-display questions. Use `本年累计金额` for
    cumulative questions and `本月金额` for monthly questions. Use
    `kx_fact_financial_amount` instead for single-quarter amount, amount_type,
    quarter_no, lineage fields, or underlying detail questions.

grain:
  - 公司名称
  - 报表期间
  - 项目名称

columns:
  - name: 期间年份
    type: number
    expr: CASE WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL ELSE (SUBSTRING(`报表期间`, 1, 4) + 0) END
    descriptions:
      db: 报表期间年份，从 YYYYMM 派生。
      ai: Year derived from reporting period.

  - name: 期间月份
    type: number
    expr: CASE WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL ELSE (SUBSTRING(`报表期间`, 5, 2) + 0) END
    descriptions:
      db: 报表期间月份，从 YYYYMM 派生。
      ai: Month derived from reporting period.

  - name: 期间月份标签
    type: string
    expr: CASE WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL ELSE CONCAT(SUBSTRING(`报表期间`, 1, 4), '-', SUBSTRING(`报表期间`, 5, 2)) END
    descriptions:
      db: 月份标签，例如 2026-05。
      ai: Month label such as 2026-05.

  - name: 期间季度
    type: number
    expr: CASE WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL ELSE CEILING((SUBSTRING(`报表期间`, 5, 2) + 0) / 3) END
    descriptions:
      db: 报表期间所属季度，1-4。
      ai: Quarter number derived from reporting period.

  - name: 期间季度标签
    type: string
    expr: CASE WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL ELSE CONCAT(SUBSTRING(`报表期间`, 1, 4), 'Q', CEILING((SUBSTRING(`报表期间`, 5, 2) + 0) / 3)) END
    descriptions:
      db: 季度标签，例如 2026Q1。
      ai: Quarter label such as 2026Q1.

  - name: 是否季末月份
    type: number
    expr: >-
      CASE
        WHEN `报表期间` IS NULL OR LENGTH(`报表期间`) != 6 THEN NULL
        WHEN (SUBSTRING(`报表期间`, 5, 2) + 0) IN (3, 6, 9, 12) THEN 1
        ELSE 0
      END
    descriptions:
      db: 是否为季度末月份：1 = 是（3/6/9/12 月），0 = 否；报表期间为 NULL 或非 6 位时返回 NULL（不可判定）。
      ai: Quarter-close month flag; 1 yes, 0 no, null when report_period is missing or malformed.

measures:
  - name: 经营活动现金流量净额_本年累计
    expr: sum(case when `项目名称` = '经营活动产生的现金流量净额' then `本年累计金额` else null end)
    description: 经营活动产生的现金流量净额本年累计金额。未找到对应报表行时返回 NULL；金额为 NULL 表示原始报表未填，不等于 0。

  - name: 投资活动现金流量净额_本年累计
    expr: sum(case when `项目名称` = '投资活动产生的现金流量净额' then `本年累计金额` else null end)
    description: 投资活动产生的现金流量净额本年累计金额。未找到对应报表行时返回 NULL；金额为 NULL 表示原始报表未填，不等于 0。

  - name: 筹资活动现金流量净额_本年累计
    expr: sum(case when `项目名称` = '筹资活动产生的现金流量净额' then `本年累计金额` else null end)
    description: 筹资活动产生的现金流量净额本年累计金额。未找到对应报表行时返回 NULL；金额为 NULL 表示原始报表未填，不等于 0。

  - name: 期末现金余额
    expr: sum(case when `项目名称` = '五、期末现金余额' then coalesce(`本年累计金额`, `本月金额`) else null end)
    description: 期末现金余额；优先取本年累计金额，缺失时使用本月金额。未找到对应报表行时返回 NULL；金额为 NULL 表示原始报表未填，不等于 0。

  - name: 现金净增加额_本年累计
    expr: sum(case when `项目名称` = '四、现金净增加额' then `本年累计金额` else null end)
    description: 现金净增加额本年累计金额。未找到对应报表行时返回 NULL；金额为 NULL 表示原始报表未填，不等于 0。
