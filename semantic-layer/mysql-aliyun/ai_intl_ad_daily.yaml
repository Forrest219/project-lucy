# chatbi 国际化语义源（standalone，供 mysql-aliyun）。
# 物理列齐全 + grain/measures/segments；列上不含 pk/nullable。
# 事实表之间仅按 date/platform/country_region 对齐，不写 joins。

name: ai_intl_ad_daily
table: chatbi.ai_intl_ad_daily
descriptions:
  human: 国际化广告日指标语义源。广告消耗、Spend、投放消耗、获客成本、预算、CAC、曝光、点击类问题默认使用本源。每日广告消耗必须使用 spend，不要使用 dau；本源不包含 DAU/日活，DAU
    问题应使用 ai_intl_country_daily。经营总览中的 AF 新增默认使用 ai_intl_country_daily；广告语境下的 AF 新增和 CAC 使用本源。
  ai: 国际化广告日指标语义源。广告消耗、Spend、投放消耗、获客成本、预算、CAC、曝光、点击类问题默认使用本源。每日广告消耗必须使用 spend，不要使用 dau；本源不包含 DAU/日活，DAU
    问题应使用 ai_intl_country_daily。经营总览中的 AF 新增默认使用 ai_intl_country_daily；广告语境下的 AF 新增和 CAC 使用本源。
grain:
- date
- platform
- country_region
columns:
- name: date
  type: time
  descriptions:
    db: 广告投放日期。 按 Asia/Shanghai 业务日理解；若以 UTC ISO 展示需先转换。
    ai: 广告投放日期。
  role: time
- name: platform
  type: string
  descriptions:
    db: 平台，AF 源表 ios 标准化为 iphone。 用户说 iOS/ios/iPhone 时映射为 platform='iphone'；Android 映射为 android。
    ai: 广告来源平台，ios 标准化为 iphone。
- name: country_region
  type: string
  descriptions:
    db: 国家或地区英文名，取 AF 表国家-英文-第一次矫正。
    ai: 国家或地区英文名。
- name: country_region_cn
  type: string
  descriptions:
    db: 国家或地区中文名。
    ai: 国家或地区中文展示名。
- name: country_abbr
  type: string
  descriptions:
    db: 国家或地区简称。
    ai: 国家或地区简称。
- name: region
  type: string
  descriptions:
    db: 大区。
    ai: 国家所属大区。
- name: sub_region
  type: string
  descriptions:
    db: 子区域。
    ai: 国家所属子区域。
- name: spend
  type: number
  descriptions:
    db: 每日广告消耗 Spend，单位 USD。
    ai: 广告消耗金额，单位美元。
- name: new_users_af
  type: number
  descriptions:
    db: 新增用户数-AF口径，来源于 forAI 新增用户数-AF口径（人）。
    ai: 用于广告 CAC 计算的 AF 口径新增用户数。
- name: cac
  type: number
  descriptions:
    db: 单用户获取成本 CAC，spend / nullif(new_users_af,0)。
    ai: 行级 CAC；跨维度汇总时必须重算。
- name: impressions
  type: number
  descriptions:
    db: 广告曝光次数 Imp。
    ai: 广告曝光次数。
- name: clicks
  type: number
  descriptions:
    db: 广告点击次数 Click。
    ai: 广告点击次数。
- name: updated_at
  type: time
  descriptions:
    db: 数据更新时间。
    ai: ETL 数据更新时间。
measures:
- name: spend
  expr: sum(spend)
  description: 每日广告消耗，单位 USD。用户问 Spend、广告消耗、投放消耗是多少时使用本 measure。
- name: new_users_af
  expr: sum(new_users_af)
  description: 广告语境下的新增用户数-AF口径，用于计算 CAC。
- name: cac
  expr: sum(spend) / nullif(sum(new_users_af), 0)
  description: 单用户获取成本 CAC。跨日期、平台、国家或区域汇总时必须按 sum(spend) / nullif(sum(new_users_af), 0) 重算，不直接平均行级 cac。
- name: impressions
  expr: sum(impressions)
  description: 广告曝光次数 Imp。
- name: clicks
  expr: sum(clicks)
  description: 广告点击次数 Click。
- name: ctr
  expr: sum(clicks) / nullif(sum(impressions), 0)
  description: 广告点击率 CTR，按点击次数 / 曝光次数计算。
segments:
- name: valid_rows
  expr: date is not null
  description: 有广告投放日期的有效记录。
- name: android
  expr: lower(platform) = 'android'
  description: Android 平台记录。
- name: iphone
  expr: lower(platform) = 'iphone'
  description: iPhone 平台记录。
- name: country_detail
  expr: country_region is not null AND country_region <> ''
  description: 国家或地区明细记录。
- name: china
  expr: country_abbr = 'CN'
  description: 中国大陆记录。
- name: excluding_china
  expr: coalesce(country_abbr, '') <> 'CN'
  description: 不含中国大陆的记录；港澳台按独立地区保留，除非用户明确要求大中华口径。
- name: has_spend
  expr: spend is not null AND spend <> 0
  description: 有广告消耗的记录。
joins: []
