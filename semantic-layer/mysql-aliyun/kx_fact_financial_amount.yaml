name: kx_fact_financial_amount

descriptions:
  human: >-
    KX 财报金额事实表。用于分析柯西公司（深圳市柯西信息科技有限公司，company_id=1）在
    2026 年的经营情况、利润表、资产负债表和现金流量表。查询报表展示口径或合计行
    （资产合计、负债合计、所有者权益合计、利润总额、净利润、现金流量净额等）时，
    优先直接使用 `kx_vw_balance_sheet_detail`、`kx_vw_income_statement_detail`、
    `kx_vw_cash_flow_statement_detail` 三个明细视图，避免不必要的 fact + dim join
    路径歧义；事实表优先用于按科目名称查询底层金额明细、跨期间明细金额、单季度
    发生额、来源追溯、自定义聚合，以及需要 amount_type / quarter_no 标准化过滤的分析。
  ai: >-
    Financial amount fact table for KX financial analysis; includes aliases
    Kexi company / 柯西公司 / 深圳市柯西信息科技有限公司 via company_id=1.
    For statement-layout questions or total/subtotal rows, prefer the three
    single-table detail views (`kx_vw_balance_sheet_detail`,
    `kx_vw_income_statement_detail`, `kx_vw_cash_flow_statement_detail`) to
    avoid ambiguous fact-dimension join paths. Use this fact table when the
    task needs underlying subject-level amount details, period-by-period detail
    amounts, single-quarter amounts, lineage fields, custom aggregation, or
    amount_type / quarter_no filters. Users usually ask by subject name, so join
    `kx_dim_financial_item` to locate the canonical financial statement item.
    Canonical item names may include Chinese numbering prefixes, for example
    `一、营业收入`; use item aliases from `kx_dim_financial_item` when mapping
    natural-language subjects.

# 行粒度：每行是一家公司、一个报表期间、一个财报项目、一个金额类型的金额记录。
grain:
  - amount_id

measures:
  - name: total_amount
    expr: sum(amount)
    description: 金额合计。注意 amount 为 NULL 表示原始报表为空，不要在未说明时把 NULL 当 0。

  - name: non_null_amount_count
    expr: sum(case when amount is not null then 1 else 0 end)
    description: amount 非空的记录数，用于检查报表项目覆盖与缺失情况，例如某科目在某月是否有填报数据。

  - name: null_amount_count
    expr: sum(case when amount is null then 1 else 0 end)
    description: amount 为空的记录数。NULL 表示原始报表为空，不等同于 0；用于检测某科目、某期间的数据缺口。

segments:
  - name: kexi_company
    expr: company_id = 1
    description: 深圳市柯西信息科技有限公司；也称“柯西公司”“柯西”“KX 公司”。

  - name: fiscal_year_2026
    expr: fiscal_year = 2026
    description: 2026 会计年度。

  - name: income_statement
    expr: statement_type = 'income_statement'
    description: 利润表项目，用于收入、成本、费用、利润、净利润等经营情况分析。

  - name: balance_sheet
    expr: statement_type = 'balance_sheet'
    description: 资产负债表项目，用于资产、负债、所有者权益等期末余额分析。

  - name: cash_flow
    expr: statement_type = 'cash_flow'
    description: 现金流量表项目，用于经营、投资、筹资现金流分析。

  - name: year_to_date_amount
    expr: amount_type = 'year_to_date'
    description: 本年累计金额。利润表与现金流量表分析“2026 年经营情况”时优先使用。

  - name: current_month_amount
    expr: amount_type = 'current_month'
    description: 本月金额。需要月度表现时使用。

  - name: end_balance_amount
    expr: amount_type = 'end_balance'
    description: 期末余额。资产负债表分析优先使用。

  - name: begin_balance_amount
    expr: amount_type = 'begin_balance'
    description: 年初余额。资产负债表对比期初期末时使用。

  - name: quarter_amount
    expr: amount_type = 'quarter'
    description: 季度金额。仅在用户明确询问季度口径时使用。
