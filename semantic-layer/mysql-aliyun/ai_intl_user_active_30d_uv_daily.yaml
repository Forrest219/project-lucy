# chatbi 国际化语义源（standalone，供 mysql-aliyun）。
# 物理列齐全 + grain/measures/segments；列上不含 pk/nullable。
# 事实表之间仅按 date/platform/country_region 对齐，不写 joins。

name: ai_intl_user_active_30d_uv_daily
table: chatbi.ai_intl_user_active_30d_uv_daily
descriptions:
  human: 国际化近30日去重活跃用户语义源。只有用户明确询问近30日去重活跃用户数、近30日 UV 或去重 UV 时，才使用本源的 active_30d_uv；普通 DAU、MAU、日活、近30日日均
    DAU 不使用本源。
  ai: 国际化近30日去重活跃用户语义源。只有用户明确询问近30日去重活跃用户数、近30日 UV 或去重 UV 时，才使用本源的 active_30d_uv；普通 DAU、MAU、日活、近30日日均
    DAU 不使用本源。
grain:
- date
- platform
- country_region
columns:
- name: date
  type: time
  descriptions:
    db: 统计日期，近30日窗口截止日期。 按 Asia/Shanghai 业务日理解；若以 UTC ISO 展示需先转换。
    ai: 近30日窗口截止日期。
  role: time
- name: platform
  type: string
  descriptions:
    db: 平台，标准值建议为 android、iphone。 用户说 iOS/ios/iPhone 时映射为 platform='iphone'；Android 映射为 android。
    ai: 客户端平台，常见取值为 android、iphone。
- name: country_region
  type: string
  descriptions:
    db: 国家或地区英文名，取近30日活跃表国家英文-第一次矫正。
    ai: 国家或地区英文名。
- name: country_region_cn
  type: string
  descriptions:
    db: 国家或地区中文名。
    ai: 国家或地区中文展示名。
- name: country_abbr
  type: string
  descriptions:
    db: 国家或地区简称。
    ai: 国家或地区简称。
- name: region
  type: string
  descriptions:
    db: 大区。
    ai: 国家所属大区。
- name: sub_region
  type: string
  descriptions:
    db: 子区域。
    ai: 国家所属子区域。
- name: active_30d_uv
  type: number
  descriptions:
    db: 近30日去重活跃用户数。
    ai: 近30日窗口内去重活跃用户数。
- name: updated_at
  type: time
  descriptions:
    db: 数据更新时间。
    ai: ETL 数据更新时间。
measures:
- name: active_30d_uv
  expr: sum(active_30d_uv)
  description: 近30日去重活跃用户数。只在用户明确询问近30日去重活跃用户数、近30日 UV 或去重 UV 时使用；未明确去重的近30日活跃应从 ai_intl_country_daily
    的 DAU 口径计算近30日日均 DAU。
segments:
- name: valid_rows
  expr: date is not null
  description: 有统计日期的有效记录。
- name: android
  expr: lower(platform) = 'android'
  description: Android 平台记录。
- name: iphone
  expr: lower(platform) = 'iphone'
  description: iPhone 平台记录。
- name: country_detail
  expr: country_region is not null AND country_region <> ''
  description: 国家或地区明细记录。
- name: china
  expr: country_abbr = 'CN'
  description: 中国大陆记录。
- name: excluding_china
  expr: coalesce(country_abbr, '') <> 'CN'
  description: 不含中国大陆的记录；港澳台按独立地区保留，除非用户明确要求大中华口径。
joins: []
