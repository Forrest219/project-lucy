tables:
  customers:
    table: openclaw_db.customers
    columns:
      - name: customer_id
        type: number
        pk: true
        nullable: false
        descriptions:
          ai: Unique numeric identifier for each customer record.
      - name: customer_name
        type: string
        nullable: false
        descriptions:
          ai: Official business name of the customer organization.
      - name: customer_type
        type: string
        nullable: false
        descriptions:
          ai: Business size classification, such as Enterprise or SMB.
      - name: customer_level
        type: string
        nullable: false
        descriptions:
          ai: Tiered value or priority rating assigned to the customer, e.g., A or B.
      - name: region_id
        type: number
        nullable: false
        descriptions:
          ai: Foreign key referencing the geographic sales region of the customer.
      - name: signup_date
        type: time
        nullable: false
        descriptions:
          ai: Date the customer formally enrolled or was onboarded.
      - name: is_active
        type: number
        nullable: false
        descriptions:
          ai: Boolean flag indicating whether the customer account is currently active.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          ai: System timestamp recording when this customer row was first inserted.
    descriptions:
      ai: Registry of business customers capturing identity, segmentation, regional assignment, and account lifecycle status.
    joins:
      - to: dim_region
        "on": customers.region_id = dim_region.region_id
        relationship: many_to_one
        source: formal
      - to: orders
        "on": customers.customer_id = orders.customer_id
        relationship: one_to_many
        source: formal
  bidm_ai_metric_summary_mth:
    table: openclaw_db.bidm_ai_metric_summary_mth
    columns:
      - name: data_source
        type: string
        descriptions:
          ai: Origin system or dataset identifier for traceability and multi-source management.
      - name: updated_at
        type: time
        descriptions:
          ai: Timestamp of the most recent record modification.
      - name: created_at
        type: time
        descriptions:
          ai: Timestamp when the record was first inserted.
      - name: data_end_date
        type: string
        descriptions:
          ai: Inclusive end date of the source data extraction window (YYYYMMDD).
      - name: data_start_date
        type: string
        descriptions:
          ai: Inclusive start date of the source data extraction window (YYYYMMDD).
      - name: avg_order_amount
        type: number
        descriptions:
          ai: Average net revenue value per order within the segment.
      - name: unit_cost_avg
        type: number
        descriptions:
          ai: Average cost incurred per unit sold.
      - name: profit_rate
        type: number
        descriptions:
          ai: Gross profit margin expressed as a ratio of net revenue.
      - name: avg_discount_rate
        type: number
        descriptions:
          ai: Average discount percentage applied to orders.
      - name: avg_unit_price
        type: number
        descriptions:
          ai: Average net selling price per unit sold.
      - name: stat_month
        type: time
        descriptions:
          ai: Calendar month this summary record represents.
      - name: region_id
        type: number
        descriptions:
          ai: Numeric identifier for the geographic sales region.
      - name: region_name
        type: string
        descriptions:
          ai: Human-readable name of the geographic sales region.
      - name: channel_name
        type: string
        descriptions:
          ai: Sales channel through which orders were placed.
      - name: category_name
        type: string
        descriptions:
          ai: Product or service category classification.
      - name: customer_type
        type: string
        descriptions:
          ai: Customer segment classification, e.g., Enterprise, SMB, Individual.
      - name: order_cnt
        type: number
        descriptions:
          ai: Total number of distinct orders in the period.
      - name: row_cnt
        type: number
        descriptions:
          ai: Number of underlying detail rows aggregated into this summary.
      - name: quantity
        type: number
        descriptions:
          ai: Total units sold across all orders.
      - name: gross_amount
        type: number
        descriptions:
          ai: Total revenue before any discounts are applied.
      - name: net_amount
        type: number
        descriptions:
          ai: Total revenue after discounts are applied.
      - name: cost_amount
        type: number
        descriptions:
          ai: Total cost of goods or services sold.
      - name: profit_amount
        type: number
        descriptions:
          ai: Total profit calculated as net revenue minus total cost.
    descriptions:
      ai: Monthly aggregated AI-driven sales performance metrics segmented by region, channel, product category, and customer type.
  dim_region:
    table: openclaw_db.dim_region
    columns:
      - name: region_id
        type: number
        pk: true
        nullable: false
        descriptions:
          ai: Unique numeric surrogate key identifying each geographic region.
      - name: region_name
        type: string
        nullable: false
        descriptions:
          ai: Chinese name of the sales region, e.g., East China (华东区).
      - name: region_level
        type: string
        nullable: false
        descriptions:
          ai: Hierarchy tier of the region, e.g., major region (大区).
      - name: manager_name
        type: string
        descriptions:
          ai: Full name of the person accountable for overseeing the region.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          ai: Timestamp when the region record was first added to the system.
    descriptions:
      ai: Dimension table defining China's geographic sales regions, their hierarchy levels, and responsible managers.
    joins:
      - to: customers
        "on": dim_region.region_id = customers.region_id
        relationship: one_to_many
        source: formal
      - to: orders
        "on": dim_region.region_id = orders.region_id
        relationship: one_to_many
        source: formal
  orders:
    table: openclaw_db.orders
    columns:
      - name: order_id
        type: number
        pk: true
        nullable: false
        descriptions:
          ai: Unique identifier for each sales order.
      - name: order_date
        type: time
        nullable: false
        descriptions:
          ai: Calendar date the order was placed by the customer.
      - name: customer_id
        type: number
        nullable: false
        descriptions:
          ai: Foreign key linking the order to the purchasing customer.
      - name: product_id
        type: number
        nullable: false
        descriptions:
          ai: Foreign key identifying the specific product purchased.
      - name: region_id
        type: number
        nullable: false
        descriptions:
          ai: Foreign key identifying the geographic sales region.
      - name: quantity
        type: number
        nullable: false
        descriptions:
          ai: Number of product units included in the order.
      - name: unit_price
        type: number
        nullable: false
        descriptions:
          ai: Listed selling price per single product unit before discounts.
      - name: discount_rate
        type: number
        nullable: false
        descriptions:
          ai: Decimal discount rate applied to reduce the gross amount.
      - name: gross_amount
        type: number
        nullable: false
        descriptions:
          ai: Pre-discount revenue; quantity multiplied by unit price.
      - name: net_amount
        type: number
        nullable: false
        descriptions:
          ai: Actual billed revenue after the discount rate is applied.
      - name: cost_amount
        type: number
        nullable: false
        descriptions:
          ai: Total cost of goods sold associated with this order.
      - name: profit_amount
        type: number
        nullable: false
        descriptions:
          ai: Net amount minus cost; realized gross margin on the order.
      - name: order_status
        type: string
        nullable: false
        descriptions:
          ai: Current lifecycle stage, e.g., completed, pending, or cancelled.
      - name: channel_name
        type: string
        nullable: false
        descriptions:
          ai: Sales channel through which the order was placed, e.g., Direct, Online, Partner.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          ai: Timestamp when this order record was inserted into the database.
    descriptions:
      ai: Records individual sales transactions with pricing, discounts, costs, and profit across customers, products, regions, and channels.
    joins:
      - to: customers
        "on": orders.customer_id = customers.customer_id
        relationship: many_to_one
        source: formal
      - to: products
        "on": orders.product_id = products.product_id
        relationship: many_to_one
        source: formal
      - to: dim_region
        "on": orders.region_id = dim_region.region_id
        relationship: many_to_one
        source: formal
  products:
    table: openclaw_db.products
    columns:
      - name: product_id
        type: number
        pk: true
        nullable: false
        descriptions:
          ai: Unique numeric identifier for each product in the catalog.
      - name: product_name
        type: string
        nullable: false
        descriptions:
          ai: Full display name of the product offered for sale.
      - name: category_name
        type: string
        nullable: false
        descriptions:
          ai: Top-level grouping of the product, such as software or hardware.
      - name: subcategory_name
        type: string
        descriptions:
          ai: Secondary classification within the category for finer product segmentation.
      - name: unit_price
        type: number
        nullable: false
        descriptions:
          ai: Selling price charged to customers per unit.
      - name: unit_cost
        type: number
        nullable: false
        descriptions:
          ai: Internal cost to produce or procure one unit.
      - name: is_active
        type: number
        nullable: false
        descriptions:
          ai: Boolean flag indicating whether the product is currently available for sale.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          ai: Timestamp recording when the product was first added to the catalog.
    descriptions:
      ai: Catalog of sellable products with pricing, categorization, and availability status across software and service offerings.
    joins:
      - to: orders
        "on": products.product_id = orders.product_id
        relationship: one_to_many
        source: formal
