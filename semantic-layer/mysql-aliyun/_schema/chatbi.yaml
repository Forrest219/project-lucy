tables:
  ai_intl_country_daily:
    table: chatbi.ai_intl_country_daily
    descriptions:
      db: AI 国际化国家日经营指标表。
      human: 按 date、platform、country_region 粒度统计国际化经营指标，覆盖 DAU、MAU、启动次数、人均打开次数、近30日日均 DAU、新增用户数和经营总览中的次日留存人数。
      ai: 按 date、platform、country_region 粒度统计国际化经营指标，覆盖 DAU、MAU、启动次数、人均打开次数、近30日日均 DAU、新增用户数和经营总览中的次日留存人数。
    columns:
    - name: date
      type: time
      nullable: false
      descriptions:
        db: 统计日期，日粒度。
        human: 指标统计日期。
        ai: 指标统计日期。
    - name: platform
      type: string
      nullable: false
      descriptions:
        db: 平台，标准值建议为 android、iphone。
        human: 客户端平台，常见取值为 android、iphone。
        ai: 客户端平台，常见取值为 android、iphone。
    - name: country_region
      type: string
      nullable: false
      descriptions:
        db: 国家或地区英文名，取 forAI 国家英文-第一次矫正。
        human: 国家或地区英文名，是国家维度分析和跨表对齐的主要业务 key。
        ai: 国家或地区英文名，是国家维度分析和跨表对齐的主要业务 key。
    - name: country_region_cn
      type: string
      nullable: true
      descriptions:
        db: 国家或地区中文名。
        human: 国家或地区中文展示名。
        ai: 国家或地区中文展示名。
    - name: country_abbr
      type: string
      nullable: true
      descriptions:
        db: 国家或地区简称。
        human: 国家或地区简称。
        ai: 国家或地区简称。
    - name: region
      type: string
      nullable: true
      descriptions:
        db: 大区。
        human: 国家所属大区。
        ai: 国家所属大区。
    - name: sub_region
      type: string
      nullable: true
      descriptions:
        db: 子区域。
        human: 国家所属子区域。
        ai: 国家所属子区域。
    - name: month
      type: string
      nullable: true
      descriptions:
        db: 月份，格式通常为 yyyy-mm。
        human: 指标所属月份。
        ai: 指标所属月份。
    - name: dau
      type: number
      nullable: true
      descriptions:
        db: DAU，日活跃用户数。
        human: 日活跃用户数，经营类日活问题默认使用本字段。
        ai: 日活跃用户数，经营类日活问题默认使用本字段。
    - name: mau
      type: number
      nullable: true
      descriptions:
        db: MAU，月活跃用户数。
        human: 月活跃用户数，源数据可能存在小数。
        ai: 月活跃用户数，源数据可能存在小数。
    - name: launches
      type: number
      nullable: true
      descriptions:
        db: 启动次数。
        human: App 被打开或启动的总次数。
        ai: App 被打开或启动的总次数。
    - name: avg_launch_per_user
      type: number
      nullable: true
      descriptions:
        db: 人均打开次数，行级值为 launches / nullif(dau,0)。
        human: 行级人均打开次数；跨维度汇总时必须重算。
        ai: 行级人均打开次数；跨维度汇总时必须重算。
    - name: avg_dau_30d
      type: number
      nullable: true
      descriptions:
        db: 近30日日均 DAU，不足30天时按窗口内已有日期计算。
        human: 近30日日均 DAU；跨维度汇总时应先按日汇总 dau 再重新计算。
        ai: 近30日日均 DAU；跨维度汇总时应先按日汇总 dau 再重新计算。
    - name: new_users_moji
      type: number
      nullable: true
      descriptions:
        db: 新增用户数-墨迹口径。
        human: 墨迹口径新增用户数。
        ai: 墨迹口径新增用户数。
    - name: new_users_af
      type: number
      nullable: true
      descriptions:
        db: 新增用户数-AF口径，来源于 forAI。
        human: 经营口径的 AppsFlyer 新增用户数。
        ai: 经营口径的 AppsFlyer 新增用户数。
    - name: retained_users_1d
      type: number
      nullable: true
      descriptions:
        db: 次日留存人数。
        human: 经营总览中的次日留存人数；完整 N 日留存分析应使用 ai_intl_retention_daily。
        ai: 经营总览中的次日留存人数；完整 N 日留存分析应使用 ai_intl_retention_daily。
    - name: updated_at
      type: time
      nullable: true
      descriptions:
        db: 数据更新时间。
        human: ETL 数据更新时间。
        ai: ETL 数据更新时间。
  ai_intl_user_active_30d_uv_daily:
