tables:
  superstore_orders:
    table: dataforai.superstore_orders
    columns:
      - name: row_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 行 ID
          ai: Unique sequential integer identifier for each order line item record.
      - name: order_id
        type: string
        nullable: false
        descriptions:
          db: 订单 ID
          ai: Business key linking multiple line items to the same order.
      - name: order_date
        type: time
        nullable: false
        descriptions:
          db: 订单日期
          ai: Date the customer placed the order.
      - name: ship_date
        type: time
        nullable: false
        descriptions:
          db: 发货日期
          ai: Date the order was dispatched to the customer.
      - name: ship_mode
        type: string
        descriptions:
          db: 装运模式
          ai: Shipping speed tier selected for delivery, e.g., standard or express.
      - name: customer_id
        type: string
        descriptions:
          db: 客户 ID
          ai: Unique business key identifying the purchasing customer.
      - name: customer_name
        type: string
        descriptions:
          db: 客户名称
          ai: Full name of the purchasing customer.
      - name: segment
        type: string
        descriptions:
          db: 细分
          ai: Market segment the customer belongs to, e.g., consumer or small business.
      - name: city
        type: string
        descriptions:
          db: 城市
          ai: City of the delivery or customer address.
      - name: province
        type: string
        descriptions:
          db: 省/自治区
          ai: Province or autonomous region of the delivery address.
      - name: country_region
        type: string
        descriptions:
          db: 国家/地区
          ai: Country or region of the delivery address.
      - name: region
        type: string
        descriptions:
          db: 区域
          ai: Broad geographic sales territory grouping multiple provinces.
      - name: product_id
        type: string
        descriptions:
          db: 产品 ID
          ai: Unique business key identifying the ordered product SKU.
      - name: category
        type: string
        descriptions:
          db: 类别
          ai: Top-level product classification, e.g., office supplies or furniture.
      - name: sub_category
        type: string
        descriptions:
          db: 子类别
          ai: Secondary product classification within the top-level category.
      - name: product_name
        type: string
        descriptions:
          db: 产品名称
          ai: Full descriptive name of the ordered product.
      - name: sales
        type: number
        descriptions:
          db: 销售额
          ai: Total revenue from the line item after discounts applied.
      - name: quantity
        type: number
        descriptions:
          db: 数量
          ai: Number of product units included in the line item.
      - name: discount
        type: number
        descriptions:
          human: 折扣（0-1），聚合口径见 measures.discount_rate。
          db: 折扣
          ai: Fractional discount rate applied to the line item price.
      - name: profit
        type: number
        descriptions:
          human: 行级净利润，可为负值（亏损行），口径见 measures.profit_margin。
          db: 利润
          ai: Net profit on the line item after costs and discounts.
      - name: postal_code
        type: string
        descriptions:
          db: 邮政编码
          ai: Postal code of the delivery or customer address.
      - name: source_system
        type: string
        nullable: false
        descriptions:
          db: 来源系统
          ai: Name of the originating system that provided the data.
      - name: source_file
        type: string
        nullable: false
        descriptions:
          db: 来源文件
          ai: File path of the original source data file.
      - name: source_sheet
        type: string
        nullable: false
        descriptions:
          db: 来源工作表
          ai: Worksheet name within the source file containing this data.
      - name: source_row_number
        type: number
        nullable: false
        descriptions:
          db: 来源文件行号
          ai: Row number in the source file for lineage traceability.
      - name: batch_id
        type: string
        nullable: false
        descriptions:
          db: 导入批次 ID
          ai: Identifier for the ETL batch that loaded this record.
      - name: row_hash
        type: string
        nullable: false
        descriptions:
          db: 业务字段 SHA-256 哈希
          ai: SHA-256 hash of business fields used to detect row changes.
      - name: is_deleted
        type: number
        nullable: false
        descriptions:
          db: 逻辑删除标记
          ai: Soft-delete flag; 1 means logically deleted, 0 means active.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 入库时间
          ai: Timestamp when the record was first loaded into the database.
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
          ai: Timestamp of the most recent modification to this record.
    descriptions:
      db: Tableau 示例超市订单 ODS 明细表
      ai: Retail order line items from a Chinese superstore, capturing transactions with customer, product, geography, and financial details.
  superstore_people:
    table: dataforai.superstore_people
    columns:
      - name: region
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 区域
          ai: Name of the geographic sales region within China.
      - name: regional_manager
        type: string
        nullable: false
        descriptions:
          db: 区域经理
          ai: Full name of the manager responsible for the sales region.
      - name: source_system
        type: string
        nullable: false
        descriptions:
          db: 来源系统
          ai: Identifier of the upstream system that provided this data.
      - name: source_file
        type: string
        nullable: false
        descriptions:
          db: 来源文件
          ai: Repository file path of the originating spreadsheet.
      - name: source_sheet
        type: string
        nullable: false
        descriptions:
          db: 来源工作表
          ai: Worksheet tab name within the source file containing this record.
      - name: source_row_number
        type: number
        nullable: false
        descriptions:
          db: 来源文件行号
          ai: Row position of this record in the original source file.
      - name: batch_id
        type: string
        nullable: false
        descriptions:
          db: 导入批次 ID
          ai: Unique identifier for the ETL import batch that loaded this record.
      - name: row_hash
        type: string
        nullable: false
        descriptions:
          db: 业务字段 SHA-256 哈希
          ai: SHA-256 fingerprint of business fields used to detect row changes.
      - name: is_deleted
        type: number
        nullable: false
        descriptions:
          db: 逻辑删除标记
          ai: Soft-delete flag; 1 means the record is logically removed.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 入库时间
          ai: Timestamp when the record was first inserted into this table.
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
          ai: Timestamp of the most recent modification to this record.
    descriptions:
      db: Tableau 示例超市区域人员 ODS 表
      ai: Maps each geographic sales region in China to its assigned regional manager, sourced from the Tableau Superstore sample dataset.
  superstore_returns:
    table: dataforai.superstore_returns
    columns:
      - name: id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 退货记录代理主键
          ai: Surrogate primary key uniquely identifying each return record.
      - name: order_id
        type: string
        nullable: false
        descriptions:
          db: 订单 ID
          ai: Business key linking this return entry to a specific customer order.
      - name: returned
        type: string
        nullable: false
        descriptions:
          db: 退回
          ai: Indicates the order was returned; expected value is 是 (Yes).
      - name: source_system
        type: string
        nullable: false
        descriptions:
          db: 来源系统
          ai: Name of the upstream system from which this record was ingested.
      - name: source_file
        type: string
        nullable: false
        descriptions:
          db: 来源文件
          ai: Full file path of the Excel workbook supplying the source data.
      - name: source_sheet
        type: string
        nullable: false
        descriptions:
          db: 来源工作表
          ai: Worksheet tab within the source file where this row originated.
      - name: source_row_number
        type: number
        nullable: false
        descriptions:
          db: 来源文件行号
          ai: Row position in the source file mapped to this record.
      - name: batch_id
        type: string
        nullable: false
        descriptions:
          db: 导入批次 ID
          ai: Groups all records loaded together in the same import execution.
      - name: row_hash
        type: string
        nullable: false
        descriptions:
          db: 业务字段 SHA-256 哈希
          ai: SHA-256 hash of business fields for deduplication and change detection.
      - name: is_deleted
        type: number
        nullable: false
        descriptions:
          db: 逻辑删除标记
          ai: Soft-delete flag; value 1 means the record is logically removed.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 入库时间
          ai: Timestamp when this record was first inserted into the database.
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
          ai: Timestamp of the most recent modification to this record.
    descriptions:
      db: Tableau 示例超市退货 ODS 表
      ai: Tracks orders flagged as returned from the Tableau Superstore dataset, with full ETL lineage and soft-delete support.
