tables:
  kx_dim_company:
    table: dataforai.kx_dim_company
    columns:
      - name: company_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 公司ID
      - name: company_name
        type: string
        nullable: false
        descriptions:
          db: 公司名称
      - name: unified_social_credit_code
        type: string
        descriptions:
          db: 统一社会信用代码
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 创建时间
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
    descriptions:
      db: KX公司维度表
    joins:
      - to: kx_fact_financial_amount
        "on": kx_dim_company.company_id = kx_fact_financial_amount.company_id
        relationship: one_to_many
        source: formal
  kx_dim_financial_item:
    table: dataforai.kx_dim_financial_item
    columns:
      - name: item_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 财报项目ID
      - name: statement_type
        type: string
        nullable: false
        descriptions:
          db: 报表类型：balance_sheet=资产负债表，income_statement=利润表，cash_flow=现金流量表
      - name: item_side
        type: string
        nullable: false
        descriptions:
          db: 项目归属：asset=资产，liability_equity=负债及所有者权益，income=利润表项目，cash_flow=现金流量项目
      - name: item_name
        type: string
        nullable: false
        descriptions:
          db: 财报项目名称
      - name: row_no
        type: number
        descriptions:
          db: 原报表行次
      - name: display_order
        type: number
        descriptions:
          db: 展示顺序，按原始报表行顺序排序
      - name: is_total
        type: number
        nullable: false
        descriptions:
          db: 是否为合计或小计项目
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 创建时间
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
    descriptions:
      db: KX财报项目维度表
    joins:
      - to: kx_fact_financial_amount
        "on": kx_dim_financial_item.item_id = kx_fact_financial_amount.item_id
        relationship: one_to_many
        source: formal
  kx_fact_financial_amount:
    table: dataforai.kx_fact_financial_amount
    columns:
      - name: amount_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 金额记录ID
      - name: company_id
        type: number
        nullable: false
        descriptions:
          db: 公司ID，关联kx_dim_company.company_id
      - name: item_id
        type: number
        nullable: false
        descriptions:
          db: 财报项目ID，关联kx_dim_financial_item.item_id
      - name: report_period
        type: string
        nullable: false
        descriptions:
          db: 报表期间，格式YYYYMM，例如202605
      - name: report_date
        type: time
        nullable: false
        descriptions:
          db: 报表日期，例如2026-05-31
      - name: fiscal_year
        type: number
        nullable: false
        descriptions:
          db: 会计年度
      - name: fiscal_month
        type: number
        nullable: false
        descriptions:
          db: 会计月份
      - name: statement_type
        type: string
        nullable: false
        descriptions:
          db: 报表类型：balance_sheet=资产负债表，income_statement=利润表，cash_flow=现金流量表
      - name: amount_type
        type: string
        nullable: false
        descriptions:
          db: 金额类型：begin_balance=年初余额，end_balance=期末余额，current_month=本月金额，year_to_date=本年累计，quarter=季度金额
      - name: quarter_no
        type: number
        nullable: false
        descriptions:
          db: 季度编号，非季度数据为0，第一季度为1
      - name: amount
        type: number
        descriptions:
          db: 金额，单位元；原始报表为空时为NULL
      - name: currency
        type: string
        nullable: false
        descriptions:
          db: 币种
      - name: source_file_name
        type: string
        descriptions:
          db: 来源Excel文件名，仅用于追溯
      - name: source_sheet_name
        type: string
        descriptions:
          db: 来源工作表名称，仅用于追溯
      - name: source_cell
        type: string
        descriptions:
          db: 来源单元格位置，仅用于追溯
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 创建时间
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
    descriptions:
      db: KX财报金额事实表
    joins:
      - to: kx_dim_company
        "on": kx_fact_financial_amount.company_id = kx_dim_company.company_id
        relationship: many_to_one
        source: formal
      - to: kx_dim_financial_item
        "on": kx_fact_financial_amount.item_id = kx_dim_financial_item.item_id
        relationship: many_to_one
        source: formal
