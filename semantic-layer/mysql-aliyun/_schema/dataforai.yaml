tables:
  kx_dim_company:
    table: dataforai.kx_dim_company
    columns:
      - name: company_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 公司ID
          ai: Unique identifier for each company record.
      - name: company_name
        type: string
        nullable: false
        descriptions:
          db: 公司名称
          ai: Official registered company name.
      - name: unified_social_credit_code
        type: string
        descriptions:
          db: 统一社会信用代码
          ai: China unified social credit identifier code.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 创建时间
          ai: Timestamp when company record was created.
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
          ai: Timestamp when company record was last modified.
    descriptions:
      db: KX公司维度表
      ai: Dimension table storing master company information for business entities.
    joins:
      - to: kx_fact_financial_amount
        "on": kx_dim_company.company_id = kx_fact_financial_amount.company_id
        relationship: one_to_many
        source: formal
  kx_dim_financial_item:
    table: dataforai.kx_dim_financial_item
    columns:
      - name: item_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 财报项目ID
          ai: Unique identifier for each financial line item.
      - name: statement_type
        type: string
        nullable: false
        descriptions:
          db: 报表类型：balance_sheet=资产负债表，income_statement=利润表，cash_flow=现金流量表
          ai: "Type of financial statement: balance sheet, income, or cash flow."
      - name: item_side
        type: string
        nullable: false
        descriptions:
          db: 项目归属：asset=资产，liability_equity=负债及所有者权益，income=利润表项目，cash_flow=现金流量项目
          ai: "Statement section: assets, liabilities/equity, income, or cash flow."
      - name: item_name
        type: string
        nullable: false
        descriptions:
          db: 财报项目名称
          ai: Name of the financial line item as displayed.
      - name: row_no
        type: number
        descriptions:
          db: 原报表行次
          ai: Original line number from the source financial statement.
      - name: display_order
        type: number
        descriptions:
          db: 展示顺序，按原始报表行顺序排序
          ai: Sequential ordering for presenting items in reports.
      - name: is_total
        type: number
        nullable: false
        descriptions:
          db: 是否为合计或小计项目
          ai: Flag indicating whether the item is a total or subtotal.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 创建时间
          ai: Timestamp when the record was initially created.
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
          ai: Timestamp when the record was last modified.
    descriptions:
      db: KX财报项目维度表
      ai: Financial statement line item dimension table for balance sheet, income, and cash flow items.
    joins:
      - to: kx_fact_financial_amount
        "on": kx_dim_financial_item.item_id = kx_fact_financial_amount.item_id
        relationship: one_to_many
        source: formal
  kx_fact_financial_amount:
    table: dataforai.kx_fact_financial_amount
    columns:
      - name: amount_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 金额记录ID
          ai: Unique identifier for each financial amount record
      - name: company_id
        type: number
        nullable: false
        descriptions:
          db: 公司ID，关联kx_dim_company.company_id
          ai: Foreign key referencing the reporting company dimension
      - name: item_id
        type: number
        nullable: false
        descriptions:
          db: 财报项目ID，关联kx_dim_financial_item.item_id
          ai: Foreign key referencing the financial statement line item dimension
      - name: report_period
        type: string
        nullable: false
        descriptions:
          db: 报表期间，格式YYYYMM，例如202605
          ai: Reporting period in YYYYMM format, such as 202605
      - name: report_date
        type: time
        nullable: false
        descriptions:
          db: 报表日期，例如2026-05-31
          ai: Exact calendar date of the financial report
      - name: fiscal_year
        type: number
        nullable: false
        descriptions:
          db: 会计年度
          ai: Fiscal year component extracted from the reporting period
      - name: fiscal_month
        type: number
        nullable: false
        descriptions:
          db: 会计月份
          ai: Fiscal month component extracted from the reporting period
      - name: statement_type
        type: string
        nullable: false
        descriptions:
          db: 报表类型：balance_sheet=资产负债表，income_statement=利润表，cash_flow=现金流量表
          ai: "Type of financial statement: balance sheet, income, or cash flow"
      - name: amount_type
        type: string
        nullable: false
        descriptions:
          db: 金额类型：begin_balance=年初余额，end_balance=期末余额，current_month=本月金额，year_to_date=本年累计，quarter=季度金额
          ai: "Nature of the figure: balance, monthly, quarterly, or year-to-date"
      - name: quarter_no
        type: number
        nullable: false
        descriptions:
          db: 季度编号，非季度数据为0，第一季度为1
          ai: Quarter number of the period; zero indicates non-quarterly data
      - name: amount
        type: number
        descriptions:
          db: 金额，单位元；原始报表为空时为NULL
          ai: Monetary value in original currency; null when source cell is empty
      - name: currency
        type: string
        nullable: false
        descriptions:
          db: 币种
          ai: Currency code of the recorded monetary amount
      - name: source_file_name
        type: string
        descriptions:
          db: 来源Excel文件名，仅用于追溯
          ai: Original Excel file name used for data lineage tracing
      - name: source_sheet_name
        type: string
        descriptions:
          db: 来源工作表名称，仅用于追溯
          ai: Original Excel worksheet name used for data lineage tracing
      - name: source_cell
        type: string
        descriptions:
          db: 来源单元格位置，仅用于追溯
          ai: Original Excel cell coordinate used for data lineage tracing
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 创建时间
          ai: Timestamp when the record was first inserted
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
          ai: Timestamp when the record was last modified
    descriptions:
      db: KX财报金额事实表
      ai: Stores company financial statement amounts across periods, items, and reporting types from Excel sources.
    joins:
      - to: kx_dim_company
        "on": kx_fact_financial_amount.company_id = kx_dim_company.company_id
        relationship: many_to_one
        source: formal
      - to: kx_dim_financial_item
        "on": kx_fact_financial_amount.item_id = kx_dim_financial_item.item_id
        relationship: many_to_one
        source: formal
  kx_vw_cash_flow_statement_detail:
    table: dataforai.kx_vw_cash_flow_statement_detail
    columns:
      - name: 公司名称
        type: string
        nullable: false
        descriptions:
          db: 公司名称
          ai: Name of the reporting entity
      - name: 报表期间
        type: string
        nullable: false
        descriptions:
          db: 报表期间，格式YYYYMM，例如202605
          ai: Reporting period in YYYYMM format
      - name: 报表日期
        type: time
        nullable: false
        descriptions:
          db: 报表日期，例如2026-05-31
          ai: Reporting period end date
      - name: 展示顺序
        type: number
        descriptions:
          db: 展示顺序，按原始报表行顺序排序
          ai: Display order following original statement layout
      - name: 行次
        type: number
        descriptions:
          db: 原报表行次
          ai: Original line number from the statement
      - name: 项目名称
        type: string
        nullable: false
        descriptions:
          db: 财报项目名称
          ai: Cash flow line item name
      - name: 本年累计金额
        type: number
        descriptions:
          ai: Year-to-date cumulative amount
      - name: 本月金额
        type: number
        descriptions:
          ai: Amount for the current month
    descriptions:
      db: VIEW
      ai: Cash flow statement detail by line item, period, and reporting company.
  kx_vw_balance_sheet_detail:
    table: dataforai.kx_vw_balance_sheet_detail
    columns:
      - name: 公司名称
        type: string
        nullable: false
        descriptions:
          db: 公司名称
          ai: Name of the reporting company
      - name: 报表期间
        type: string
        nullable: false
        descriptions:
          db: 报表期间，格式YYYYMM，例如202605
          ai: Reporting period in YYYYMM format
      - name: 报表日期
        type: time
        nullable: false
        descriptions:
          db: 报表日期，例如2026-05-31
          ai: Exact date of the financial statement
      - name: 项目归属
        type: string
        nullable: false
        descriptions:
          db: 项目归属：asset=资产，liability_equity=负债及所有者权益，income=利润表项目，cash_flow=现金流量项目
          ai: "Line item category: assets, liabilities, income, or cash flow"
      - name: 展示顺序
        type: number
        descriptions:
          db: 展示顺序，按原始报表行顺序排序
          ai: Display order following original statement row sequence
      - name: 行次
        type: number
        descriptions:
          db: 原报表行次
          ai: Original row number from the source financial report
      - name: 项目名称
        type: string
        nullable: false
        descriptions:
          db: 财报项目名称
          ai: Name of the financial statement line item
      - name: 期末余额
        type: number
        descriptions:
          ai: Balance amount at the end of the reporting period
      - name: 年初余额
        type: number
        descriptions:
          ai: Balance amount at the beginning of the reporting year
    descriptions:
      db: VIEW
      ai: Detailed balance sheet line items by company and reporting period for financial analysis.
  kx_vw_income_statement_detail:
    table: dataforai.kx_vw_income_statement_detail
    columns:
      - name: 公司名称
        type: string
        nullable: false
        descriptions:
          db: 公司名称
          ai: Name of the company reporting financials.
      - name: 报表期间
        type: string
        nullable: false
        descriptions:
          db: 报表期间，格式YYYYMM，例如202605
          ai: Reporting period in YYYYMM format.
      - name: 报表日期
        type: time
        nullable: false
        descriptions:
          db: 报表日期，例如2026-05-31
          ai: Exact date of the financial statement.
      - name: 展示顺序
        type: number
        descriptions:
          db: 展示顺序，按原始报表行顺序排序
          ai: Display order following the original report sequence.
      - name: 行次
        type: number
        descriptions:
          db: 原报表行次
          ai: Original line number from the source report.
      - name: 项目名称
        type: string
        nullable: false
        descriptions:
          db: 财报项目名称
          ai: Name of the financial statement line item.
      - name: 本年累计金额
        type: number
        descriptions:
          ai: Cumulative year-to-date monetary amount.
      - name: 本月金额
        type: number
        descriptions:
          ai: Monetary amount for the current month.
    descriptions:
      db: VIEW
      ai: Stores detailed income statement line items for companies with monthly and year-to-date amounts.
  superstore_orders:
    table: dataforai.superstore_orders
    columns:
      - name: row_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 行 ID
          ai: Surrogate primary key identifying each order line.
      - name: order_id
        type: string
        nullable: false
        descriptions:
          db: 订单 ID
          ai: Business identifier grouping line items under one customer order.
      - name: order_date
        type: time
        nullable: false
        descriptions:
          db: 订单日期
          ai: Calendar date when the customer placed the order.
      - name: ship_date
        type: time
        nullable: false
        descriptions:
          db: 发货日期
          ai: Calendar date when the order line was shipped.
      - name: ship_mode
        type: string
        descriptions:
          db: 装运模式
          ai: Shipping service level chosen for delivery.
      - name: customer_id
        type: string
        descriptions:
          db: 客户 ID
          ai: Unique identifier assigned to the purchasing customer.
      - name: customer_name
        type: string
        descriptions:
          db: 客户名称
          ai: Full name of the customer who placed the order.
      - name: segment
        type: string
        descriptions:
          db: 细分
          ai: Market segment classification of the customer.
      - name: city
        type: string
        descriptions:
          db: 城市
          ai: Destination city for the shipped order.
      - name: province
        type: string
        descriptions:
          db: 省/自治区
          ai: Destination province or autonomous region for shipment.
      - name: country_region
        type: string
        descriptions:
          db: 国家/地区
          ai: Country where the customer is located.
      - name: region
        type: string
        descriptions:
          db: 区域
          ai: Macro geographic region grouping provinces within China.
      - name: product_id
        type: string
        descriptions:
          db: 产品 ID
          ai: Unique identifier of the purchased product.
      - name: category
        type: string
        descriptions:
          db: 类别
          ai: Top-level product category classification.
      - name: sub_category
        type: string
        descriptions:
          db: 子类别
          ai: Detailed product subcategory beneath the category.
      - name: product_name
        type: string
        descriptions:
          db: 产品名称
          ai: Full descriptive name of the purchased product.
      - name: sales
        type: number
        descriptions:
          db: 销售额
          ai: Revenue amount generated by the order line.
      - name: quantity
        type: number
        descriptions:
          db: 数量
          ai: Number of units sold on the order line.
      - name: discount
        type: number
        descriptions:
          human: 折扣（0-1），聚合口径见 measures.discount_rate。
          db: 折扣
          ai: Discount rate applied to the order line.
      - name: profit
        type: number
        descriptions:
          human: 行级净利润，可为负值（亏损行），口径见 measures.profit_margin。
          db: 利润
          ai: Net profit earned on the order line after discount.
      - name: postal_code
        type: string
        descriptions:
          db: 邮政编码
          ai: Postal code of the customer shipping address.
      - name: source_system
        type: string
        nullable: false
        descriptions:
          db: 来源系统
          ai: Originating system that supplied the record.
      - name: source_file
        type: string
        nullable: false
        descriptions:
          db: 来源文件
          ai: Path of the source file the record was extracted from.
      - name: source_sheet
        type: string
        nullable: false
        descriptions:
          db: 来源工作表
          ai: Worksheet name within the source file containing the data.
      - name: source_row_number
        type: number
        nullable: false
        descriptions:
          db: 来源文件行号
          ai: Row number of the record within the source worksheet.
      - name: batch_id
        type: string
        nullable: false
        descriptions:
          db: 导入批次 ID
          ai: Identifier of the ingestion batch that loaded the record.
      - name: row_hash
        type: string
        nullable: false
        descriptions:
          db: 业务字段 SHA-256 哈希
          ai: SHA-256 hash of business fields for change detection.
      - name: is_deleted
        type: number
        nullable: false
        descriptions:
          db: 逻辑删除标记
          ai: Soft-delete flag indicating whether the record is active.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 入库时间
          ai: Timestamp when the record was first written to the warehouse.
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
          ai: Timestamp when the record was last modified in the warehouse.
    descriptions:
      db: Tableau 示例超市订单 ODS 明细表
      ai: Superstore retail order line items with customer, product, geographic, financial, and ingestion audit fields.
