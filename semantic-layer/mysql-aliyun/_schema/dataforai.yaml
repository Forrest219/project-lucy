  ad_account_daily:
    table: dataforai.ad_account_daily
    columns:
    - name: date
      type: time
      pk: true
      nullable: false
      descriptions:
        db: 投放业务日。相对「最近/本周」锚定本表 max(date)，不用系统今天。
        ai: 投放日期；相对时间锚定 max(date)。
    - name: account_name
      type: string
      pk: true
      nullable: false
      descriptions:
        db: 广告账户名。含「自运营」或「代理」表示运营类型（无独立字段）。账户与渠道、客户等级固定绑定。
        ai: 账户名；自运营/代理从名称识别。
    - name: channel
      type: string
      nullable: false
      descriptions:
        db: 投放渠道。枚举：巨量引擎 / 腾讯广告 / 百度营销 / 小红书 / 快手磁力引擎。
        ai: 投放渠道。
    - name: customer_level
      type: string
      nullable: false
      descriptions:
        db: 账户客户等级。枚举：A级 / B级 / C级。
        ai: 客户等级 A/B/C。
    - name: spend
      type: number
      nullable: false
      descriptions:
        db: 当日广告花费，单位元人民币。
