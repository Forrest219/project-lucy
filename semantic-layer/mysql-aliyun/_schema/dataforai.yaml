  superstore_orders:
    table: dataforai.superstore_orders
    columns:
      - name: row_id
        type: number
        pk: true
        nullable: false
        descriptions:
          db: 行 ID
          ai: Auto-incrementing surrogate primary key for each line item.
      - name: order_id
        type: string
        nullable: false
        descriptions:
          db: 订单 ID
          ai: Unique identifier grouping line items belonging to the same order.
      - name: order_date
        type: time
        nullable: false
        descriptions:
          db: 订单日期
          ai: Calendar date when the customer placed the order.
      - name: ship_date
        type: time
        nullable: false
        descriptions:
          db: 发货日期
          ai: Calendar date when the order was shipped to the customer.
      - name: ship_mode
        type: string
        descriptions:
          db: 装运模式
          ai: Shipping service level selected for order delivery.
      - name: customer_id
        type: string
        descriptions:
          db: 客户 ID
          ai: Unique identifier assigned to the purchasing customer.
      - name: customer_name
        type: string
        descriptions:
          db: 客户名称
          ai: Full name of the customer who placed the order.
      - name: segment
        type: string
        descriptions:
          db: 细分
          ai: Market segment classification of the customer.
      - name: city
        type: string
        descriptions:
          db: 城市
          ai: City of the customer's shipping address.
      - name: province
        type: string
        descriptions:
          db: 省/自治区
          ai: Province or autonomous region of the shipping address.
      - name: country_region
        type: string
        descriptions:
          db: 国家/地区
          ai: Country of the customer's shipping address.
      - name: region
        type: string
        descriptions:
          db: 区域
          ai: Macroeconomic region grouping within China.
      - name: product_id
        type: string
        descriptions:
          db: 产品 ID
          ai: Unique identifier for the sold product.
      - name: category
        type: string
        descriptions:
          db: 类别
          ai: Top-level product category classification.
      - name: sub_category
        type: string
        descriptions:
          db: 子类别
          ai: Detailed product sub-category classification.
      - name: product_name
        type: string
        descriptions:
          db: 产品名称
          ai: Descriptive name of the sold product.
      - name: sales
        type: number
        descriptions:
          db: 销售额
          ai: Total revenue generated by the line item.
      - name: quantity
        type: number
        descriptions:
          db: 数量
          ai: Number of units sold on the line item.
      - name: discount
        type: number
        descriptions:
          human: 折扣（0-1），聚合口径见 measures.discount_rate。
          db: 折扣
          ai: Fractional discount rate applied to the line item.
      - name: profit
        type: number
        descriptions:
          human: 行级净利润，可为负值（亏损行），口径见 measures.profit_margin。
          db: 利润
          ai: Net profit earned on the line item.
      - name: postal_code
        type: string
        descriptions:
          db: 邮政编码
          ai: Postal code of the customer's shipping address.
      - name: source_system
        type: string
        nullable: false
        descriptions:
          db: 来源系统
          ai: Originating system that supplied the record.
      - name: source_file
        type: string
        nullable: false
        descriptions:
          db: 来源文件
          ai: Path of the source file from which the record was loaded.
      - name: source_sheet
        type: string
        nullable: false
        descriptions:
          db: 来源工作表
          ai: Worksheet name within the source workbook.
      - name: source_row_number
        type: number
        nullable: false
        descriptions:
          db: 来源文件行号
          ai: Original row number in the source file.
      - name: batch_id
        type: string
        nullable: false
        descriptions:
          db: 导入批次 ID
          ai: Identifier of the ETL ingestion batch.
      - name: row_hash
        type: string
        nullable: false
        descriptions:
          db: 业务字段 SHA-256 哈希
          ai: SHA-256 hash of business fields for change detection.
      - name: is_deleted
        type: number
        nullable: false
        descriptions:
          db: 逻辑删除标记
          ai: Flag indicating soft-deletion status.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 入库时间
          ai: Timestamp when the record was first loaded.
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 更新时间
          ai: Timestamp when the record was last modified.
    descriptions:
      db: Tableau 示例超市订单 ODS 明细表
      ai: Granular superstore order line-item records with customer, product, geography, financials, and ETL lineage metadata for China-based retail analytics.
