          ai: Year-month identifier of the statistical period in YYYYMM format.
      - name: stats_year
        type: string
        nullable: false
        descriptions:
          db: 统计年度(YYYY)，从统计日期提取，例如 2025
          ai: Fiscal year extracted from the statistical date.
      - name: report_period
        type: string
        pk: true
        nullable: false
