tables:
  "#tableau_426_sid_00783d43_4_prep":
    table: mj_test.#tableau_426_sid_00783d43_4_prep
    columns:
      - name: updated_at
        type: time
        descriptions:
          ai: Timestamp of the most recent update to the record.
      - name: created_at
        type: time
        descriptions:
          ai: Timestamp when the record was first created in the system.
      - name: etl_batch_id
        type: string
        descriptions:
          ai: Identifier linking the record to its ETL pipeline batch run.
      - name: stats_date
        type: time
        descriptions:
          ai: Specific date the statistical or financial data represents.
      - name: period_amount
        type: number
        descriptions:
          ai: Financial or metric value for the specific reporting period only.
      - name: stats_yyyymm
        type: string
        descriptions:
          ai: Year and month of the statistic in YYYYMM format.
      - name: stats_year
        type: string
        descriptions:
          ai: Calendar year associated with the statistical data.
      - name: report_period
        type: string
        descriptions:
          ai: Label for the reporting period, such as January or Q1.
      - name: report_period_range
        type: string
        descriptions:
          ai: Start and end date range defining the reporting period.
      - name: entity_code
        type: string
        descriptions:
          ai: Short code uniquely identifying the business entity or organizational unit.
      - name: entity_name
        type: string
        descriptions:
          ai: Full descriptive name of the business entity or organizational unit.
      - name: statement_section
        type: string
        descriptions:
          ai: Section of the financial statement the line item belongs to.
      - name: line_level
        type: number
        descriptions:
          ai: Hierarchical depth level of the line item within the statement.
      - name: line_order
        type: number
        descriptions:
          ai: Numeric sort order for displaying line items within a section.
      - name: line_code
        type: string
        descriptions:
          ai: Unique code identifying a specific line item in the statement.
      - name: account_code
        type: string
        descriptions:
          ai: General ledger or chart-of-accounts code for the financial account.
      - name: account_name
        type: string
        descriptions:
          ai: Descriptive name of the financial account tied to the line.
      - name: indicator_name
        type: string
        descriptions:
          ai: Name of the financial or performance metric being tracked.
      - name: indicator_unit
        type: string
        descriptions:
          ai: Unit of measurement for the indicator, such as currency or percentage.
      - name: ytd_amount
        type: number
        descriptions:
          ai: Cumulative year-to-date financial amount from the start of the year.
      - name: load_time
        type: time
        descriptions:
          ai: Timestamp when the record was loaded into this staging table.
      - name: data_source
        type: string
        descriptions:
          ai: Upstream system or origin from which the data was sourced.
    descriptions:
      ai: Tableau prep staging table holding periodic financial statement data by entity, account, and performance indicator across reporting periods.
  dm_fin_bs_fact:
    table: mj_test.dm_fin_bs_fact
    columns:
      - name: stats_date
        type: time
        nullable: false
        descriptions:
          db: 统计日期(YYYY-MM-DD)，核算月每月一号，例如 2025-09-01
          ai: First day of the reporting month; serves as the time dimension key.
      - name: stats_yyyymm
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 统计年月(YYYYMM)，例如 202509
          ai: Year-month identifier for the reporting period in YYYYMM format.
      - name: stats_year
        type: string
        nullable: false
        descriptions:
          db: 统计年度(YYYY)，从统计日期提取，例如 2025
          ai: Calendar year extracted from the reporting date.
      - name: report_period
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 核算周期/报告类型标准化，例如 一季报/中报/三季报/年报
          ai: "Standardized reporting cycle label: Q1, interim, Q3, or annual report."
      - name: report_period_range
        type: string
        descriptions:
          db: 统计期间，例如 202501-202509（按报告期生成）
          ai: Start-to-end month range covered by the report period.
      - name: entity_name
        type: string
        nullable: false
        descriptions:
          db: 核算主体（当前阶段单一主体）
          ai: Legal name of the reporting company or accounting entity.
      - name: entity_code
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 核算主体编码
          ai: Unique identifier code for the reporting entity.
      - name: statement_section
        type: string
        descriptions:
          db: 指标类别/报表大类，例如 流动资产/非流动资产/流动负债/非流动负债/所有者权益
          ai: "Balance sheet section grouping: current assets, liabilities, or equity."
      - name: line_level
        type: number
        descriptions:
          db: 指标层级/科目层级，例如 1/2/3
          ai: Hierarchy depth of the line item within the balance sheet structure.
      - name: line_order
        type: number
        descriptions:
          db: 指标排序/展示顺序，例如 10
          ai: Display sequence number controlling the sort order of line items.
      - name: line_code
        type: string
        nullable: false
        descriptions:
          db: 指标名称编码（用于指标配置的编码），例如 KM_0001
          ai: Internal configuration code uniquely identifying each balance sheet line item.
      - name: account_code
        type: string
        descriptions:
          db: 科目编码（ERP取数），例如 600001（当前置为00）
          ai: ERP source system account code; placeholder when not yet mapped.
      - name: account_name
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 科目名称，例如 货币资金
          ai: Official account name from the chart of accounts.
      - name: indicator_name
        type: string
        descriptions:
          db: 指标名称（用于前台展示），例如 货币资金
          ai: Front-end display label for the financial metric.
      - name: indicator_unit
        type: string
        descriptions:
          db: 指标单位，例如 元/%（一般金额单位）
          ai: Unit of measurement for the indicator value, such as currency.
      - name: opening_balance
        type: number
        descriptions:
          db: 期初余额（科目金额），例如 123456.78
          ai: Account balance at the beginning of the reporting period.
      - name: ending_balance
        type: number
        descriptions:
          db: 期末余额（科目金额），例如 234567.89
          ai: Account balance at the end of the reporting period.
      - name: data_source
        type: string
        nullable: false
        descriptions:
          db: 数据来源/来源记录，例如 财务报表
          ai: Origin system or process that supplied the financial data.
      - name: load_time
        type: time
        nullable: false
        descriptions:
          db: 数据更新时间/ETL加载时间(YYYY-MM-DD HH:MM:SS)，例如 2026-01-28 10:30:00
          ai: Timestamp when the ETL process last loaded or refreshed this record.
      - name: etl_batch_id
        type: string
        descriptions:
          db: ETL批次号/任务实例ID（推荐，用于对账与排障）
          ai: ETL job batch identifier used for reconciliation and troubleshooting.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 记录创建时间
          ai: Timestamp when the record was first inserted into the table.
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 记录更新时间
          ai: Timestamp of the most recent update to the record.
    descriptions:
      db: 资产负债事实表；update_mode=monthly_overwrite；粒度=主体+统计年月+核算周期+指标行+科目
      ai: Balance sheet fact table storing periodic financial line-item balances by entity, reporting period, and account classification.
  dm_fin_cf_fact:
    table: mj_test.dm_fin_cf_fact
    columns:
      - name: stats_date
        type: time
        nullable: false
        descriptions:
          db: 统计日期(YYYY-MM-DD)，核算月每月一号，例如 2025-09-01
          ai: First day of the accounting month representing the reporting period.
      - name: stats_yyyymm
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 统计年月(YYYYMM)，例如 202509
          ai: Year-month identifier for the accounting period in YYYYMM format.
      - name: stats_year
        type: string
        nullable: false
        descriptions:
          db: 统计年度(YYYY)，从统计日期提取，例如 2025
          ai: Fiscal year extracted from the statistics date.
      - name: report_period
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 核算周期/报告类型标准化，例如 一季报/中报/三季报/年报
          ai: "Standardized report type: Q1, interim, Q3, or annual."
      - name: report_period_range
        type: string
        descriptions:
          db: 统计期间，例如 202501-202509（按报告期生成）
          ai: Start-to-end month span covered by the report, formatted YYYYMM-YYYYMM.
      - name: entity_name
        type: string
        nullable: false
        descriptions:
          db: 核算主体（当前阶段单一主体）
          ai: Legal name of the reporting company or accounting entity.
      - name: entity_code
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 核算主体编码
          ai: Unique numeric identifier for the reporting entity.
      - name: statement_section
        type: string
        descriptions:
          db: 指标类别/报表大类（现金流量表分区/大类）
          ai: "Cash flow activity category: operating, investing, or financing."
      - name: line_level
        type: number
        descriptions:
          db: 指标层级/科目层级，例如 1/2/3
          ai: Hierarchy depth of the line item within the statement structure.
      - name: line_order
        type: number
        descriptions:
          db: 指标排序/展示顺序，例如 10
          ai: Numeric sequence controlling display order in financial reports.
      - name: line_code
        type: string
        nullable: false
        descriptions:
          db: 指标名称编码（用于指标配置的编码），例如 KM_0001
          ai: Unique configuration code identifying each financial indicator.
      - name: account_code
        type: string
        descriptions:
          db: 科目编码（ERP取数；当前可能为空）
          ai: ERP source account code; may be empty for some records.
      - name: account_name
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 科目名称（当前用于唯一键；科目名称基本稳定）
          ai: ERP account name serving as a stable unique key for mapping.
      - name: indicator_name
        type: string
        descriptions:
          db: 指标名称（用于前台展示），例如 经营活动现金流入小计
          ai: Front-end display label for the cash flow line item.
      - name: indicator_unit
        type: string
        descriptions:
          db: 指标单位，例如 元/%（一般金额单位）
          ai: Unit of measurement, typically currency (元) or percentage.
      - name: ytd_amount
        type: number
        descriptions:
          db: 累计值（金额类使用DECIMAL避免浮点误差），例如 123456.78
          ai: Cumulative year-to-date cash flow amount for the report period.
      - name: period_amount
        type: number
        descriptions:
          db: 当期值（金额类使用DECIMAL避免浮点误差），例如 12345.67
          ai: Cash flow amount for the current single period only.
      - name: data_source
        type: string
        nullable: false
        descriptions:
          db: 数据来源/来源记录，例如 财务报表
          ai: Origin system or report supplying the financial data.
      - name: load_time
        type: time
        nullable: false
        descriptions:
          db: 数据更新时间/ETL加载时间(YYYY-MM-DD HH:MM:SS)，例如 2026-01-28 10:30:00
          ai: Timestamp when the ETL process last loaded this record.
      - name: etl_batch_id
        type: string
        descriptions:
          db: ETL批次号/任务实例ID（推荐，用于对账与排障）
          ai: ETL job batch identifier used for reconciliation and troubleshooting.
      - name: created_at
        type: time
        nullable: false
        descriptions:
          db: 记录创建时间
          ai: Timestamp when the record was first inserted into the table.
      - name: updated_at
        type: time
        nullable: false
        descriptions:
          db: 记录更新时间
          ai: Timestamp when the record was last modified.
    descriptions:
      db: 现金流量表事实表；update_mode=monthly_overwrite；粒度=主体+统计年月+核算周期+指标行/科目名称
      ai: Cash flow statement fact table storing periodic line items by entity, report period, and activity section.
  dm_fin_pl_fact:
    table: mj_test.dm_fin_pl_fact
    columns:
      - name: stats_date
        type: time
        nullable: false
