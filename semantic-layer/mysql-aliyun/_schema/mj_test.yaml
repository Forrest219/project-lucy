          db: 统计期间，例如 202501-202509（按报告期生成）
          ai: Start-to-end month range covered by the report period, e.g., 202501-202509.
      - name: entity_name
        type: string
        nullable: false
        descriptions:
          db: 核算主体（当前阶段单一主体）
