          db: 指标类别/报表大类，例如 利润/成本费用
          ai: High-level P&L category grouping, e.g., revenue, cost, or investment income.
      - name: line_level
        type: number
        descriptions:
          db: 指标层级/科目层级，例如 1/2/3
          ai: Hierarchy depth of the P&L line item within the report structure.
      - name: line_order
        type: number
        descriptions:
          db: 指标排序/展示顺序，例如 10
          ai: Display sequence number for ordering line items in reports.
      - name: line_code
        type: string
        nullable: false
        descriptions:
          db: 指标名称编码（用于指标配置的编码），例如 KM_0001
          ai: Internal configuration code uniquely identifying each P&L indicator.
      - name: account_code
        type: string
        descriptions:
          db: 科目编码（ERP取数；当前可能为空）
          ai: ERP source account code; may be empty in current implementation.
      - name: account_name
        type: string
        pk: true
        nullable: false
        descriptions:
          db: 科目名称（当前用于唯一键；科目名称基本稳定）
          ai: ERP account name serving as a unique key; generally stable over time.
      - name: indicator_name
        type: string
        descriptions:
          db: 指标名称（用于前台展示），例如 营业收入
          ai: Front-end display label for the P&L line item.
      - name: indicator_unit
        type: string
        descriptions:
          db: 指标单位，例如 元/%（一般金额单位）
          ai: Measurement unit for the indicator, typically currency or percentage.
      - name: ytd_amount
        type: number
        descriptions:
          db: 累计值（金额类使用DECIMAL避免浮点误差），例如 123456.78
          ai: Year-to-date cumulative financial amount for the indicator.
      - name: period_amount
        type: number
        descriptions:
          db: 当期值（金额类使用DECIMAL避免浮点误差），例如 12345.67
          ai: Current reporting period financial amount for the indicator.
      - name: data_source
        type: string
        nullable: false
        descriptions:
          db: 数据来源/来源记录，例如 财务报表
