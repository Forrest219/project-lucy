name: Lucy release gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ktx_version:
        description: "Bundled @kaelio/ktx npm version to validate"
        required: false
        default: "0.16.0"
      release_tag:
        description: "Optional Docker/image tag used by release-package"
        required: false

# release-package pushes a multi-arch manifest list to the container registry.
# Other jobs only build & smoke; they do not need write access.
permissions:
  contents: read
  packages: write

env:
  KTX_VERSION: ${{ inputs.ktx_version || '0.16.0' }}
  LUCY_EXPECTED_KTX_VERSION: ${{ inputs.ktx_version || '0.16.0' }}

jobs:
  spec-and-webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:version
      - run: npm run smoke:p0:delivery-isolation
      - name: Materialize private access.yaml stub for lint
        run: |
          if [ ! -f webui/config/access.yaml ]; then
            cp webui/config/access.yaml.example webui/config/access.yaml
          fi
      - run: npm run lint:spec
      - run: npm run security:baseline
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: cp ktx.yaml.example ktx.yaml
      - run: npm ci
        working-directory: webui
      - run: npm run lint:terminology
        working-directory: webui
      - run: npm test
        working-directory: webui
      - run: npm run build
        working-directory: webui

  business-eval-catalog:
    runs-on: ubuntu-latest
    needs: spec-and-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:business-eval

  ktx-diff-audit:
    runs-on: ubuntu-latest
    needs: spec-and-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Checkout upstream KTX
        run: git clone --depth 1 https://github.com/Kaelio/ktx /tmp/ktx-upstream
      - name: Generate diff audit
        run: npm run audit:ktx-diff -- --ktx /tmp/ktx-upstream --out inbox/ktx-lucy-diff-ci.md
      - uses: actions/upload-artifact@v4
        with:
          name: ktx-lucy-diff-audit
          path: inbox/ktx-lucy-diff-ci.md

  docker-smoke:
    runs-on: ubuntu-latest
    needs: spec-and-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: webui
      - run: npm run smoke:p0:docker

  k8s-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run gate:k8s-static
      - run: npm run test:k8s-delivery-package
      - run: npm run test:k8s-gate-negative
      - run: npm run smoke:p0:docker-entrypoint:test

  k8s-upgrade-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: H3/H4 kind in-place upgrade gate
        env:
          KTX_VERSION: ${{ env.KTX_VERSION }}
        run: npm run gate:k8s-kind-h3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8s-h3-evidence
          path: inbox/k8s-h3-evidence-*
          if-no-files-found: ignore

  headless-config:
    runs-on: ubuntu-latest
    needs: spec-and-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:headless-config

  demo-e2e:
    runs-on: ubuntu-latest
    needs: docker-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:demo

  postgres-demo-e2e:
    runs-on: ubuntu-latest
    needs: docker-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:postgres-demo

  ktx-upgrade-compat:
    runs-on: ubuntu-latest
    needs:
      - docker-smoke
      - headless-config
      - demo-e2e
      - postgres-demo-e2e
      - business-eval-catalog
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ktx_version != '0.16.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run compat:ktx-upgrade -- --baseline 0.16.0 --candidate "$KTX_VERSION"

  release-package:
    runs-on: ubuntu-latest
    needs:
      - docker-smoke
      - k8s-static
      - k8s-upgrade-gate
      - headless-config
      - demo-e2e
      - postgres-demo-e2e
      - business-eval-catalog
      - ktx-diff-audit
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Resolve Lucy product version
        id: lucy-version
        run: |
          set -euo pipefail
          LUCY_VERSION="$(tr -d '[:space:]' < VERSION)"
          npm run lint:version
          echo "version=${LUCY_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Resolve release tag
        id: release
        env:
          LUCY_VERSION: ${{ steps.lucy-version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="customer-multiarch-${LUCY_VERSION}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
            fi
          fi
          node scripts/lucy-version-governance.mjs --release-tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.LUCY_IMAGE_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Single build → push → gate the exact digest. Do not rebuild after gates.
      - name: Build & push multi-arch image (once)
        id: build-push
        env:
          REGISTRY: ${{ vars.LUCY_IMAGE_REGISTRY || 'ghcr.io' }}
          IMAGE_NAMESPACE: ${{ vars.LUCY_IMAGE_NAMESPACE || 'kaelio' }}
          LUCY_VERSION: ${{ steps.lucy-version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/project-lucy:${TAG}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "KTX_VERSION=${KTX_VERSION}" \
            --build-arg "LUCY_VERSION=${LUCY_VERSION}" \
            --build-arg "TARGETPLATFORM=linux/amd64" \
            --build-arg "TARGETARCH=amd64" \
            --tag "${IMAGE}" \
            --tag "${REGISTRY}/${IMAGE_NAMESPACE}/project-lucy:${GITHUB_SHA}" \
            --metadata-file /tmp/buildx-metadata.json \
            --push .
          DIGEST="$(python3 -c 'import json; print(json.load(open("/tmp/buildx-metadata.json"))["containerimage.digest"])')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          mkdir -p release
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "image=${IMAGE}"
            echo "manifest_digest=${DIGEST}"
            echo "lucy_version=${LUCY_VERSION}"
            echo "ktx_version=${KTX_VERSION}"
            echo "platforms=linux/amd64,linux/arm64"
          } > release/image-identity.txt
      - name: Gate final registry amd64 digest (G1/G2/G4b/G8)
        env:
          IMAGE_REF: ${{ steps.build-push.outputs.ref }}
          KTX_VERSION: ${{ env.KTX_VERSION }}
          LUCY_VERSION: ${{ steps.lucy-version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_REF}" | tee release/imagetools-inspect.txt
          grep -q 'linux/amd64' release/imagetools-inspect.txt
          docker pull --platform linux/amd64 "${IMAGE_REF}"
          META="$(docker image inspect "${IMAGE_REF}" --format '{{.Os}}/{{.Architecture}}')"
          test "${META}" = "linux/amd64"
          bash scripts/assert-image-elf-arch.sh "${IMAGE_REF}" amd64
          docker run --rm --network=none --platform linux/amd64 --entrypoint /bin/sh "${IMAGE_REF}" -c \
            "test -x /home/lucy/.ktx/runtime/${KTX_VERSION}/.venv/bin/python"
          docker run --rm --network=none --platform linux/amd64 --entrypoint ktx "${IMAGE_REF}" --version | tee release/ktx-version.txt
          grep -q "${KTX_VERSION}" release/ktx-version.txt
          IMAGE_LUCY_VERSION="$(docker run --rm --network=none --platform linux/amd64 --entrypoint printenv "${IMAGE_REF}" LUCY_VERSION)"
          test "${IMAGE_LUCY_VERSION}" = "${LUCY_VERSION}"
          printf '%s\n' "${IMAGE_LUCY_VERSION}" > release/lucy-version.txt
          bash scripts/g8-image-k8s-contract-gate.sh "${IMAGE_REF}"
          docker image inspect "${IMAGE_REF}" --format '{{.Id}}' > release/image-config-id.txt
      - name: Write release notes
        env:
          LUCY_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          LUCY_DOCKER_IMAGE: ${{ steps.build-push.outputs.image }}
          LUCY_IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
          LUCY_PLATFORMS: linux/amd64,linux/arm64
        run: npm run release:artifacts -- --tag "${{ steps.release.outputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: lucy-release-artifacts
          path: release/
