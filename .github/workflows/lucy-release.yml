name: Lucy release gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ktx_version:
        description: "Bundled @kaelio/ktx npm version to validate"
        required: false
        default: "0.13.0"
      release_tag:
        description: "Optional Docker/image tag used by release-package"
        required: false

env:
  KTX_VERSION: ${{ inputs.ktx_version || '0.13.0' }}
  LUCY_EXPECTED_KTX_VERSION: ${{ inputs.ktx_version || '0.13.0' }}

jobs:
  spec-and-webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:spec
      - run: npm run security:baseline
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm test
        working-directory: webui
      - run: npm run build
        working-directory: webui

  business-eval-catalog:
    runs-on: ubuntu-latest
    needs: spec-and-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:business-eval

  ktx-diff-audit:
    runs-on: ubuntu-latest
    needs: spec-and-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Checkout upstream KTX
        run: git clone --depth 1 https://github.com/Kaelio/ktx /tmp/ktx-upstream
      - name: Generate diff audit
        run: npm run audit:ktx-diff -- --ktx /tmp/ktx-upstream --out inbox/ktx-lucy-diff-ci.md
      - uses: actions/upload-artifact@v4
        with:
          name: ktx-lucy-diff-audit
          path: inbox/ktx-lucy-diff-ci.md

  docker-smoke:
    runs-on: ubuntu-latest
    needs: spec-and-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: webui
      - run: npm run smoke:p0:docker

  demo-e2e:
    runs-on: ubuntu-latest
    needs: docker-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:demo

  ktx-upgrade-compat:
    runs-on: ubuntu-latest
    needs:
      - docker-smoke
      - demo-e2e
      - business-eval-catalog
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ktx_version != '0.13.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run compat:ktx-upgrade -- --baseline 0.13.0 --candidate "$KTX_VERSION"

  release-package:
    runs-on: ubuntu-latest
    needs:
      - docker-smoke
      - demo-e2e
      - business-eval-catalog
      - ktx-diff-audit
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: release
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME:-manual-${GITHUB_SHA::7}}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build tagged image
        run: docker build --build-arg "KTX_VERSION=$KTX_VERSION" -t "project-lucy:${{ steps.release.outputs.tag }}" -t "project-lucy:${GITHUB_SHA}" .
      - name: Write release notes
        run: |
          mkdir -p release
          {
            echo "# Lucy ${{ steps.release.outputs.tag }}"
            echo
            echo "- Git commit: ${GITHUB_SHA}"
            echo "- Docker image tags: project-lucy:${{ steps.release.outputs.tag }}, project-lucy:${GITHUB_SHA}"
            echo "- Bundled KTX: @kaelio/ktx ${KTX_VERSION}"
            echo "- Required gates: spec-and-webui, security-baseline, docker-smoke, demo-e2e, business-eval-catalog, ktx-diff-audit"
            echo
            echo "## Customer deployment"
            echo
            echo "Use docs/customer-deployment-guide.md and docs/deployment-docker.md for Docker Compose deployment."
          } > release/lucy-release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: lucy-release-notes
          path: release/lucy-release-notes.md
