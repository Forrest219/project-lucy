# Lucy release gates — the CUSTOMER RELEASE / DIAGNOSTICS path only.
#
# Contract: docs/specs/lucy-ci-restoration-spec.md v1.0 §4.2.
#
# Triggers (deliberately narrow):
#   - a `v*` tag, or
#   - an explicit manual dispatch that first picks a mode.
# The daily pull_request / push-to-main triggers were REMOVED in the same commit that added
# .github/workflows/lucy-ci.yml, so no job of this workflow and no job of the daily workflow
# ever runs on the same event (Spec §4.1: existing job ids must not appear in two workflows for
# the same event).
#
# The daily verification jobs are still repeated HERE on purpose: the release path must re-run
# the daily and delivery gates on the SAME sha it packages. They are reached from this workflow
# only, never through workflow_run, so no trust boundary is crossed.
#
# The jobs that also exist in the daily workflow carry a `release / ` display name so their
# GitHub check context never collides with the daily one.
name: Lucy release gates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnostics (read-only, default) | ktx-compat (compatibility only) | customer-candidate (builds and promotes a candidate)"
        required: true
        default: "diagnostics"
        type: choice
        options:
          - diagnostics
          - ktx-compat
          - customer-candidate
      ktx_version:
        description: "Bundled @kaelio/ktx npm version to validate"
        required: false
        default: "0.16.0"
      release_tag:
        description: "Optional Docker/image tag used by release-package"
        required: false

# release-package promotes the tested linux/amd64 digest. It does not build.
# Only the candidate-image job and the promote job need write access; every other job here is
# read-only (Spec §5).
permissions:
  contents: read

# Release runs are never auto-cancelled: a cancelled candidate run must not look like a passed one.
concurrency:
  group: lucy-release-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  KTX_VERSION: ${{ inputs.ktx_version || '0.16.0' }}
  LUCY_EXPECTED_KTX_VERSION: ${{ inputs.ktx_version || '0.16.0' }}

jobs:
  spec-and-webui:
    name: release / spec-and-webui
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history + tags: the release ledger cross-checks each recorded
          # commit against the object database and the release tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:upgrade-lucy:test
      - run: npm run lint:version
      - run: npm run lint:release-ledger
      - run: npm run smoke:p0:delivery-isolation
      - name: Materialize private access.yaml stub for lint
        run: |
          if [ ! -f webui/config/access.yaml ]; then
            cp webui/config/access.yaml.example webui/config/access.yaml
          fi
      - run: npm run lint:spec
      - run: npm run lint:spec-docs
      - run: npm run security:baseline
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: cp ktx.yaml.example ktx.yaml
      - run: npm ci
        working-directory: webui
      - run: npm run lint:terminology
        working-directory: webui
      - run: npm run lint:url-driven-input
        working-directory: webui
      - run: npm test
        working-directory: webui
      - run: npm run build
        working-directory: webui

  business-eval-catalog:
    name: release / business-eval-catalog
    runs-on: ubuntu-24.04
    needs: spec-and-webui
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:business-eval

  ktx-diff-audit:
    # The upstream drift audit also runs in the DAILY workflow (.github/workflows/lucy-ci.yml).
    # This copy is the release-time re-run: the release path re-runs the gates on the same sha.
    # It is not a required check, and it is not the daily job's replacement.
    name: release / ktx-diff-audit
    runs-on: ubuntu-24.04
    needs: spec-and-webui
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Checkout upstream KTX at the pinned commit
        env:
          KTX_UPSTREAM_REPO: https://github.com/Kaelio/ktx
          # Same pinned upstream commit as the daily workflow.
          KTX_UPSTREAM_SHA: 49a4ae6f5b28c904da921afc0ee72da6db7ac202
        run: |
          set -euo pipefail
          rm -rf /tmp/ktx-upstream
          git init -q /tmp/ktx-upstream
          cd /tmp/ktx-upstream
          git remote add origin "${KTX_UPSTREAM_REPO}"
          git fetch -q --depth 1 origin "${KTX_UPSTREAM_SHA}" \
            || git fetch -q --depth 200 origin main
          git checkout -q "${KTX_UPSTREAM_SHA}"
          test "$(git rev-parse HEAD)" = "${KTX_UPSTREAM_SHA}"
          echo "upstream KTX commit: $(git rev-parse HEAD)"
      - name: Generate diff audit
        run: npm run audit:ktx-diff -- --ktx /tmp/ktx-upstream --out inbox/ktx-lucy-diff-ci.md
      - name: Record the identities the report was produced against
        env:
          KTX_UPSTREAM_SHA: 49a4ae6f5b28c904da921afc0ee72da6db7ac202
        run: |
          {
            echo "lucy_sha=${GITHUB_SHA}"
            echo "ktx_npm_version=${KTX_VERSION}"
            echo "ktx_upstream_sha=${KTX_UPSTREAM_SHA}"
          } > inbox/ktx-lucy-diff-ci.identities.txt
          cat inbox/ktx-lucy-diff-ci.identities.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ktx-lucy-diff-audit
          path: |
            inbox/ktx-lucy-diff-ci.md
            inbox/ktx-lucy-diff-ci.identities.txt

  docker-smoke:
    name: release / docker-smoke
    runs-on: ubuntu-24.04
    needs: spec-and-webui
    # Bound the gate. Without this the job inherits the 360-minute default and a
    # hang blocks the release train for six hours with no diagnosable failure.
    # The legitimate path is ~25 min (two cold image builds + compose + probes).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: webui
      # p0-smoke runs the WebUI suite and the WebUI server with cwd=webui, and
      # findProjectRoot() walks up from there looking for ktx.yaml. The file is
      # gitignored (it is environment-specific), so a clean CI checkout has no
      # project root and every WebUI test that resolves one fails with
      # PROJECT_NOT_FOUND. Same materialisation as spec-and-webui above.
      - run: cp ktx.yaml.example ktx.yaml
      # The WebUI suite is spec-and-webui's job and this job depends on it, so
      # the suite has already run and passed here. Running it a second time
      # only doubles the chance of a load-sensitive flake reddening the train.
      - run: npm run smoke:p0:docker -- --skip-webui-suite

  k8s-static:
    name: release / k8s-static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # scripts/gates/preflight-upgrade-lib.mjs resolves the YAML parser from webui/node_modules/yaml
      # (the customer container path), so the webui dependencies must be installed in this job too.
      # Without them the gate library throws before it can print, and the negative contract tests
      # fail on an empty stdout instead of on a real defect.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run gate:k8s-static
      - run: npm run test:k8s-delivery-package
      - run: npm run test:k8s-gate-negative
      - run: npm run smoke:p0:docker-entrypoint:test
      # Real-user E2E harness: catalog freeze, runners, verifier reverse tests, release workflow wiring.
      - run: npm run test:e2e-harness

  k8s-upgrade-gate:
    name: release / k8s-upgrade-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.4
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          install_only: true
      - name: H3/H4 kind in-place upgrade gate
        env:
          KTX_VERSION: ${{ env.KTX_VERSION }}
        run: npm run gate:k8s-kind-h3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: k8s-h3-evidence
          path: inbox/k8s-h3-evidence-*
          if-no-files-found: ignore

  headless-config:
    name: release / headless-config
    runs-on: ubuntu-24.04
    needs: spec-and-webui
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:headless-config

  demo-db-smoke:
    # Runs smoke:p0:demo (MySQL demo plus an in-container SQLite file probe). It is NOT the real-user E2E gate; see real-e2e below.
    name: release / demo-db-smoke
    runs-on: ubuntu-24.04
    needs: docker-smoke
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:demo

  postgres-demo-db-smoke:
    # Runs smoke:p0:postgres-demo (database/demo smoke). It is NOT the real-user E2E gate.
    name: release / postgres-demo-db-smoke
    runs-on: ubuntu-24.04
    needs: docker-smoke
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:postgres-demo

  ktx-upgrade-compat:
    # Compatibility verification only. It never mints a customer image or package.
    name: release / ktx-upgrade-compat
    runs-on: ubuntu-24.04
    needs:
      - docker-smoke
      - headless-config
      - demo-db-smoke
      - postgres-demo-db-smoke
      - business-eval-catalog
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'ktx-compat' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run compat:ktx-upgrade -- --baseline 0.16.0 --candidate "$KTX_VERSION"

  customer-amd64-native:
    # Builds the customer CANDIDATE once, natively on amd64, and runs the full runtime gates against that exact
    # digest. The candidate goes to the (restricted) registry under a `candidate-` tag only: the customer release tag
    # and package are produced by release-package after customer-release-readiness passed, by promoting THIS digest
    # (no rebuild, Spec §8.3). arm64 dev hosts (qemu-user) segfault when executing the ktx CLI module graph, so all
    # ktx-executing gates (G4/G4b, container smoke) run here on real amd64. Single-arch linux/amd64 only.
    #
    # This job and release-package are the ONLY jobs in this repository with packages:write.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'customer-candidate') }}
    timeout-minutes: 120
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
      image_ref: ${{ steps.build-push.outputs.ref }}
      image_repository: ${{ steps.build-push.outputs.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Resolve versions
        id: v
        run: |
          set -euo pipefail
          LUCY_VERSION="$(tr -d '[:space:]' < VERSION)"
          npm run lint:version
          echo "lucy=${LUCY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ vars.LUCY_IMAGE_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push single-arch amd64 CANDIDATE image (once)
        id: build-push
        env:
          REGISTRY: ${{ vars.LUCY_IMAGE_REGISTRY || 'ghcr.io' }}
          IMAGE_NAMESPACE: ${{ vars.LUCY_IMAGE_NAMESPACE || github.repository_owner }}
          LUCY_VERSION: ${{ steps.v.outputs.lucy }}
        run: |
          set -euo pipefail
          TAG="candidate-amd64-${LUCY_VERSION}-${{ steps.v.outputs.date }}-${GITHUB_SHA::7}"
          # GHCR package names are lowercase. github.repository_owner keeps the account's case.
          IMAGE_NAMESPACE="$(printf '%s' "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          REPOSITORY="${REGISTRY}/${IMAGE_NAMESPACE}/project-lucy"
          IMAGE="${REPOSITORY}:${TAG}"
          # Native amd64 runner: plain docker build. No buildx builder is created and no QEMU/binfmt is involved.
          docker build \
            --platform linux/amd64 \
            --build-arg "KTX_VERSION=${KTX_VERSION}" \
            --build-arg "LUCY_VERSION=${LUCY_VERSION}" \
            --build-arg "LUCY_GIT_SHA=${GITHUB_SHA}" \
            --build-arg "LUCY_GIT_DIRTY=0" \
            --build-arg "TARGETPLATFORM=linux/amd64" \
            --build-arg "TARGETARCH=amd64" \
            --tag "${IMAGE}" \
            .
          docker push "${IMAGE}"
          # Resolve pushed digest via RepoDigests (layers already local; pull is instant)
          DIGEST="$(docker pull "${IMAGE}" --quiet >/dev/null && docker image inspect "${IMAGE}" --format '{{index .RepoDigests 0}}' | sed 's/.*@//')"
          {
            echo "image=${IMAGE}"
            echo "tag=${TAG}"
            echo "repository=${REPOSITORY}"
            echo "digest=${DIGEST}"
            echo "ref=${REPOSITORY}@${DIGEST}"
          } >> "$GITHUB_OUTPUT"
          mkdir -p release/results
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "image=${IMAGE}"
            echo "manifest_digest=${DIGEST}"
            echo "lucy_version=${LUCY_VERSION}"
            echo "ktx_version=${KTX_VERSION}"
            echo "platforms=linux/amd64"
            echo "build_host=native-amd64-gha"
          } > release/image-identity.txt
          node scripts/gates/write-candidate-identity.mjs --image-digest "${DIGEST}" --ktx-version "${KTX_VERSION}" --out release/candidate-identity.json
      - name: Gate native amd64 image (G1/G2/G3/G4/G4b/G8), results bound to the candidate digest
        env:
          IMAGE_REF: ${{ steps.build-push.outputs.ref }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
          KTX_VERSION: ${{ env.KTX_VERSION }}
          LUCY_VERSION: ${{ steps.v.outputs.lucy }}
        run: |
          set -uo pipefail
          overall=0
          # Each gate's status comes from its own exit code and is recorded against the candidate digest.
          gate() {
            local name="$1"; shift
            set +e; "$@"; local rc=$?; set -e
            node scripts/gates/record-gate-result.mjs --results-dir release/results --name "${name}" --exit-code "${rc}" --image-digest "${DIGEST}" >/dev/null
            [ "${rc}" -eq 0 ] || overall=1
          }
          set -e
          # The gates below run their check through `bash -c` with a single-quoted inner
          # script. The single quotes are deliberate: the OUTER shell must not expand
          # IMAGE_REF / KTX_VERSION / LUCY_VERSION / GITHUB_SHA, the INNER bash expands them
          # from the step environment. ShellCheck cannot see that intent through the `gate`
          # wrapper, and actionlint always prepends a `set -eo pipefail` line to the script
          # it hands to ShellCheck, so the directive cannot be file-scoped: it has to sit
          # directly above each affected command.
          # G1: metadata arch
          # shellcheck disable=SC2016
          gate g1-metadata-arch bash -c 'test "$(docker image inspect "${IMAGE_REF}" --format "{{.Os}}/{{.Architecture}}")" = "linux/amd64"'
          # G2: ELF arch of node + tini (metadata alone is not proof)
          gate g2-elf-arch bash scripts/release/assert-image-elf-arch.sh "${IMAGE_REF}" amd64
          # G3: runtime smoke
          gate g3-runtime-smoke docker run --rm --network=none --platform linux/amd64 --entrypoint /bin/sh "${IMAGE_REF}" -c "echo ok"
          # G4: ktx CLI version (requires native amd64; segfaults under qemu-user)
          # shellcheck disable=SC2016
          gate g4-ktx-version bash -c 'docker run --rm --network=none --platform linux/amd64 --entrypoint ktx "${IMAGE_REF}" --version > release/ktx-version.txt && grep -q "${KTX_VERSION}" release/ktx-version.txt'
          # G4b: baked Python runtime for offline customers
          gate g4b-python-runtime docker run --rm --network=none --platform linux/amd64 --entrypoint /bin/sh "${IMAGE_REF}" -c \
            "test -x /home/lucy/.ktx/runtime/${KTX_VERSION}/.venv/bin/python && /home/lucy/.ktx/runtime/${KTX_VERSION}/.venv/bin/python --version"
          # LUCY_VERSION baked correctly
          # shellcheck disable=SC2016
          gate lucy-version-baked bash -c 'test "$(docker run --rm --network=none --platform linux/amd64 --entrypoint printenv "${IMAGE_REF}" LUCY_VERSION)" = "${LUCY_VERSION}"'
          # shellcheck disable=SC2016
          gate lucy-build-revision bash -c 'test "$(docker run --rm --network=none --platform linux/amd64 --entrypoint cat "${IMAGE_REF}" /app/BUILD_REVISION | tr -d "[:space:]")" = "${GITHUB_SHA}"'
          # shellcheck disable=SC2016
          gate lucy-build-revision-not-env bash -c 'test -z "$(docker run --rm --network=none --platform linux/amd64 --entrypoint printenv "${IMAGE_REF}" LUCY_GIT_SHA 2>/dev/null || true)"'
          # G8: K8s contract gate
          gate g8-k8s-contract bash scripts/gates/g8-image-k8s-contract-gate.sh "${IMAGE_REF}"
          docker image inspect "${IMAGE_REF}" --format '{{.Id}}' > release/image-config-id.txt
          exit "${overall}"
      - name: Container-level smoke (native amd64)
        run: npm run smoke:p0:docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: customer-amd64-native-evidence
          path: release/

  real-e2e:
    # Real-user E2E against the SAME candidate digest on an isolated single-replica K8s (Spec §6, §8.3, R8).
    # Requires a protected self-hosted runner that has: kubectl/helm access to the E2E namespace, the real Codex CLI and
    # Cursor CLI Agent binaries, and dedicated test model credentials (R10). Until that runner exists this job cannot
    # be scheduled, so customer-release-readiness stays BLOCKED and release-package never runs: there is no fallback
    # to headless smoke or to a local/arm64 result.
    runs-on: [self-hosted, lucy-protected, linux, amd64]
    needs:
      - customer-amd64-native
      - k8s-static
      - k8s-upgrade-gate
    timeout-minutes: 240
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'customer-candidate') }}
    outputs:
      run_id: ${{ steps.ids.outputs.run_id }}
    env:
      LUCY_E2E_NAMESPACE: ${{ vars.LUCY_E2E_NAMESPACE }}
      LUCY_E2E_BASE_URL: ${{ vars.LUCY_E2E_BASE_URL }}
      LUCY_E2E_MCP_URL: ${{ vars.LUCY_E2E_MCP_URL }}
      # B3 DB host for the disposable seeded PG. The harness connects with the per-run
      # owner role whose password lives in a 0600 file prepared by prepare-environment.
      LUCY_E2E_DB_HOST: ${{ vars.LUCY_E2E_DB_HOST }}
      LUCY_E2E_DB_PORT: ${{ vars.LUCY_E2E_DB_PORT }}
      LUCY_E2E_DB_OWNER_ROLE: ${{ vars.LUCY_E2E_DB_OWNER_ROLE || 'postgres' }}
      # Required automated clients are Claude Code + OpenClaw (real-e2e-clients.yaml v5); Codex / Cursor CLI Agent
      # are not part of the required pair, so the legacy OPENAI_API_KEY / CURSOR_API_KEY wiring is removed.
      ANTHROPIC_API_KEY: ${{ secrets.LUCY_E2E_ANTHROPIC_API_KEY }}
      OPENCLAW_API_KEY: ${{ secrets.LUCY_E2E_OPENCLAW_API_KEY }}
      LUCY_REAL_E2E_CAPABILITIES: ${{ vars.LUCY_E2E_CAPABILITIES }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: webui
      - run: npx playwright install chromium
        working-directory: webui
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: customer-amd64-native-evidence
          path: release/
      - name: Prepare the isolated run (release mode, frozen profile, candidate identity)
        id: ids
        run: |
          set -euo pipefail
          RUN_ID="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          node scripts/e2e/prepare-environment.mjs --run-id "${RUN_ID}" --mode release \
            --candidate release/candidate-identity.json --profile scripts/e2e/profiles/customer-release.yaml \
            --base-url "${LUCY_E2E_BASE_URL}" --mcp-url "${LUCY_E2E_MCP_URL}" \
            --db-host "${LUCY_E2E_DB_HOST}" --db-port "${LUCY_E2E_DB_PORT}" \
            --apply-db --db-owner-role "${LUCY_E2E_DB_OWNER_ROLE:-postgres}"
          mkdir -p "inbox/e2e/${RUN_ID}/results"
          cp release/results/existing-gates.json "inbox/e2e/${RUN_ID}/results/existing-gates.json"
      - name: Seed the disposable PG databases (B3 producer — only marks run.db.applied when every probe passes)
        # The B3 db-seed producer is the sole writer of run.db.applied. If this step fails
        # (exit != 0) the runner treats the run as BLOCKED for the postgres capability; the
        # downstream runners fall back to the unmeasured branch. The password file path is
        # owned by prepare-environment (mode 0600, never printed).
        env:
          LUCY_E2E_DB_HOST: ${{ vars.LUCY_E2E_DB_HOST }}
          LUCY_E2E_DB_PORT: ${{ vars.LUCY_E2E_DB_PORT }}
          LUCY_E2E_DB_OWNER_ROLE: ${{ vars.LUCY_E2E_DB_OWNER_ROLE || 'postgres' }}
        run: |
          set -uo pipefail
          RUN="inbox/e2e/${{ steps.ids.outputs.run_id }}/run.json"
          node scripts/e2e/apply-db.mjs --run "${RUN}" || rc=$?
          rc=${rc:-0}
          node scripts/gates/record-gate-result.mjs --run "${RUN}" --name b3-db-seed --exit-code "${rc}" --image-digest "${DIGEST:-}"
          exit "${rc}"
      - name: Deploy the gated candidate digest into the isolated single-replica namespace
        env:
          DIGEST: ${{ needs.customer-amd64-native.outputs.image_digest }}
          REPOSITORY: ${{ needs.customer-amd64-native.outputs.image_repository }}
        run: |
          set -uo pipefail
          RUN="inbox/e2e/${{ steps.ids.outputs.run_id }}/run.json"
          bash deploy/k8s/security-e2e/deploy-candidate.sh \
            --run "${RUN}" \
            --namespace "${LUCY_E2E_NAMESPACE}" --release lucy-e2e \
            --repository "${REPOSITORY}" --digest "${DIGEST}" --public-mcp-url "${LUCY_E2E_MCP_URL}"
          rc=$?
          # Fresh install of THIS digest on the isolated cluster; the status is the script's exit code only.
          node scripts/gates/record-gate-result.mjs --run "${RUN}" --name k8s-acceptance --exit-code "${rc}" --image-digest "${DIGEST}"
          exit "${rc}"
      - name: Measure the B3 evidence artifacts from the live cluster (results/ops.json, results/context-migration.json, results/projection.json)
        # The B3 producers must run after the candidate digest is the running release (deploy step
        # above) and before the security/management/agent runners can write their own results; the
        # gate collector reads these artifacts and treats absent values as BLOCKED.
        env:
          DIGEST: ${{ needs.customer-amd64-native.outputs.image_digest }}
        run: |
          set -uo pipefail
          RUN="inbox/e2e/${{ steps.ids.outputs.run_id }}/run.json"
          # context-migration.json + projection.json are read from the deployed project's
          # .ktx-ui directory; ops.json needs the live namespace + Helm release to confirm the
          # digest is actually running. The producer records "null" for anything it cannot
          # measure so the gate collector never silently passes a case.
          node scripts/gates/measure-evidence.mjs --run "${RUN}" \
            --namespace "${LUCY_E2E_NAMESPACE}" --release lucy-e2e \
            --what context-migration || true
          node scripts/gates/measure-evidence.mjs --run "${RUN}" \
            --namespace "${LUCY_E2E_NAMESPACE}" --release lucy-e2e \
            --what projection || true
          node scripts/gates/measure-evidence.mjs --run "${RUN}" \
            --namespace "${LUCY_E2E_NAMESPACE}" --release lucy-e2e \
            --what ops || true
      - name: Security-integration, real browser journey, real clients (exit codes are recorded, not parsed)
        # Every runner writes its own schema'd result file; a blocked/failed runner must not stop the others from
        # recording theirs (the verifier, not this step, decides). Their exit codes are kept for the log only.
        # All three runners MUST receive --external: run.json's instance.startedBy is "external" because
        # prepare-environment.mjs was invoked with --base-url, and starting a local Lucy child against
        # a registered external target would silently target the wrong deployment (Spec §6.5, §8.3).
        run: |
          set -uo pipefail
          RUN="inbox/e2e/${{ steps.ids.outputs.run_id }}/run.json"
          node scripts/e2e/run-security.mjs --run "${RUN}" --external; echo "security exit=$?"
          npm run e2e:real:management -- --run "${RUN}" --external; echo "management exit=$?"
          node scripts/e2e/run-agent-journey.mjs --run "${RUN}" --external; echo "agent exit=$?"
          npm --prefix webui audit --omit=dev --json > "inbox/e2e/${{ steps.ids.outputs.run_id }}/results/npm-audit.json" || true
          node scripts/gates/collect-gate-results.mjs --run "${RUN}" --candidate release/candidate-identity.json; echo "gates exit=$?"
      - name: Re-measure B3 evidence after all runners (post-cases, pre-archive; backlog can grow during the cases)
        # The first measure step runs BEFORE the security/management/agent runners; the projection
        # backlog can grow while those runners are in flight. This step re-measures immediately
        # BEFORE the archive step so the collector sees the live post-run state — not a snapshot
        # from before the cases ran. The helper re-measures context-migration, projection and ops
        # and refuses to invent missing values; the gate collector downstream treats absent values
        # as BLOCKED.
        env:
          DIGEST: ${{ needs.customer-amd64-native.outputs.image_digest }}
        run: |
          set -uo pipefail
          RUN="inbox/e2e/${{ steps.ids.outputs.run_id }}/run.json"
          node scripts/gates/measure-evidence.mjs --run "${RUN}" \
            --namespace "${LUCY_E2E_NAMESPACE}" --release lucy-e2e \
            --what context-migration || true
          node scripts/gates/measure-evidence.mjs --run "${RUN}" \
            --namespace "${LUCY_E2E_NAMESPACE}" --release lucy-e2e \
            --what projection || true
          node scripts/gates/measure-evidence.mjs --run "${RUN}" \
            --namespace "${LUCY_E2E_NAMESPACE}" --release lucy-e2e \
            --what ops || true
      - name: Verify, then archive and sign (scan -> hash -> verify -> sign)
        env:
          SIGNING_KEY: ${{ secrets.LUCY_EVIDENCE_SIGNING_KEY }}
          # Step-scoped on purpose: the `runner` context is not available in a job-level
          # `env` block, and a job-level use makes GitHub reject the entire workflow file
          # at load time (all jobs vanish; the run fails in 0s as a "workflow file issue").
          LUCY_EVIDENCE_SIGNING_KEY_FILE: ${{ runner.temp }}/evidence-signing-key.pem
        run: |
          set -euo pipefail
          printf '%s' "${SIGNING_KEY}" > "${LUCY_EVIDENCE_SIGNING_KEY_FILE}"
          chmod 600 "${LUCY_EVIDENCE_SIGNING_KEY_FILE}"
          RUN_DIR="inbox/e2e/${{ steps.ids.outputs.run_id }}"
          node scripts/e2e/archive-evidence.mjs --run "${RUN_DIR}/run.json" --candidate release/candidate-identity.json --out "${RUN_DIR}/archive" || true
          rm -f "${LUCY_EVIDENCE_SIGNING_KEY_FILE}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: real-e2e-evidence
          # run.json holds no secret (paths and public identity only). checker/ (gold, tokens, passwords) is never uploaded.
          path: |
            inbox/e2e/${{ steps.ids.outputs.run_id }}/run.json
            inbox/e2e/${{ steps.ids.outputs.run_id }}/results
            inbox/e2e/${{ steps.ids.outputs.run_id }}/archive
          if-no-files-found: error

  customer-release-readiness:
    # REQUIRED CHECK. The only customer-release aggregate gate. Independently re-verifies the evidence with the one
    # verifier and checks the signed archive; every customer release branch depends on this job.
    runs-on: ubuntu-24.04
    needs:
      - customer-amd64-native
      - real-e2e
      - demo-db-smoke
      - postgres-demo-db-smoke
      - docker-smoke
      - k8s-static
      - k8s-upgrade-gate
      - headless-config
      - business-eval-catalog
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'customer-candidate') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: customer-amd64-native-evidence
          path: release/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: real-e2e-evidence
          path: inbox/e2e/${{ needs.real-e2e.outputs.run_id }}/
      - name: Re-verify the evidence and the signed archive for this exact candidate
        env:
          RUN_ID: ${{ needs.real-e2e.outputs.run_id }}
          LUCY_EVIDENCE_PUBLIC_KEY_FILE: ${{ runner.temp }}/evidence-signing-key.pub
          EVIDENCE_PUBLIC_KEY: ${{ vars.LUCY_EVIDENCE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "${EVIDENCE_PUBLIC_KEY}" > "${LUCY_EVIDENCE_PUBLIC_KEY_FILE}"
          node scripts/e2e/archive-evidence.mjs --verify --out "inbox/e2e/${RUN_ID}/archive"
          npm run gate:customer-release -- --candidate release/candidate-identity.json --run "inbox/e2e/${RUN_ID}/run.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: customer-release-readiness
          path: inbox/e2e/${{ needs.real-e2e.outputs.run_id }}/release-readiness*.json
          if-no-files-found: warn

  release-package:
    # Promotes EXACTLY the tested candidate digest to the customer release tag and attaches the evidence. It never
    # builds: a rebuild after the gates would be an untested image (Spec §8.3). Single-arch linux/amd64.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    needs:
      - customer-amd64-native
      - customer-release-readiness
      - docker-smoke
      - k8s-static
      - k8s-upgrade-gate
      - headless-config
      - demo-db-smoke
      - postgres-demo-db-smoke
      - business-eval-catalog
      - ktx-diff-audit
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'customer-candidate') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history + tags: release-artifacts verifies that the release tag
          # points at the commit being packaged, which is impossible without tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Resolve Lucy product version
        id: lucy-version
        run: |
          set -euo pipefail
          LUCY_VERSION="$(tr -d '[:space:]' < VERSION)"
          npm run lint:version
          echo "version=${LUCY_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Resolve release tag
        id: release
        env:
          LUCY_VERSION: ${{ steps.lucy-version.outputs.version }}
          # The manual input is passed through the environment, never spliced into the shell
          # source (Spec §2.2 F12). A tag is validated by lucy-version-governance below.
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG_INPUT:-}"
          if [ -z "$TAG" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="customer-amd64-${LUCY_VERSION}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
            fi
          fi
          node scripts/release/lucy-version-governance.mjs --release-tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ vars.LUCY_IMAGE_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested digest (no rebuild)
        id: promote
        env:
          CANDIDATE_REF: ${{ needs.customer-amd64-native.outputs.image_ref }}
          CANDIDATE_DIGEST: ${{ needs.customer-amd64-native.outputs.image_digest }}
          REPOSITORY: ${{ needs.customer-amd64-native.outputs.image_repository }}
          LUCY_VERSION: ${{ steps.lucy-version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          IMAGE="${REPOSITORY}:${TAG}"
          # imagetools re-tags the existing manifest in the registry; it creates no builder and builds nothing.
          docker buildx imagetools create --tag "${IMAGE}" "${CANDIDATE_REF}"
          PROMOTED="$(docker buildx imagetools inspect "${IMAGE}" --format '{{.Manifest.Digest}}')"
          if [ "${PROMOTED}" != "${CANDIDATE_DIGEST}" ]; then
            echo "promoted digest ${PROMOTED} differs from the tested candidate ${CANDIDATE_DIGEST}" >&2
            exit 1
          fi
          mkdir -p release
          {
            echo "image=${IMAGE}"
            echo "digest=${PROMOTED}"
            echo "ref=${REPOSITORY}@${PROMOTED}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "image=${IMAGE}"
            echo "manifest_digest=${PROMOTED}"
            echo "lucy_version=${LUCY_VERSION}"
            echo "ktx_version=${KTX_VERSION}"
            echo "platforms=linux/amd64"
            echo "promoted_from=${CANDIDATE_REF}"
          } > release/image-identity.txt
      - name: Re-gate the promoted amd64 digest (G1/G2/G4b/G8)
        env:
          IMAGE_REF: ${{ steps.promote.outputs.ref }}
          KTX_VERSION: ${{ env.KTX_VERSION }}
          LUCY_VERSION: ${{ steps.lucy-version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_REF}" | tee release/imagetools-inspect.txt
          grep -q 'linux/amd64' release/imagetools-inspect.txt
          docker pull --platform linux/amd64 "${IMAGE_REF}"
          META="$(docker image inspect "${IMAGE_REF}" --format '{{.Os}}/{{.Architecture}}')"
          test "${META}" = "linux/amd64"
          bash scripts/release/assert-image-elf-arch.sh "${IMAGE_REF}" amd64
          docker run --rm --network=none --platform linux/amd64 --entrypoint /bin/sh "${IMAGE_REF}" -c \
            "test -x /home/lucy/.ktx/runtime/${KTX_VERSION}/.venv/bin/python"
          docker run --rm --network=none --platform linux/amd64 --entrypoint ktx "${IMAGE_REF}" --version | tee release/ktx-version.txt
          grep -q "${KTX_VERSION}" release/ktx-version.txt
          IMAGE_LUCY_VERSION="$(docker run --rm --network=none --platform linux/amd64 --entrypoint printenv "${IMAGE_REF}" LUCY_VERSION)"
          test "${IMAGE_LUCY_VERSION}" = "${LUCY_VERSION}"
          IMAGE_REVISION="$(docker run --rm --network=none --platform linux/amd64 --entrypoint cat "${IMAGE_REF}" /app/BUILD_REVISION | tr -d '[:space:]')"
          test "${IMAGE_REVISION}" = "${GITHUB_SHA}"
          printf '%s\n' "${IMAGE_LUCY_VERSION}" > release/lucy-version.txt
          bash scripts/gates/g8-image-k8s-contract-gate.sh "${IMAGE_REF}"
          docker image inspect "${IMAGE_REF}" --format '{{.Id}}' > release/image-config-id.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: customer-release-readiness
          path: release/evidence/
      - name: Write release notes
        env:
          LUCY_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          LUCY_DOCKER_IMAGE: ${{ steps.promote.outputs.image }}
          LUCY_IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
          LUCY_PLATFORMS: linux/amd64
        run: npm run release:artifacts -- --tag "$LUCY_RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lucy-release-artifacts
          path: release/
