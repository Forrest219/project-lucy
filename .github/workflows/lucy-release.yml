name: Lucy release gates

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ktx_version:
        description: "Bundled @kaelio/ktx npm version to validate"
        required: false
        default: "0.16.0"
      release_tag:
        description: "Optional Docker/image tag used by release-package"
        required: false

# release-package pushes a multi-arch manifest list to the container registry.
# Other jobs only build & smoke; they do not need write access.
permissions:
  contents: read
  packages: write

env:
  KTX_VERSION: ${{ inputs.ktx_version || '0.16.0' }}
  LUCY_EXPECTED_KTX_VERSION: ${{ inputs.ktx_version || '0.16.0' }}

jobs:
  spec-and-webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:spec
      - run: npm run security:baseline
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run lint:terminology
        working-directory: webui
      - run: npm test
        working-directory: webui
      - run: npm run build
        working-directory: webui

  business-eval-catalog:
    runs-on: ubuntu-latest
    needs: spec-and-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:business-eval

  ktx-diff-audit:
    runs-on: ubuntu-latest
    needs: spec-and-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Checkout upstream KTX
        run: git clone --depth 1 https://github.com/Kaelio/ktx /tmp/ktx-upstream
      - name: Generate diff audit
        run: npm run audit:ktx-diff -- --ktx /tmp/ktx-upstream --out inbox/ktx-lucy-diff-ci.md
      - uses: actions/upload-artifact@v4
        with:
          name: ktx-lucy-diff-audit
          path: inbox/ktx-lucy-diff-ci.md

  docker-smoke:
    runs-on: ubuntu-latest
    needs: spec-and-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: webui
      - run: npm run smoke:p0:docker

  headless-config:
    runs-on: ubuntu-latest
    needs: spec-and-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:headless-config

  demo-e2e:
    runs-on: ubuntu-latest
    needs: docker-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:demo

  postgres-demo-e2e:
    runs-on: ubuntu-latest
    needs: docker-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:p0:postgres-demo

  ktx-upgrade-compat:
    runs-on: ubuntu-latest
    needs:
      - docker-smoke
      - headless-config
      - demo-e2e
      - postgres-demo-e2e
      - business-eval-catalog
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ktx_version != '0.16.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run compat:ktx-upgrade -- --baseline 0.16.0 --candidate "$KTX_VERSION"

  release-package:
    runs-on: ubuntu-latest
    needs:
      - docker-smoke
      - headless-config
      - demo-e2e
      - postgres-demo-e2e
      - business-eval-catalog
      - ktx-diff-audit
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Resolve release tag
        id: release
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME:-manual-${GITHUB_SHA::7}}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      # Multi-arch manifest list. Customer default is x86_64 (AMD); linux/amd64
      # is therefore the primary platform. linux/arm64 is included so that
      # Apple Silicon / AWS Graviton developers can `docker pull` the same tag
      # without rebuilding locally.
      - name: Build & push multi-arch image
        id: build-push
        env:
          REGISTRY: ${{ vars.LUCY_IMAGE_REGISTRY || 'ghcr.io' }}
          IMAGE_NAMESPACE: ${{ vars.LUCY_IMAGE_NAMESPACE || 'kaelio' }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/project-lucy:${TAG}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "KTX_VERSION=${KTX_VERSION}" \
            --tag "${IMAGE}" \
            --tag "${REGISTRY}/${IMAGE_NAMESPACE}/project-lucy:${GITHUB_SHA}" \
            --metadata-file /tmp/buildx-metadata.json \
            --push .
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Write release notes
        env:
          LUCY_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          LUCY_DOCKER_IMAGE: ${{ steps.build-push.outputs.image }}
          LUCY_PLATFORMS: linux/amd64,linux/arm64
        run: npm run release:artifacts -- --tag "${{ steps.release.outputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: lucy-release-artifacts
          path: release/
