connections:
  customer-db:
    driver: mysql
    readonly: true
    enabled_tables:
      - analytics.ceo_metric_snapshot
    host: db.example.internal
    port: 3306
    database: analytics
    username: lucy_readonly
    password: file:/data/lucy/.ktx/secrets/customer-db-password
    schemas:
      - analytics
storage:
  state: sqlite
  search: sqlite-fts5
  git:
    author: lucy <lucy@example.com>
agent:
  run_research:
    enabled: false
    default_toolset:
      - sl_query
      - wiki_search
      - sl_read_source
setup:
  database_connection_ids:
    - customer-db
