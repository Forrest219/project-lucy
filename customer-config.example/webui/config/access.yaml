roles:
  customer_readonly:
    description: Customer headless readonly agent role
    allow:
      connections:
        - customer-db
      tableSelectors:
        - connection: customer-db
          schema: analytics
          names:
            - ceo_metric_snapshot
      tools:
        - lucy_catalog
        - lucy_query
        - lucy_read_source
        - lucy_explain_query
        - lucy_begin_question
        - lucy_continue_question
        - wiki_search
        - wiki_read
        - connection_list

  lucy_admin:
    description: 平台运维数据面（非 WebUI 登录账户）：覆盖全部连接上的已启用表。新连接自动生效。
    permission_model_version: 2
    allow:
      connections:
        - "*"
      source_scope: catalog_bound
      tools:
        - lucy_query
        - lucy_read_source
        - lucy_explain_query
        - lucy_freshness
        - entity_details
        - sl_validate
        - dictionary_search
        - discover_data
        - lucy_catalog
        - kx_catalog
        - connection_list
        - wiki_search
        - wiki_read
        - lucy_begin_question
        - lucy_continue_question
        - lucy_skill_search
        - lucy_skill_read
        - lucy_certified_route
        - lucy_report_template

users:
  - id: customer_agent
    name: Customer Agent
    enabled: true
    note: Example hash only. Generate a real one-time token during deployment.
    tokens:
      - hash: sha256:8ccee2d00afbe164425d51333fe42a3e5a7381955e555a69c185edb8783018f7
        label: example-token-hash
        created: 2026-07-06
    role: customer_readonly

defaults:
  deny_tools:
    - sql_execution
    - sql_dialect_notes
    - memory_ingest
    - memory_ingest_status
  known_tools:
    - lucy_query
    - lucy_read_source
    - lucy_explain_query
    - lucy_catalog
    - lucy_begin_question
    - lucy_continue_question
    - wiki_search
    - wiki_read
    - entity_details
    - dictionary_search
    - discover_data
    - connection_list
    - sql_execution
    - sql_dialect_notes
    - memory_ingest
    - memory_ingest_status
  table_touching_tools:
    - lucy_query
    - lucy_read_source
    - lucy_explain_query
    - entity_details
  sensitive_metadata_tools:
    - dictionary_search
    - discover_data
  sensitive_table_prefixes: []
