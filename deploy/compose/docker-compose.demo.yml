# Shared by lucy and lucy-data-init so `up --build` builds one image.
# The init service overrides entrypoint/user; lucy keeps the image USER (10001).
x-lucy-build: &lucy-build
  context: ../..
  args:
    KTX_VERSION: "${KTX_VERSION:-0.16.0}"
    # Dockerfile pins `--platform=$TARGETPLATFORM` (not BUILDPLATFORM) so image
    # metadata and layer ELFs match. Plain compose does not always inject
    # TARGETPLATFORM — defaults assume Apple Silicon. Prefer
    # `npm run demo:rebuild`, which sets BUILDX_BUILDER=default and host arch.
    # amd64 hosts: TARGETPLATFORM=linux/amd64 TARGETARCH=amd64, or use the script.
    TARGETPLATFORM: "${TARGETPLATFORM:-linux/arm64}"
    TARGETARCH: "${TARGETARCH:-arm64}"
    # Optional PyPI mirror (see Dockerfile ARG block). Empty = official pypi.org.
    UV_INDEX_URL: "${UV_INDEX_URL:-}"
    # Optional Debian apt mirror host (see Dockerfile ARG block). Empty = deb.debian.org.
    APT_MIRROR: "${APT_MIRROR:-}"
    # Optional npm registry host (see Dockerfile ARG block). Empty = registry.npmjs.org.
    NPM_REGISTRY: "${NPM_REGISTRY:-}"
    # Source commit for /app/BUILD_REVISION. upgrade-lucy.sh exports these.
    # Empty leaves the running UI as `unknown` rather than a hand-set version.
    LUCY_GIT_SHA: "${LUCY_GIT_SHA:-}"
    LUCY_GIT_DIRTY: "${LUCY_GIT_DIRTY:-}"

services:
  demo-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: lucy_demo_root
      MYSQL_DATABASE: dataforai
      MYSQL_USER: lucy
      MYSQL_PASSWORD: lucy_demo
    ports:
      - "${LUCY_DEMO_MYSQL_HOST_PORT:-53306}:3306"
    volumes:
      - ../../examples/docker-demo/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ulucy -plucy_demo --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Fresh named volumes plus the read-only evals bind at
  # /data/lucy/config/evals make Docker create /data/lucy/config as root.
  # USER 10001 then cannot mkdir siblings (semantic-layer, wiki, skills).
  # This init mounts only the data volume — not the evals bind — and chowns
  # the directories the app must create. It does not chown recursively.
  lucy-data-init:
    build: *lucy-build
    image: project-lucy:demo
    user: "0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /data/lucy /data/lucy/config /data/lucy/.ktx /data/lucy/.ktx-ui
        chown 10001:10001 /data/lucy /data/lucy/config /data/lucy/.ktx /data/lucy/.ktx-ui
    volumes:
      - lucy-demo-data:/data/lucy
    restart: "no"
    healthcheck:
      disable: true

  lucy:
    build: *lucy-build
    image: project-lucy:demo
    environment:
      KTX_PROJECT_ROOT: /data/lucy
      LUCY_TEMPLATE_ROOT: /app/examples/docker-demo/project-template
      LUCY_WEBUI_HOST: 0.0.0.0
      LUCY_WEBUI_PORT: "5174"
      LUCY_PROXY_HOST: 0.0.0.0
      LUCY_PROXY_PORT: "7879"
      LUCY_PROXY_UPSTREAM_HOST: 127.0.0.1
      LUCY_PROXY_UPSTREAM_PORT: "7878"
      # A2 — Content root (M31 default: <projectRoot>/config/). Unset = config/.
      # Legacy deployments keep content as siblings of ktx.yaml with:
      #   LUCY_CONTENT_ROOT: "."
      # The entrypoint populates <projectRoot>/runtime/ as the ktx sibling view.
      LUCY_CONTENT_ROOT: "${LUCY_CONTENT_ROOT:-/data/lucy/config}"
      # Advertise URL for Agent / WebUI copy. Default matches host publish port
      # below (57881). If you override LUCY_DEMO_PROXY_HOST_PORT, also set
      # LUCY_PUBLIC_MCP_URL to the same host:port (or your reverse-proxy URL).
      LUCY_PUBLIC_MCP_URL: "${LUCY_PUBLIC_MCP_URL:-http://127.0.0.1:57881/mcp}"
      # Customer-equivalent auth. CI and `npm run demo:upgrade` supply the
      # one-time secret; a clean checkout has no gitignored token file.
      LUCY_DEPLOYMENT_MODE: customer
      LUCY_WEBUI_BOOTSTRAP_TOKEN_FILE: /run/secrets/webui_bootstrap_token
      # Local HTTP loopback: the only form allowed to serve non-Secure cookies
      # in customer mode. /api/health reports insecureTestProfile while set.
      LUCY_WEBUI_COOKIE_SECURE: "0"
      LUCY_WEBUI_TEST_PROFILE: "1"
      POSTHOG_DISABLED: "1"
    ports:
      - "${LUCY_DEMO_WEBUI_HOST_PORT:-55176}:5174"
      - "${LUCY_DEMO_PROXY_HOST_PORT:-57881}:7879"
    volumes:
      - lucy-demo-data:/data/lucy
      # POC-only evals aligned with demo DB baseline — not repo-root evals/superstore/.
      # Read-only; demo-data volume still owns runtime state. Under A2 the
      # WebUI reads from <configRoot>/evals, so the bind mount target moved
      # from /data/lucy/evals to /data/lucy/config/evals.
      - ../../examples/docker-demo/project-template/evals:/data/lucy/config/evals:ro
    secrets:
      - webui_bootstrap_token
    depends_on:
      lucy-data-init:
        condition: service_completed_successfully
      demo-db:
        condition: service_healthy

volumes:
  lucy-demo-data:

secrets:
  webui_bootstrap_token:
    file: ${LUCY_DEMO_SECRET_DIR:-./secrets}/webui-bootstrap-token
