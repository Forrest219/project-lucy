# Shared by lucy and lucy-data-init so `up --build` builds one image.
# The init service overrides entrypoint/user; lucy keeps the image USER (10001).
x-lucy-build: &lucy-build
  context: ../..
  args:
    KTX_VERSION: "${KTX_VERSION:-0.16.0}"
    # Same TARGETPLATFORM contract as deploy/compose/docker-compose.demo.yml. Prefer
    # BUILDX_BUILDER=default when rebuilding so customer `lucy-amd64` cannot
    # hijack this path. See docs/specs/lucy-202608-05-demo-builder-arm-default-spec.md
    # and docs/specs/lucy-202608-08-image-arch-and-ktx-baseline-fix.md.
    TARGETPLATFORM: "${TARGETPLATFORM:-linux/arm64}"
    TARGETARCH: "${TARGETARCH:-arm64}"

services:
  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dataforai
      POSTGRES_USER: lucy
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "${LUCY_DEMO_POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ../../examples/postgres-demo/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucy -d dataforai"]
      interval: 5s
      timeout: 5s
      retries: 30
    secrets:
      - postgres_password

  # Fresh named volumes plus the read-only evals bind at
  # /data/lucy/config/evals make Docker create /data/lucy/config as root.
  # USER 10001 then cannot mkdir siblings (semantic-layer, wiki, skills).
  # This init mounts only the data volume — not the evals bind — and chowns
  # the directories the app must create. It does not chown recursively.
  lucy-data-init:
    build: *lucy-build
    image: project-lucy:postgres-demo
    user: "0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /data/lucy /data/lucy/config /data/lucy/.ktx /data/lucy/.ktx-ui
        chown 10001:10001 /data/lucy /data/lucy/config /data/lucy/.ktx /data/lucy/.ktx-ui
    volumes:
      - lucy-postgres-demo-data:/data/lucy
    restart: "no"
    healthcheck:
      disable: true

  lucy:
    build: *lucy-build
    image: project-lucy:postgres-demo
    environment:
      KTX_PROJECT_ROOT: /data/lucy
      LUCY_TEMPLATE_ROOT: /app/examples/postgres-demo/project-template
      LUCY_WEBUI_HOST: 0.0.0.0
      LUCY_WEBUI_PORT: "5174"
      LUCY_PROXY_HOST: 0.0.0.0
      LUCY_PROXY_PORT: "7879"
      LUCY_PROXY_UPSTREAM_HOST: 127.0.0.1
      LUCY_PROXY_UPSTREAM_PORT: "7878"
      # A2 — Content root. Default = <projectRoot>/config/. Unset to fall back
      # to siblings-of-ktx.yaml (legacy). Entrypoint populates runtime/.
      LUCY_CONTENT_ROOT: "${LUCY_CONTENT_ROOT:-/data/lucy/config}"
      # V-01: customer-equivalent auth for real acceptance. First owner is created
      # with the one-time secret generated by `npm run demo:upgrade -- --fresh`
      # (deploy/compose/secrets/webui-bootstrap-token, git-ignored).
      LUCY_DEPLOYMENT_MODE: customer
      LUCY_WEBUI_BOOTSTRAP_TOKEN_FILE: /run/secrets/webui_bootstrap_token
      # Local HTTP loopback demo: the only form allowed to serve non-Secure cookies in customer mode
      # (Spec §3.1 item 8). /api/health reports insecureTestProfile while this is set.
      LUCY_WEBUI_COOKIE_SECURE: "0"
      LUCY_WEBUI_TEST_PROFILE: "1"
      POSTHOG_DISABLED: "1"
    ports:
      - "${LUCY_POSTGRES_DEMO_WEBUI_HOST_PORT:-55177}:5174"
      - "${LUCY_POSTGRES_DEMO_PROXY_HOST_PORT:-57882}:7879"
    volumes:
      - lucy-postgres-demo-data:/data/lucy
      # POC-only evals aligned with demo DB baseline — not repo-root evals/superstore/.
      # Read-only; demo-data volume still owns runtime state. Under A2 the
      # WebUI reads from <configRoot>/evals, so the bind mount target moved
      # from /data/lucy/evals to /data/lucy/config/evals.
      - ../../examples/postgres-demo/project-template/evals:/data/lucy/config/evals:ro
    secrets:
      - postgres_password
      - webui_bootstrap_token
    depends_on:
      lucy-data-init:
        condition: service_completed_successfully
      postgres-db:
        condition: service_healthy

volumes:
  lucy-postgres-demo-data:

secrets:
  postgres_password:
    file: ${LUCY_POSTGRES_DEMO_SECRET_DIR:-../../secrets}/postgres-password
  webui_bootstrap_token:
    file: ./secrets/webui-bootstrap-token
