apiVersion: v2
name: lucy
description: |
  Lucy single-replica Kubernetes / Helm package.

  This chart installs the Lucy data agent context compiler and governed MCP
  runtime in a single-replica Kubernetes environment. It is not an HA chart:
  Deployment strategy is Recreate so that a single RWO PVC can be safely
  remounted across upgrades.

  The chart mirrors the bundled Docker Compose contract:
    * `KTX_PROJECT_ROOT=/data/lucy`
    * WebUI/API on container port 5174
    * Lucy MCP Proxy on container port 7879 (external agent entry)
    * KTX MCP upstream on container port 7878 (NOT exposed via Service)

  Bundled runtime: `@kaelio/ktx@0.16.0` (pinned in Dockerfile / values).
  Product version (`appVersion`) is Lucy-facing and independent of KTX.
type: application
version: 0.2.2
appVersion: "0.17.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/kaelio/lucy
sources:
  - https://github.com/kaelio/lucy
  - https://github.com/kaelio/ktx
keywords:
  - lucy
  - ktx
  - semantic-layer
  - mcp-proxy
  - data-agent
maintainers:
  - name: Lucy Delivery Engineering
    email: lucy-delivery@kaelio.example
icon: https://raw.githubusercontent.com/kaelio/lucy/main/docs/assets/lucy-icon.png
annotations:
  category: DataAgent
  licenses: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: Decouple Lucy product version (appVersion 0.17.0) from bundled KTX 0.16.0; inject LUCY_VERSION.
    - kind: changed
      description: Run as UID 10001; workingDir /data/lucy; optional project-migrate init for PVC ownership.
    - kind: changed
      description: Startup/readiness probes use HTTP GET /api/health instead of exec docker-healthcheck.sh.
    - kind: added
      description: containerPorts split from service ports; optional image.digest pinning.
    - kind: added
      description: UPGRADE.md, ROLLBACK.md, and supported-chart delivery contract.
    - kind: removed
      description: Deprecated exec probe pattern and runtime-preflight init container references.
