# Default values for the Lucy Helm chart.
#
# This chart is the Kubernetes counterpart of `docker-compose.yml` + `docker-compose.customer-config.yml`.
# It is single-replica only and uses Deployment strategy Recreate so that the
# RWO PVC mounted at /data/lucy is never shared between two pods.
#
# IMPORTANT — secrets / customer DB credentials:
#   * NEVER commit real passwords, tokens, customer DB DSNs or one-time
#     `LUCY_*` tokens into this file or the rendered ConfigMap.
#   * Customers must create their own Secret (e.g. via sealed-secrets / external
#     secrets / Vault) and reference it via `existingSecret` below.
#   * The chart ships `templates/secret.example.yaml` as a Helm-commented
#     reference only; it does NOT render by default.

# -------------------------------------------------------------------
# Image
# -------------------------------------------------------------------
# IMPORTANT — image.repository / image.tag MUST be overridden before any
# non-local install. The default value `project-lucy` is only valid for
# `kind` / `docker compose` local development where the image is loaded
# from the local Docker cache. On a real customer K8s cluster the literal
# default will fail to pull because there is no public `project-lucy:0.17.0`
# on Docker Hub.
#
# Default platforms shipped from CI:
#   linux/amd64  (primary; x86_64 customer hardware)
#   linux/arm64  (secondary; Apple Silicon / AWS Graviton developers)
#
# Before installing on a customer cluster, set:
#   image:
#     repository: REPLACE-ME-registry.example.com/data-team/project-lucy
#     tag: <registry tag that contains linux/amd64>
#     pullPolicy: IfNotPresent   (or Always for short-lived tags)
#
# If you forget to override the repository and the value still starts with
# the placeholder prefix `REPLACE-ME-`, the chart will refuse to render.
image:
  # DEFAULT: bare tag — only valid for kind / docker compose local dev.
  # Production must override to a customer registry path.
  repository: project-lucy
  # Lucy product version (see repo-root VERSION). Override with immutable
  # customer tag e.g. customer-amd64-0.17.0-YYYYMMDD-<sha>.
  tag: "0.17.0"
  # Optional immutable digest (sha256:…). When set, the chart pins the image
  # by digest and ignores tag for the rendered image reference.
  digest: ""
  pullPolicy: IfNotPresent

# -------------------------------------------------------------------
# Replicas — explicitly single-replica only. No HA yet.
# -------------------------------------------------------------------
replicaCount: 1

# -------------------------------------------------------------------
# Image pull secrets for private registries
# -------------------------------------------------------------------
imagePullSecrets: []

# -------------------------------------------------------------------
# Service + container ports
# -------------------------------------------------------------------
# Container ports (what Lucy listens on inside the pod) and Service ports
# (what clients reach via ClusterIP / NodePort / LoadBalancer) are separate.
# Do NOT remap container ports to match external Service ports — keep WebUI on
# 5174 and MCP Proxy on 7879 inside the pod; map 8276/8277 (or any customer
# choice) at the Service layer only.
#
# Port 7878 (KTX upstream) MUST stay inside the pod only.
containerPorts:
  webui: 5174
  mcp: 7879

service:
  type: ClusterIP
  webuiPort: 5174
  mcpPort: 7879

# -------------------------------------------------------------------
# Ingress — opt-in. Customers should still set `env.LUCY_PUBLIC_MCP_URL`
# to the externally reachable URL behind the ingress.
# -------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  # List one or more host entries; each entry may have its own TLS block.
  hosts:
    - host: lucy.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -------------------------------------------------------------------
# Persistence
#
# /data/lucy holds ktx.yaml, semantic-layer/, wiki/, evals/, skills/,
# webui/config/access.yaml, .ktx/, .ktx-ui/. This MUST be backed by a
# PVC; without it the pod will re-seed a CHANGE-ME ktx.yaml on every
# restart.
# -------------------------------------------------------------------
persistence:
  enabled: true
  # RWO is sufficient for the single-replica deployment.
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClass: ""
  # When `existingClaim` is set, the chart does NOT create a PVC and
  # expects the cluster operator to provision it.
  existingClaim: ""

# -------------------------------------------------------------------
# Env / runtime configuration
# -------------------------------------------------------------------
env:
  # REQUIRED for any non-local deployment: the externally reachable MCP URL
  # that agent platforms actually call. The chart does NOT default this to
  # the in-cluster service URL — using 127.0.0.1 / cluster-local URLs would
  # mislead external agents.
  #
  # When image.repository is NOT the local-dev value `project-lucy`, the chart
  # fails to render if this is empty, still contains REPLACE-ME, or points at
  # 127.0.0.1/localhost (see templates/deployment.yaml). Set the Ingress /
  # gateway URL agents will call, e.g. https://lucy.example.com/mcp.
  LUCY_PUBLIC_MCP_URL: ""

  # Demo / template-only switches. Production must keep these empty / 0.
  LUCY_ALLOW_PLACEHOLDER_KTX: ""

  # Compose contract — pinned by Dockerfile. Kept here for documentation;
  # the template also pins them as hardcoded env entries.
  KTX_PROJECT_ROOT: /data/lucy
  POSTHOG_DISABLED: "1"

# -------------------------------------------------------------------
# Secret wiring
# -------------------------------------------------------------------
# Either reference an externally-managed Secret (recommended) via
# `existingSecret`, or let the chart render a Secret from `extraSecretData`
# (intended ONLY for local-test / demo, NEVER for production). Values in
# `extraSecretData` are plain strings; the chart base64-encodes them into
# Secret.data.
#
# Secret keys mounted into /data/lucy/.ktx/secrets/<key>:
#   * `mysql-password` / `postgres-password` etc. — referenced from
#     customer ktx.yaml as `password: file:/data/lucy/.ktx/secrets/<key>`
# All keys from the Secret are mounted as files under /data/lucy/.ktx/secrets/.
existingSecret: ""
extraSecretData: {}

# Extra env sources — for example, projecting keys from existingSecret as
# env vars (NOT as files). Use sparingly; most customer secrets should
# land as files in /data/lucy/.ktx/secrets/.
extraEnvFrom: []

# -------------------------------------------------------------------
# Probes — lightweight HTTP only. StarRocks connectivity, reindex, and MCP
# tools/list belong in post-deploy acceptance, not liveness/startup probes.
# -------------------------------------------------------------------
startupProbe:
  httpGet:
    path: /api/health
    port: webui
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60   # ~5 minutes total
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /api/health
    port: webui
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1

livenessProbe:
  httpGet:
    path: /api/health
    port: webui
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# -------------------------------------------------------------------
# Resources — conservative defaults; customers MUST tune.
# -------------------------------------------------------------------
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# -------------------------------------------------------------------
# Scheduling
# -------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# -------------------------------------------------------------------
# Security context — UID 10001 matches legacy K8s PVC ownership (.git).
# -------------------------------------------------------------------
podSecurityContext:
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

# -------------------------------------------------------------------
# Annotations / labels
# -------------------------------------------------------------------
podAnnotations: {}
podLabels: {}

# -------------------------------------------------------------------
# ServiceAccount
# -------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -------------------------------------------------------------------
# Optional: lucy-specific toggles (documented for future expansion)
# -------------------------------------------------------------------
lucy:
  # When false, the chart will not include the KTX_PROJECT_ROOT / WebUI /
  # Proxy env block (used by templates to keep parity with Compose).
  enabled: true
  # Customer-facing Lucy product version — must match Chart.appVersion / VERSION.
  version: "0.17.0"
  # Bundled KTX version baked into the image — must match the Dockerfile ARG.
  # Independent of lucy.version; only change when upgrading @kaelio/ktx.
  bundledKtxVersion: "0.16.0"
  # One-shot PVC ownership migration for upgrades from root (runAsUser 0) builds.
  # Git init is owned by the container entrypoint — init only chowns.
  projectMigrate:
    enabled: true
