# Default values for the Lucy Helm chart.
#
# This chart is the Kubernetes counterpart of `docker-compose.yml` + `deploy/compose/docker-compose.customer-config.yml`.
# It is single-replica only and uses Deployment strategy Recreate so that the
# RWO PVC mounted at /data/lucy is never shared between two pods.
#
# IMPORTANT — secrets / customer DB credentials:
#   * NEVER commit real passwords, tokens, customer DB DSNs or one-time
#     `LUCY_*` tokens into this file or the rendered ConfigMap.
#   * Customers must create their own Secret (e.g. via sealed-secrets / external
#     secrets / Vault) and reference it via `existingSecret` below.
#   * The chart ships `templates/secret.example.yaml` as a Helm-commented
#     reference only; it does NOT render by default.

# -------------------------------------------------------------------
# Resource naming
# -------------------------------------------------------------------
# By default Deployment / Service / ServiceAccount are named after the Helm
# release (`<release>-lucy`, or just `<release>` when it already contains
# "lucy"). When upgrading an environment whose resources were created under a
# different name (e.g. release `lucy-starrocks` but Deployment/Service `lucy`),
# pin the name here so Helm adopts the existing objects instead of creating a
# second set. NOTE: the Deployment selector is immutable — see UPGRADE.md.
nameOverride: ""
fullnameOverride: ""

# -------------------------------------------------------------------
# Image
# -------------------------------------------------------------------
# IMPORTANT — image.repository / image.tag MUST be overridden before any
# non-local install. The default value `project-lucy` is only valid for
# `kind` / `docker compose` local development where the image is loaded
# from the local Docker cache. On a real customer K8s cluster the literal
# default will fail to pull because there is no public `project-lucy:2.0.0`
# on Docker Hub.
#
# Default platforms shipped from CI:
#   linux/amd64  (primary; x86_64 customer hardware)
#   linux/arm64  (secondary; Apple Silicon / AWS Graviton developers)
#
# Before installing on a customer cluster, set:
#   image:
#     repository: REPLACE-ME-registry.example.com/data-team/project-lucy
#     tag: <registry tag that contains linux/amd64>
#     pullPolicy: IfNotPresent   (or Always for short-lived tags)
#
# If you forget to override the repository and the value still starts with
# the placeholder prefix `REPLACE-ME-`, the chart will refuse to render.
image:
  # DEFAULT: bare tag — only valid for kind / docker compose local dev.
  # Production must override to a customer registry path.
  repository: project-lucy
  # Lucy product version (see repo-root VERSION). Override with immutable
  # customer tag e.g. customer-amd64-2.0.0-YYYYMMDD-<sha>.
  tag: "2.0.0"
  # Optional immutable digest (sha256:…). When set, the chart pins the image
  # by digest and ignores tag for the rendered image reference.
  digest: ""
  pullPolicy: IfNotPresent

# -------------------------------------------------------------------
# Replicas — explicitly single-replica only. No HA yet.
# -------------------------------------------------------------------
replicaCount: 1

# -------------------------------------------------------------------
# Image pull secrets for private registries
# -------------------------------------------------------------------
imagePullSecrets: []

# -------------------------------------------------------------------
# Service + container ports
# -------------------------------------------------------------------
# Container ports (what Lucy listens on inside the pod) and Service ports
# (what clients reach via ClusterIP / NodePort / LoadBalancer) are separate.
# Do NOT remap container ports to match external Service ports — keep WebUI on
# 5174 and MCP Proxy on 7879 inside the pod; map 8276/8277 (or any customer
# choice) at the Service layer only.
#
# Port 7878 (KTX upstream) MUST stay inside the pod only.
containerPorts:
  webui: 5174
  mcp: 7879

service:
  type: ClusterIP
  webuiPort: 5174
  mcpPort: 7879

# -------------------------------------------------------------------
# Ingress — opt-in. Customers should still set `env.LUCY_PUBLIC_MCP_URL`
# to the externally reachable URL behind the ingress.
# -------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  # List one or more host entries; each entry may have its own TLS block.
  hosts:
    - host: lucy.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -------------------------------------------------------------------
# Persistence
#
# /data/lucy holds ktx.yaml, semantic-layer/, wiki/, evals/, skills/,
# webui/config/access.yaml, .ktx/, .ktx-ui/. This MUST be backed by a
# PVC; without it the pod will re-seed a CHANGE-ME ktx.yaml on every
# restart.
# -------------------------------------------------------------------
persistence:
  enabled: true
  # RWO is sufficient for the single-replica deployment.
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClass: ""
  # When `existingClaim` is set, the chart does NOT create a PVC and
  # expects the cluster operator to provision it.
  existingClaim: ""

# -------------------------------------------------------------------
# Env / runtime configuration
# -------------------------------------------------------------------
env:
  # REQUIRED for any non-local deployment: the externally reachable MCP URL
  # that agent platforms actually call. The chart does NOT default this to
  # the in-cluster service URL — using 127.0.0.1 / cluster-local URLs would
  # mislead external agents.
  #
  # When image.repository is NOT the local-dev value `project-lucy`, the chart
  # fails to render if this is empty, still contains REPLACE-ME, or points at
  # 127.0.0.1/localhost (see templates/deployment.yaml). Set the Ingress /
  # gateway URL agents will call, e.g. https://lucy.example.com/mcp.
  LUCY_PUBLIC_MCP_URL: ""

  # Where semantic-layer/, wiki/, evals/, skills/ live, relative to
  # KTX_PROJECT_ROOT (or absolute). Empty = image default `config/` (M31 layout).
  # In-place upgrades from a PVC that keeps these directories next to ktx.yaml
  # (pre-M31 layout) MUST set "." — otherwise the WebUI shows an empty catalog.
  LUCY_CONTENT_ROOT: ""

  # Demo / template-only switches. Production must keep these empty / 0.
  LUCY_ALLOW_PLACEHOLDER_KTX: ""

  # Compose contract — pinned by Dockerfile. Kept here for documentation;
  # the template also pins them as hardcoded env entries.
  KTX_PROJECT_ROOT: /data/lucy
  POSTHOG_DISABLED: "1"

# -------------------------------------------------------------------
# Secret wiring
# -------------------------------------------------------------------
# Either reference an externally-managed Secret (recommended) via
# `existingSecret`, or let the chart render a Secret from `extraSecretData`
# (intended ONLY for local-test / demo, NEVER for production). Values in
# `extraSecretData` are plain strings; the chart base64-encodes them into
# Secret.data.
#
# Secret keys are COPIED (not mounted) into /data/lucy/.ktx/secrets/<key> by the
# `secrets-sync` init container on every pod start:
#   * `mysql-password` / `postgres-password` etc. — referenced from
#     customer ktx.yaml as `password: file:/data/lucy/.ktx/secrets/<key>`
#   * target dir 0700, files 0600, owner 10001:10001
#   * keys in the Secret overwrite same-named files (password rotation works;
#     restart the pod / `helm upgrade` to apply)
#   * files that exist on the PVC but not in the Secret (created via the WebUI)
#     are kept — they are never pruned
# A Kubernetes Secret volume is always read-only, so it can never be mounted
# directly over the directory the WebUI writes new password files into.
existingSecret: ""
extraSecretData: {}

# First-owner bootstrap secret (V-01). The chart pins LUCY_DEPLOYMENT_MODE=customer,
# so creating the first WebUI owner requires a one-time secret. Reference an
# externally-managed Secret holding key `token`; it is mounted read-only at
# /run/secrets/lucy-bootstrap and exposed via LUCY_WEBUI_BOOTSTRAP_TOKEN_FILE.
# Empty (default): the Pod still starts, but POST /api/auth/bootstrap returns
# 503 BOOTSTRAP_NOT_PROVISIONED. NEVER put the secret value in this file.
bootstrap:
  existingSecret: ""

# E2E disposable DB password secret (B3). The harness prepares a per-run reader
# password file (mode 0600) and creates a Secret whose key is `password`; the
# chart mounts it read-only at /var/run/secrets/lucy-db so the rendered
# ktx.yaml's `password: file:/var/run/secrets/lucy-db/password` resolves to the
# in-container file. Empty (default): no DB Secret is mounted and the runner
# records `db.applied = false`. NEVER put the password value in this file.
db:
  existingSecret: ""
  mountPath: "/var/run/secrets/lucy-db"

# WebUI session cookie (Spec §3.1 item 8). The chart pins LUCY_DEPLOYMENT_MODE=customer.
# `access: https` (default) sends Secure cookies. `access: http` is the explicit
# intranet HTTP customer mode: cookies are not Secure, and this is not the lab
# test profile. `insecureHttpTestProfile: true` remains only for kind / k3s test
# profiles; /api/health then reports `insecureTestProfile: true`. Do not combine
# it with `access: http`.
security:
  access: https
  insecureHttpTestProfile: false

# -------------------------------------------------------------------
# Reserved for v2.5 enterprise OIDC. v2.0 does not inject this block into
# the pod and does not contact the issuer. Fill it only as a record of the
# future client registration. Keep the client secret in a Kubernetes Secret,
# never in this file.
#
# Example for an intranet authorization-code client (not applied):
#   issuer: https://oidc.ksyun.com
#   public WebUI origin: https://lucy.example.com
#   scopes: openid profile email offline_access feishu_login
#   tokenEndpointAuth: client_secret_post   # or client_secret_basic
#   logoutStyle: id_token_hint               # or access_token
# A private-network issuer may be http:// only when written here explicitly.
# -------------------------------------------------------------------
webui:
  # HTTPS origin that will be registered as the OIDC redirect_uri origin.
  publicUrl: ""

oidc:
  issuer: ""
  discoveryUrl: ""
  authorizationEndpoint: ""
  tokenEndpoint: ""
  jwksUri: ""
  endSessionEndpoint: ""
  clientId: ""
  scopes: "openid profile email offline_access"
  tokenEndpointAuth: client_secret_post
  logoutStyle: id_token_hint
  redirectPath: /api/auth/oidc/callback

# Extra env sources — for example, projecting keys from existingSecret as
# env vars (NOT as files). Use sparingly; most customer secrets should
# land as files in /data/lucy/.ktx/secrets/.
extraEnvFrom: []

# -------------------------------------------------------------------
# Probes — lightweight HTTP only. StarRocks connectivity, reindex, and MCP
# tools/list belong in post-deploy acceptance, not liveness/startup probes.
# -------------------------------------------------------------------
startupProbe:
  httpGet:
    path: /api/health
    port: webui
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60   # ~5 minutes total
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /api/health
    port: webui
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
  successThreshold: 1

livenessProbe:
  httpGet:
    path: /api/health
    port: webui
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# -------------------------------------------------------------------
# Resources — conservative defaults; customers MUST tune.
# -------------------------------------------------------------------
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# -------------------------------------------------------------------
# Scheduling
# -------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# -------------------------------------------------------------------
# Security context — UID 10001 matches legacy K8s PVC ownership (.git).
# -------------------------------------------------------------------
podSecurityContext:
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

# -------------------------------------------------------------------
# Annotations / labels
# -------------------------------------------------------------------
podAnnotations: {}
podLabels: {}

# -------------------------------------------------------------------
# ServiceAccount
# -------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -------------------------------------------------------------------
# Optional: lucy-specific toggles (documented for future expansion)
# -------------------------------------------------------------------
lucy:
  # When false, the chart will not include the KTX_PROJECT_ROOT / WebUI /
  # Proxy env block (used by templates to keep parity with Compose).
  enabled: true
  # Customer-facing Lucy product version — must match Chart.appVersion / VERSION.
  version: "2.0.0"
  # Bundled KTX version baked into the image — must match the Dockerfile ARG.
  # Independent of lucy.version; only change when upgrading @kaelio/ktx.
  bundledKtxVersion: "0.16.0"
  # One-shot PVC ownership migration for upgrades from root (runAsUser 0) builds.
  # Git init is owned by the container entrypoint — init only chowns.
  projectMigrate:
    enabled: true
