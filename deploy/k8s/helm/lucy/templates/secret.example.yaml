{{- /*
secret.example.yaml — non-rendered example.

This file is intentionally wrapped in Helm comments so it is NOT rendered.
Customers should not edit this chart template with real secrets; create an
external Secret, SealedSecret, ExternalSecret, or CSI-backed secret instead
and reference it through `existingSecret`.

DO NOT commit real passwords / tokens / customer DB credentials to this
file. The example below only demonstrates the file shape.
*/}}
{{- /*
apiVersion: v1
kind: Secret
metadata:
  name: REPLACE-ME-lucy-secrets
  labels:
    app.kubernetes.io/name: lucy
    app.kubernetes.io/part-of: lucy
  annotations:
    lucy.kaelio.io/policy: "managed-by-customer-secret-store"
type: Opaque
data:
  # Base64-encoded value. Generate with:
  #   printf '%s' 'YOUR_PASSWORD' | base64
  # Reference in customer ktx.yaml via:
  #   password: file:/data/lucy/.ktx/secrets/mysql-password
  mysql-password: UkVQTEFDRS1NRQo=

  # Every key becomes /data/lucy/.ktx/secrets/<key> on the PVC via the
  # `secrets-sync` init container. Do not put access.yaml here: the entrypoint
  # expects /data/lucy/webui/config/access.yaml, not a secrets subdirectory.
*/ -}}
