{{- /*
Local-test / demo Secret.

Renders ONLY when `existingSecret` is empty. Production deployments should
set `existingSecret` to a Secret managed by sealed-secrets / external-secrets /
Vault / CSI driver and leave this empty so the chart does not create or
overwrite any Secret.

The Secret stores:
  * Files mounted to /data/lucy/.ktx/secrets/<key> — referenced by ktx.yaml
    via `password: file:/data/lucy/.ktx/secrets/<key>`.
  * Optional lucy access.yaml mounted to
    /data/lucy/webui/config/access.yaml (when `access-yaml` is provided).

`extraSecretData` is a map of filename -> opaque value. The chart does not
provide default values to keep customers from accidentally committing a
real password.
*/}}
{{- if not .Values.existingSecret -}}
{{- if .Values.extraSecretData -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lucy.fullname" . }}-secrets
  labels:
    {{- include "lucy.labels" . | nindent 4 }}
  annotations:
    # Encourage operators to migrate this chart-managed Secret to an external
    # store before going to production.
    "lucy.kaelio.io/managed-by": "helm-chart"
    "lucy.kaelio.io/policy": "local-test-or-demo-only"
type: Opaque
data:
  {{- range $key, $value := .Values.extraSecretData }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end -}}
{{- end -}}
