apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lucy.fullname" . }}
  labels:
    {{- include "lucy.labels" . | nindent 4 }}
spec:
  {{- if ne (int .Values.replicaCount) 1 }}
  {{- fail "Lucy Helm chart currently supports replicaCount=1 only because /data/lucy is backed by a single RWO PVC" }}
  {{- end }}
  {{- if not .Values.persistence.enabled }}
  {{- fail "Lucy Helm chart requires persistence.enabled=true so /data/lucy is backed by a PVC" }}
  {{- end }}
  {{- if hasPrefix "REPLACE-ME" .Values.image.repository }}
  {{- fail (printf "Lucy Helm chart requires image.repository to point at your customer registry (e.g. registry.example.com/data-team/project-lucy). The placeholder %q must be replaced before installing on any cluster." .Values.image.repository) }}
  {{- end }}
  {{- /* Non-local installs (customer registry) must advertise a real MCP URL.
       Local kind/demo keeps image.repository=project-lucy and may omit it. */}}
  {{- if ne .Values.image.repository "project-lucy" }}
  {{- $mcpUrl := .Values.env.LUCY_PUBLIC_MCP_URL | default "" | toString | trim }}
  {{- if eq $mcpUrl "" }}
  {{- fail "Lucy Helm chart requires env.LUCY_PUBLIC_MCP_URL to be an externally reachable http(s) URL (e.g. https://lucy.example.com/mcp) when image.repository is a customer registry." }}
  {{- end }}
  {{- if contains "REPLACE-ME" $mcpUrl }}
  {{- fail "Lucy Helm chart rejects REPLACE-ME placeholders in env.LUCY_PUBLIC_MCP_URL." }}
  {{- end }}
  {{- if and (not (hasPrefix "http://" $mcpUrl)) (not (hasPrefix "https://" $mcpUrl)) }}
  {{- fail (printf "Lucy Helm chart requires env.LUCY_PUBLIC_MCP_URL to be http(s); got %q" $mcpUrl) }}
  {{- end }}
  {{- if or (contains "://127.0.0.1" $mcpUrl) (contains "://localhost" $mcpUrl) (contains "://[::1]" $mcpUrl) (contains "://0.0.0.0" $mcpUrl) }}
  {{- fail (printf "Lucy Helm chart rejects loopback/unspecified MCP URLs (got %q); use an externally reachable hostname." $mcpUrl) }}
  {{- end }}
  {{- end }}
  # Single-replica only. HA is intentionally not supported yet.
  replicas: {{ .Values.replicaCount }}
  # Recreate is REQUIRED while we mount an RWO PVC at /data/lucy.
  # Any other strategy (e.g. RollingUpdate) would attempt to spin up a second
  # pod before tearing down the first, and the second pod would fail to bind
  # the volume — or worse, two pods could briefly see divergent views.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lucy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lucy.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "lucy.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.lucy.projectMigrate.enabled (include "lucy.hasSecret" .) }}
      initContainers:
        {{- if .Values.lucy.projectMigrate.enabled }}
        # Hand legacy PVC content (root or older image UID) to the runtime user.
        # chown only: `git init` is owned by the container entrypoint.
        - name: project-migrate
          image: "{{ include "lucy.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              mkdir -p /data/lucy /data/lucy/.ktx /data/lucy/.ktx-ui
              # Only touch entries that are not already owned by 10001:10001,
              # so restarts on a healthy PVC do not rewrite the whole tree.
              find /data/lucy \( ! -user 10001 -o ! -group 10001 \) \
                -exec chown -h 10001:10001 {} +
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          volumeMounts:
            - name: data
              mountPath: /data/lucy
        {{- end }}
        {{- if include "lucy.hasSecret" . }}
        # Kubernetes Secret volumes are always read-only, so they cannot be
        # mounted over /data/lucy/.ktx/secrets: the WebUI must be able to write
        # new password files there. Copy the Secret keys into the PVC instead.
        #
        # Sync policy (documented in UPGRADE.md):
        #   * keys present in the Secret are copied/overwritten (rotation works)
        #   * files already on the PVC but absent from the Secret are KEPT,
        #     because they were created through the WebUI and the Secret is not
        #     their source of truth
        - name: secrets-sync
          image: "{{ include "lucy.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              umask 077
              src=/mnt/lucy-secrets
              dst=/data/lucy/.ktx/secrets
              mkdir -p "$dst"
              synced=0
              for f in "$src"/*; do
                # Secret keys are symlinks into ..data/; -f follows them.
                [ -f "$f" ] || continue
                name="${f##*/}"
                tmp="$dst/.${name}.sync-$$"
                cp "$f" "$tmp"
                chown 10001:10001 "$tmp"
                chmod 0600 "$tmp"
                mv -f "$tmp" "$dst/$name"
                synced=$((synced + 1))
              done
              chown 10001:10001 /data/lucy/.ktx "$dst"
              chmod 0700 "$dst"
              find "$dst" -type d -exec chmod 0700 {} +
              find "$dst" -type f -exec chmod 0600 {} +
              find "$dst" \( ! -user 10001 -o ! -group 10001 \) \
                -exec chown -h 10001:10001 {} +
              echo "secrets-sync: synced ${synced} file(s) into ${dst}; files absent from the Secret are kept"
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          volumeMounts:
            - name: data
              mountPath: /data/lucy
            - name: secrets
              mountPath: /mnt/lucy-secrets
              readOnly: true
        {{- end }}
      {{- end }}
      containers:
        - name: lucy
          workingDir: /data/lucy
          image: "{{ include "lucy.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Named ports so Service / probes stay aligned even if values change.
          ports:
            - name: webui
              containerPort: {{ .Values.containerPorts.webui }}
              protocol: TCP
            - name: mcp
              containerPort: {{ .Values.containerPorts.mcp }}
              protocol: TCP
          env:
            {{- include "lucy.composeEnv" . | nindent 12 }}
          {{- if .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml .Values.extraEnvFrom | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data/lucy
            {{- end }}
            {{- /* Secret is intentionally NOT mounted here: see secrets-sync init. */}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "lucy.pvcName" . }}
        {{- end }}
        {{- if or .Values.existingSecret .Values.extraSecretData }}
        - name: secrets
          secret:
            secretName: {{ include "lucy.secretName" . }}
            defaultMode: 0400
        {{- end }}
