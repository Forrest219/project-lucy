# values.gate-fresh.yaml — kind / gate fresh-install profile.
#
# Used by scripts/k8s-release-gate.sh for H2 render validation.
# For live cluster install, copy and customize before helm upgrade --install.

image:
  repository: project-lucy
  tag: "0.17.0"
  pullPolicy: Never

replicaCount: 1

containerPorts:
  webui: 5174
  mcp: 7879

service:
  type: ClusterIP
  webuiPort: 5174
  mcpPort: 7879

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  storageClass: ""
  existingClaim: ""

env:
  LUCY_PUBLIC_MCP_URL: "http://lucy.gate.example.com/mcp"
  LUCY_ALLOW_PLACEHOLDER_KTX: "1"
  KTX_PROJECT_ROOT: /data/lucy
  POSTHOG_DISABLED: "1"

existingSecret: ""
extraSecretData:
  demo-password: change-me

lucy:
  enabled: true
  version: "0.17.0"
  bundledKtxVersion: "0.16.0"

serviceAccount:
  create: true
  name: ""
