roles:
  demo_readonly:
    description: Demo Superstore readonly agent
    allow:
      connections:
        - demo-mysql
      tableSelectors:
        - connection: demo-mysql
          schema: dataforai
          names:
            - superstore_orders
            - superstore_returns
            - superstore_people
      tools:
        - lucy_catalog
        - lucy_query
        - lucy_read_source
        - lucy_explain_query
        - wiki_search
        - wiki_read
        - connection_list

  lucy_admin:
    description: 平台运维数据面（非 WebUI 登录账户）
    permission_model_version: 2
    allow:
      connections:
        - demo-mysql
      source_scope: catalog_bound
      tools:
        - lucy_catalog
        - lucy_query
        - lucy_read_source
        - lucy_explain_query
        - lucy_freshness
        - lucy_begin_question
        - kx_catalog
        - connection_list
        - wiki_search
        - wiki_read
        - entity_details
        - dictionary_search
        - discover_data

users:
  - id: demo_agent
    name: Demo Agent
    enabled: true
    note: "Demo 烟测账号，请勿用于生产。"
    tokens:
      - hash: "sha256:8ccee2d00afbe164425d51333fe42a3e5a7381955e555a69c185edb8783018f7"
        label: p0-demo
        created: 2026-06-21
    role: demo_readonly

defaults:
  deny_tools:
    - sql_execution
    - sql_dialect_notes
    - memory_ingest
    - memory_ingest_status
    - sl_query
    - sl_read_source
  known_tools:
    - lucy_query
    - lucy_read_source
    - lucy_explain_query
    - lucy_catalog
    - lucy_freshness
    - wiki_search
    - wiki_read
    - entity_details
    - dictionary_search
    - discover_data
    - connection_list
    - kx_catalog
    - sl_query
    - sl_read_source
    - sl_validate
    - sql_execution
    - sql_dialect_notes
    - memory_ingest
    - memory_ingest_status
  table_touching_tools:
    - lucy_query
    - lucy_read_source
    - lucy_explain_query
    - lucy_freshness
    - entity_details
    - sl_validate
    - sl_query
    - sl_read_source
  sensitive_metadata_tools:
    - dictionary_search
    - discover_data
  sensitive_table_prefixes: []
