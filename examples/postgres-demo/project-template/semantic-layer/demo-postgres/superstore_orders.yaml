name: superstore_orders

grain:
  - row_id

columns:
  - name: order_year
    type: time
    role: time
    expr: EXTRACT(YEAR FROM order_date)
    descriptions:
      db: 订单年份
      ai: Year extracted from order_date.

measures:
  - name: total_sales
    expr: sum(sales)
    description: 销售总额（折扣后实收金额）。

  - name: total_profit
    expr: sum(profit)
    description: 利润总额。可为负值（亏损行不可排除，否则高估利润）。

  - name: profit_margin
    expr: sum(profit) / nullif(sum(sales), 0)
    description: 利润率。必须用 SUM/SUM 重算，禁止 AVG(profit/sales)。

  - name: order_count
    expr: count(distinct order_id)
    description: 订单数。必须用 COUNT(DISTINCT order_id)，禁止 COUNT(*)。

segments:
  - name: active_rows
    expr: is_deleted = 0
    description: 排除逻辑删除行。所有分析查询的基础过滤条件。

  - name: high_discount
    expr: discount > 0.2
    description: 折扣超过 20% 的行。高折扣区间通常对应亏损。

  - name: loss_rows
    expr: profit < 0
    description: 亏损明细行（profit 为负值）。

joins:
  - to: superstore_returns
    "on": superstore_orders.order_id = superstore_returns.order_id
    relationship: many_to_one
    source: formal

  - to: superstore_people
    "on": superstore_orders.region = superstore_people.region
    relationship: many_to_one
    source: formal
