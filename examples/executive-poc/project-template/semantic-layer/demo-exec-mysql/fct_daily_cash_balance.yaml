name: fct_daily_cash_balance
grain:
- entity_id
- as_of_date
columns:
- name: period_month
  type: string
  role: time
  expr: DATE_FORMAT(as_of_date, '%Y-%m')
measures:
- name: cash_balance_eod
  expr: max(cash_balance)
  description: 日终结存；跨日趋势禁止 SUM(cash_balance)。
- name: cash_balance_month_end
  expr: max(case when is_month_end = 1 then cash_balance else null end)
  description: 月末资金存量；按 period_month 聚合时使用。
segments:
- name: month_end_only
  expr: is_month_end = 1
  description: 仅月末快照行。
joins:
- to: dim_legal_entity
  'on': fct_daily_cash_balance.entity_id = dim_legal_entity.entity_id
  relationship: many_to_one
  source: formal
