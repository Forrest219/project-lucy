name: fct_gl_account_balance
grain:
- entity_id
- account_id
- as_of_date
- currency
columns:
- name: period_month
  type: string
  role: time
  expr: DATE_FORMAT(as_of_date, '%Y-%m')
measures:
- name: end_balance_eod
  expr: max(end_balance)
  description: 日终科目余额；跨日禁止 SUM。
- name: end_balance_month_end
  expr: max(case when is_month_end = 1 then end_balance else null end)
  description: 月末科目余额。
segments:
- name: month_end_only
  expr: is_month_end = 1
  description: 仅月末快照行。
- name: q2_2026
  expr: DATE_FORMAT(as_of_date, '%Y-%m') in ('2026-04','2026-05','2026-06')
  description: 2026 Q2。
joins:
- to: dim_gl_account
  'on': fct_gl_account_balance.account_id = dim_gl_account.account_id
  relationship: many_to_one
  source: formal
- to: dim_legal_entity
  'on': fct_gl_account_balance.entity_id = dim_legal_entity.entity_id
  relationship: many_to_one
  source: formal
