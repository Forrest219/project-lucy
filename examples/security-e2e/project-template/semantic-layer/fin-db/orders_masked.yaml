name: orders_masked

grain:
  - order_id

measures:
  - name: order_count
    expr: count(distinct order_id)
    description: 订单数。必须用 COUNT(DISTINCT order_id)。
  - name: total_amount_cents
    expr: sum(amount_cents)
    description: 订单金额合计（分）。

segments:
  - name: east
    expr: region = 'East'
    description: 华东区域。
