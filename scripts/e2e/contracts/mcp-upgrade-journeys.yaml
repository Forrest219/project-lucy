  - id: QB-JOIN-02
    version: 1
    lane: demo-business
    configProfileId: lucy-mcp-compat-demo
    mapsTo: [COMPAT-05]
    title: Unknown table join must deny without misleading next step
    turns:
      - text: "把订单和不存在的表关联，返回销售额。"
    agentRequirements: { publicMcp: true, sameSession: false }
    identities:
      - id: allow_readonly
        role: demo_readonly
        tokenRef: env:COMPAT_TOKEN_READONLY
        expect:
          outcome: deny
          requireToolsCall: true
          reasonFamily: unknown_or_unresolved_source
          upstreamExecutions: 0
    connectionIds: [demo-mysql]
    sources: [superstore_orders]
    mcpControls:
      - identity: allow_readonly
        begin: "订单与不存在表关联"
        query:
          connectionId: demo-mysql
          measures: [superstore_orders.total_sales]
          # Deliberately references a non-existent companion source.
          dimensions: [{ field: nonexistent_ghost_table.some_field }]
          filters: []
    oracle:
      kind: deny
      ref: deny:unknown-join-reference
      expect:
        noMisleadingNextStep: true
        noCrossTableInvention: true
    budgetClass: denial
    evidence:
      - requestId
      - traceId
      - turnWallClockMs
      - mcpClientRttMs
      - serverDurationMs
      - configProfileFingerprint
      - windowAnchor
      - identityId
      - snapshotId

  # -------------------------------------------------------------------------
  # 4.3 Multi-db + ACL
  # -------------------------------------------------------------------------
  - id: QB-DB-01
    version: 1
    lane: controlled-fixture
    configProfileId: lucy-mcp-compat-demo
    mapsTo: [COMPAT-06]
    title: Dual-connection fixture — query demo-mysql and lucy-ops separately then compare
    turns:
      - text: "分别查询 demo-mysql 的订单数和 lucy-ops 近窗工具调用次数，并对比两边结果。"
    agentRequirements: { publicMcp: true, sameSession: true }
    identities:
      - id: dual_conn_readonly
        role: compat_fixture_dual_readonly
        tokenRef: env:COMPAT_TOKEN_DUAL_CONN
        expect:
          outcome: allow
          forbiddenRole: lucy_admin
    connectionIds: [demo-mysql, lucy-ops]
    sources: [superstore_orders, ops_calls]
    mcpControls:
      - identity: dual_conn_readonly
        begin: "双连接分别查询后对比"
        query:
          # Two sequential single-connection queries; never invent cross-connection join.
          steps:
            - connectionId: demo-mysql
              measures: [superstore_orders.order_count]
              filters: []
            - connectionId: lucy-ops
              measures: [ops_calls.call_count]
              filters: []
              # W0 ops_calls: no gov.* allowed on this source.
    oracle:
      kind: independent-query
      ref: sql:dual-conn.demo-mysql-and-lucy-ops-separate
      expect:
        identityNotAdmin: true
        separateQueriesOnly: true
    budgetClass: multi-db
    evidence:
      - requestId
      - traceId
      - turnWallClockMs
      - mcpClientRttMs
      - serverDurationMs
      - configProfileFingerprint
      - windowAnchor
      - identityId
      - snapshotId

  - id: QB-DB-02
    version: 1
    lane: controlled-fixture
    configProfileId: lucy-mcp-compat-demo
    mapsTo: [COMPAT-06]
    title: Illegal cross-connection join must deny with split-by-connection next step
    turns:
      - text: "把 demo-mysql 订单和 lucy-ops 调用记录 join 在一起统计销售额。"
    agentRequirements: { publicMcp: true, sameSession: false }
    identities:
      - id: dual_conn_readonly
        role: compat_fixture_dual_readonly
        tokenRef: env:COMPAT_TOKEN_DUAL_CONN
        expect:
          outcome: deny
          requireToolsCall: true
          reasonFamily: cross_connection
          upstreamExecutions: 0
          forbiddenRole: lucy_admin
    connectionIds: [demo-mysql, lucy-ops]
    sources: [superstore_orders, ops_calls]
    mcpControls:
      - identity: dual_conn_readonly
        begin: "非法跨连接 join"
        query:
          connectionId: demo-mysql
          measures: [superstore_orders.total_sales, ops_calls.call_count]
          filters: []
    oracle:
      kind: deny
      ref: deny:cross-connection-join
      expect:
        nextStepHint: split_by_connection
        noCrossConnectionJoinSuccess: true
    budgetClass: denial
    evidence:
      - requestId
      - traceId
      - turnWallClockMs
      - mcpClientRttMs
      - serverDurationMs
      - configProfileFingerprint
      - windowAnchor
      - identityId
      - snapshotId

