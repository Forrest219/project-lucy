  - id: QB-JOIN-01
    version: 2
    lane: demo-business
    configProfileId: lucy-mcp-compat-demo
    mapsTo: [COMPAT-05]
    # v2: demo returns 无预定义 measure 且无法经 join 触达 region（chasm）；控制面验
    # 已声明 orders↔people join。退货量单表见 ACL-03a／独立 returns 题。
