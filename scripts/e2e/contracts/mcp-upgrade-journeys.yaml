  - id: QB-BIZ-03
    version: 1
    lane: demo-business
    configProfileId: lucy-mcp-compat-demo
    mapsTo: [COMPAT-09]
    title: ESC-11 isomorphism — begin + pinned query must not source_ambiguity_gate
    turns:
      - text: "请使用lucy查询25年11月和12月会员收入"
    agentRequirements: { publicMcp: true, sameSession: true }
    identities:
      - id: allow_readonly
        role: demo_readonly
        tokenRef: env:COMPAT_TOKEN_READONLY
        expect: { outcome: allow }
    connectionIds: [demo-mysql]
    sources: [superstore_orders]
    mcpControls:
      - identity: allow_readonly
        begin:
          question: "请使用lucy查询25年11月和12月会员收入"
          intentSummary: "未选表概况：查询超市业务会员与收入相关指标，未指定来源表"
        query:
          connectionId: demo-mysql
          measures: [superstore_orders.total_sales]
          dimensions: [{ field: superstore_orders.region }]
          filters:
            - "region='East'"
            - "discount > 0.2"
          # First lucy_query must succeed; no person/host confirm.
    oracle:
      kind: invariant
      ref: invariant:esc11-no-source-ambiguity-gate
      expect:
        firstQueryReasonNot: source_ambiguity_gate
        schemaEvidenceUnavailableForbidden: true
        noDenyThenRetryGreen: true
    budgetClass: incident-watch
    evidence:
      - requestId
      - traceId
      - turnWallClockMs
      - mcpClientRttMs
      - serverDurationMs
      - configProfileFingerprint
      - windowAnchor
      - identityId
      - snapshotId

