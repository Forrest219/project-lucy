# P1-54 MCP upgrade question bank — executable journeys (Spec v1.0 §3/§4/§5).
# Schema is journeys/compat-question-bank (NOT mainline-scenarios.mjs).
# Secrets never live here; TokenRefs are env placeholders only.
# CompatConfigProfile apply/restore and P1-53 judge are out of scope for this file.

kind: mcp-upgrade-question-bank
questionBankId: lucy-mcp-upgrade-question-bank
version: 1
configProfileId: lucy-mcp-compat-demo
# Fingerprint filled/verified when profile apply lands (Wave A1); placeholder for digest binding.
requiredConfigFingerprint: "sha256:957326482275fcc47a6c81e0462fa9085103af6b30fcaad5612297a80e733053"
specRef: docs/specs/lucy-20261118-mcp-upgrade-question-bank-spec.md
regionVocabulary: [East, Southwest, Central South, Northeast]
forbiddenRegionVocabulary: [华东, 西南, 华北, 西北, 华南]
forbiddenRoles: [lucy_admin]

sharedEvidence:
  - requestId
  - traceId
  - turnWallClockMs
  - mcpClientRttMs
  - serverDurationMs
  - configProfileFingerprint
  - windowAnchor
  - identityId
  - snapshotId

# §5 COMPAT ↔ QB denominator (machine-checkable). COMPAT-10–12 reuse cold-start/timing/replay via P1-53.
denominatorMaps:
  COMPAT-01: [QB-BIZ-01]
  COMPAT-02: [QB-BIZ-02a, QB-BIZ-02b, QB-BIZ-02c, QB-BIZ-02d]
  COMPAT-03: [QB-FOLLOW-01]
  COMPAT-04: [QB-FOLLOW-02]
  COMPAT-05: [QB-FOLLOW-03, QB-JOIN-01, QB-JOIN-02]
  COMPAT-06: [QB-DB-01, QB-DB-02]
  COMPAT-07: [QB-ACL-01, QB-ACL-02a, QB-ACL-02b, QB-ACL-02c]
  COMPAT-08: [QB-ACL-03a, QB-ACL-03b-gate, QB-ACL-03c]
  COMPAT-09: [QB-BIZ-03]
  COMPAT-OPS-01: [QB-OPS-01]
  COMPAT-OPS-02: [QB-OPS-02]
  COMPAT-OPS-03: [QB-OPS-03a, QB-OPS-03b]
  COMPAT-OPS-04: [QB-OPS-04]
  COMPAT-OPS-05: [QB-OPS-05, QB-OPS-05b]
  COMPAT-OPS-06: [QB-OPS-06]
  COMPAT-OPS-07: [QB-OPS-07a, QB-OPS-07b]
  COMPAT-OPS-08: [QB-OPS-08]
  COMPAT-OPS-09: [QB-OPS-09]
  COMPAT-OPS-10: [QB-OPS-10]
  COMPAT-OPS-11: [QB-OPS-11]

coldStartFirstRoundReuse: [QB-BIZ-01, QB-FOLLOW-01, QB-OPS-01]

cases:
  # -------------------------------------------------------------------------
  # 4.1 Business + incident isomorphism
  # -------------------------------------------------------------------------
  - id: QB-BIZ-01
    version: 1
    lane: demo-business
    configProfileId: lucy-mcp-compat-demo
    mapsTo: [COMPAT-01]
    title: Independent single-table order_count + total_sales
    turns:
      - text: "查询 superstore_orders 的订单数和销售总额。"
    agentRequirements: { publicMcp: true, sameSession: false }
    identities:
      - id: allow_readonly
        role: demo_readonly
        tokenRef: env:COMPAT_TOKEN_READONLY
        expect: { outcome: allow }
    connectionIds: [demo-mysql]
    sources: [superstore_orders]
    mcpControls:
      - identity: allow_readonly
        begin: "查询 superstore_orders 订单数与销售总额"
        query:
          connectionId: demo-mysql
          measures: [superstore_orders.order_count, superstore_orders.total_sales]
          filters: []
    oracle:
      kind: exact
      ref: baseline:demo-mysql.superstore_orders.gold
      expect:
        order_count: 1000
        total_sales: 1459476.0953
    budgetClass: simple-metric
    evidence:
      - requestId
      - traceId
      - turnWallClockMs
      - mcpClientRttMs
      - serverDurationMs
      - configProfileFingerprint
      - windowAnchor
      - identityId
      - snapshotId

  - id: QB-BIZ-02a
    version: 1
    lane: demo-business
    configProfileId: lucy-mcp-compat-demo
    mapsTo: [COMPAT-02]
    title: Region group — order_count and profit margin including loss rows
    turns:
      - text: "按区域统计订单数和利润率，亏损行也要算。"
    agentRequirements: { publicMcp: true, sameSession: false }
    identities:
      - id: allow_readonly
        role: demo_readonly
        tokenRef: env:COMPAT_TOKEN_READONLY
        expect: { outcome: allow }
    connectionIds: [demo-mysql]
    sources: [superstore_orders]
    mcpControls:
      - identity: allow_readonly
        begin: "按区域统计订单数与利润率"
        query:
          connectionId: demo-mysql
          measures: [superstore_orders.order_count, superstore_orders.profit_margin]
          dimensions: [{ field: superstore_orders.region }]
          filters: []
    oracle:
      kind: independent-query
      ref: sql:demo-mysql.region_order_count_profit_margin
      notes: "COUNT DISTINCT orders; profit_margin = SUM(profit)/SUM(sales); include loss rows"
    budgetClass: group-metric
    evidence:
      - requestId
      - traceId
      - turnWallClockMs
      - mcpClientRttMs
      - serverDurationMs
      - configProfileFingerprint
      - windowAnchor
      - identityId
      - snapshotId

