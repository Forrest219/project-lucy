# v0.25 E2E 已知缺口清单（覆盖可达性合同）
#
# 目的：让"跑不到的执行项"变成**显式登记**，而不是静默漏掉。
#
# 背景：v0.25 覆盖清单的 149 个 newScenarios 里，只有一部分能被某个分支真的跑到。
# 分支选择集（scripts/e2e/lib/product-targets.mjs 的 SELECTED_IDS + AGENT 派生集）
# 就是各分支的**判定分母**——分母外的执行项永远不参与分支判定，于是一次"绿"的
# 分支运行并不代表它归属的执行项都跑过。
#
# 规则：
#   1. 清单里的每个 newScenarios 执行项，要么被某个分支选中，要么必须出现在本文件；
#      两者都不满足 = 静默漏项 = 门禁失败（scripts/e2e/__tests__/v025-reachability.test.mjs）。
#   2. 本文件里的每一项都必须**当前确实不可达**；一旦某项变得可达（例如补了用例或
#      备了数据源），必须从本文件移除，否则门禁失败——避免缺口清单变成垃圾桶。
#   3. 本文件不改变任何执行项的状态口径。缺口项在运行结果里仍然是 blocked / not_run，
#      绝不折叠成 passed。
#   4. 每个分组必须写明：为什么现在跑不到、需要什么才能解掉、归谁。
#
# 校验：scripts/e2e/__tests__/v025-reachability.test.mjs
