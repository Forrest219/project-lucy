# Frozen case catalog for the real-user E2E release gate.
# Authority: docs/specs/lucy-20261018-enterprise-security-and-real-e2e-spec.md §7 (+ listed sub-scenarios).
# Plan: T10. The expanded variant list is the fixed denominator: scripts/e2e/contracts/case-catalog.lock.json pins
# its digest and required ids, and case-catalog.test.mjs fails when they drift. Removing a case or flipping
# `required` therefore needs a reviewed lock change; it can never be done silently after a failing run.
#
# Fields (scenario level are defaults, a variant may override any of them):
#   runner     security | management | agent | gate   which tool produces the evidence
#   executors  Spec §7 letters: B browser, P protocol, D database, A agent client, O ops/fault, V evidence verifier
#   requires   capabilities that must exist or the case is BLOCKED (never skipped or passed): lucy-http, fault-control,
#              ktx-upstream, postgres, browser, agent-client, k8s-amd64, ci-runner, network-profile, clock-control, npm-registry
#   assert     assertion vocabulary tokens (see scripts/e2e/lib/catalog.mjs ASSERTION_TOKENS), never empty
#   gold       `none` (pure protocol case) or a question key of examples/security-e2e/gold/compute-gold.mjs
#   artifacts  evidence files the case must produce
#   repeat     Agent cases run this many independent times per required product (R9: 3/3 must pass)
#   matrix     expands `{name}` placeholders in id/t over the cartesian product
version: 1
spec: "docs/specs/lucy-20261018-enterprise-security-and-real-e2e-spec.md"
scenarios:
  SEC-01:
    title: 默认管理认证
    spec: "§3.1"
    runner: security
    executors: [P]
    requires: [lucy-http]
    assert: [deny, no_side_effect]
    gold: none
    artifacts: [security-case-result.json]
    variants:
      - {id: SEC-01-V01, t: 匿名查询认证状态不得为 open}
      - {id: SEC-01-V02, t: 匿名写 Wiki/Agent 被拒且无写盘}
      - {id: SEC-01-V03, t: 匿名 bootstrap 无密钥被拒且无副作用}
      - {id: SEC-01-V04, t: 管理员配置损坏进入 unavailable 而非 open, executors: [P, O], requires: [lucy-http, fault-control], assert: [unavailable_not_open, no_side_effect]}
      - {id: SEC-01-V05, t: 客户模式且 auth=off 拒绝启动, executors: [O], requires: [fault-control], assert: [deny]}
      - {id: SEC-01-V06, t: 浏览器匿名访问被引导到登录/引导页, runner: management, executors: [B], requires: [lucy-http, browser], artifacts: [management-case-result.json]}
  SEC-02:
