      - {id: SEC-02-V03, t: 两个并发首建恰好一个成功其余 409, assert: [exactly_one_wins, deny]}
      - {id: SEC-02-V04, t: 已消费密钥再次使用被拒 409}
      - {id: SEC-02-V05, t: 引导成功后进程被强杀重启不重新公开引导, executors: [P, O], requires: [lucy-http, fault-control], assert: [unavailable_not_open]}
      - {id: SEC-02-V06, t: 浏览器受控引导创建首个 owner, runner: management, executors: [B], requires: [lucy-http, browser], assert: [allow_control], artifacts: [management-case-result.json]}
