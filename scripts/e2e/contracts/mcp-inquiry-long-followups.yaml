# P1-79 长追问题组（性能专用）— 题组包正文。
#
# 合同：docs/specs/lucy-20261123-long-followup-question-pack-spec.md（D1–D9、§3、§6 SC-01–SC-06）
# 计划：docs/plans/lucy-20261123-long-followup-question-pack-plan.md Task 2
# 校验器：scripts/e2e/lib/mcp-inquiry-question-pack.mjs（纯函数；重算 packDigest）
#
# 语义来源（只读，不另立口径）：
#   - 指标／维度／口径／oracle 写法继承 P1-54：docs/specs/lucy-20261118-mcp-upgrade-question-bank-spec.md
#     与 scripts/e2e/contracts/mcp-upgrade-journeys.yaml（configProfileId=lucy-mcp-compat-demo、
#     连接=demo-mysql、区域词表 East/Southwest/Central South/Northeast、oracle kind 域一致）。
#   - 语义层口径：semantic-layer/demo-mysql/superstore_orders.yaml（total_sales=SUM(sales)、
#     total_profit=SUM(profit)、profit_margin=SUM(profit)/NULLIF(SUM(sales),0)、
#     order_count=COUNT(DISTINCT order_id)、active_rows 段 is_deleted=0、
#     已声明 join：orders↔returns（order_id）、orders↔people（region））。
#   - oracle 事实来源：examples/docker-demo/mysql/_baseline.json（seed=42 金标）、
#     examples/docker-demo/scripts/gen-demo-data.mjs（区域负责人、词表）、docs/qa/uat/scale-baseline.md §1.1。
#
# D9：每轮题面自包含（连接／数据源／时间窗／过滤／维度全部显式写出）、不用指代词、单一意图；
# 承接通过显式重述范围项并改变一个维度实现，重述项登记在 carriedContext。
# 角色类（identity）声明的是角色类而非具体身份；受限角色模板的逐轮 oracle 按该角色类
# 最窄一致可见范围编写，对同角色类任一身份等价成立。
#
# oracle 取值口径：
#   - exact：值锚定 examples/docker-demo/mysql/_baseline.json 金标（total_sales／order_count／
#     sales_by_region／sales_by_year／counts／returns_for_loss_orders）。
#   - invariant：可由金标算出的对账式恒等（年度合计＝全量、区域合计＝全量、利润率复算、
#     COUNT(*)＝COUNT(DISTINCT order_id)、join 无重复放大），带 tolerance。
#   - independent-query：金标未直接锚定（月份切片、类别／子类／细分／装运模式拆分、条件叠加、
#     跨表关联分组），ref 写清可复算口径与 SQL 依据。
#   - deny：受限角色越权轮（表不可见／跨表／跨连接），口径同 P1-54 D7a。
#   - privacy：受限角色敏感字段轮（customer_name 遮蔽），口径同 P1-54 QB-ACL-03c。
#
# 消费方：P1-78 scripts/e2e/contracts/mcp-inquiry-performance.yaml 的 LONG_FOLLOW 场景
# 只引用 questionRef=[QB-LONG-01,QB-LONG-02,QB-LONG-03] 与 packDigest，不复制题面。

contract: lucy-mcp-inquiry-long-followups-v1
version: 1
packDigestSeed: p1-79-long-followup-pack-20261126
pronounBlocklistVersion: v1
packDigest: "sha256:41ce9d18a3a1508d21e909c2a1609eabaee644bfd7776e4b33b1404bb890a091"

cases:
  # ---------------------------------------------------------------------------
  # QB-LONG-01 — simple / read_only / demo-mysql
  # 承接类型：时间窗推移（T1–T5、T14–T17）、维度拆分（T6–T10、T17–T19）、口径收窄（T11–T13、T20）。
  # ---------------------------------------------------------------------------
  - id: QB-LONG-01
    version: 1
    lane: demo-business
    configProfileId: lucy-mcp-compat-demo
    budgetClass: simple
    identity: read_only
    connectionId: demo-mysql
    evidence:
      - requestId
      - traceId
      - turnWallClockMs
      - mcpClientRttMs
      - serverDurationMs
      - configProfileFingerprint
      - windowAnchor
      - identityId
      - snapshotId
    turns:
      - turnIndex: 0
        text: "查询 demo-mysql 连接 superstore_orders 表在全部订单数据上的订单数、销售总额和利润总额。"
        dependsOnTurn: null
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "时间窗=全部订单数据"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=order_count／total_sales／total_profit"
          - "分组=无"
        oracle:
          kind: exact
          ref: "baseline:demo-mysql.superstore_orders.gold"
          expect:
            order_count: 1000
            total_sales: 1459476.0953
            total_profit: 294190.223
            roleClass: read_only
      - turnIndex: 1
        text: "查询 demo-mysql 连接 superstore_orders 表在 2024 年全年（2024-01-01 至 2024-12-31）的销售总额。"
        dependsOnTurn: 0
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=2024-01-01..2024-12-31"
          - "分组=无"
        oracle:
          kind: exact
          ref: "baseline:demo-mysql.superstore_orders.sales_by_year.2024"
          expect:
            total_sales: 366646.0565
            order_year: 2024
      - turnIndex: 2
        text: "查询 demo-mysql 连接 superstore_orders 表在 2025 年全年（2025-01-01 至 2025-12-31）的销售总额。"
        dependsOnTurn: 1
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=2025-01-01..2025-12-31"
          - "分组=无"
        oracle:
          kind: exact
          ref: "baseline:demo-mysql.superstore_orders.sales_by_year.2025"
          expect:
            total_sales: 364660.4159
            order_year: 2025
      - turnIndex: 3
        text: "查询 demo-mysql 连接 superstore_orders 表在 2026 年全年（2026-01-01 至 2026-12-31）的销售总额。"
        dependsOnTurn: 2
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=2026-01-01..2026-12-31"
          - "分组=无"
        oracle:
          kind: exact
          ref: "baseline:demo-mysql.superstore_orders.sales_by_year.2026"
          expect:
            total_sales: 355302.1758
            order_year: 2026
      - turnIndex: 4
        text: "查询 demo-mysql 连接 superstore_orders 表在 2027 年全年（2027-01-01 至 2027-12-31）的销售总额。"
        dependsOnTurn: 3
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=2027-01-01..2027-12-31"
          - "分组=无"
        oracle:
          kind: exact
          ref: "baseline:demo-mysql.superstore_orders.sales_by_year.2027"
          expect:
            total_sales: 372867.4471
            order_year: 2027
      - turnIndex: 5
        text: "计算 demo-mysql 连接 superstore_orders 表按订单年份（2024、2025、2026、2027）汇总的销售总额合计。"
        dependsOnTurn: 4
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=2024-01-01..2027-12-31"
          - "分组=order_year 后二次汇总"
        oracle:
          kind: invariant
          ref: "baseline:demo-mysql.superstore_orders.sales_by_year.sum"
          expect:
            total_sales: 1459476.0953
            tolerance: 0.01
            years: [2024, 2025, 2026, 2027]
            formula: "SUM(SUM(sales) GROUP BY order_year) == SUM(sales)"
      - turnIndex: 6
        text: "查询 demo-mysql 连接 superstore_orders 表在全部订单数据上 East 区域的销售总额。"
        dependsOnTurn: 5
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=全部订单数据"
          - "过滤=region='East'"
        oracle:
          kind: exact
          ref: "baseline:demo-mysql.superstore_orders.sales_by_region.East"
          expect:
            total_sales: 550670.8159
            region: East
      - turnIndex: 7
        text: "查询 demo-mysql 连接 superstore_orders 表在全部订单数据上 Central South 区域的销售总额。"
        dependsOnTurn: 6
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=全部订单数据"
          - "过滤=region='Central South'"
        oracle:
          kind: exact
          ref: "baseline:demo-mysql.superstore_orders.sales_by_region.Central_South"
          expect:
            total_sales: 363958.9831
            region: Central South
      - turnIndex: 8
        text: "查询 demo-mysql 连接 superstore_orders 表在全部订单数据上 Northeast 区域的销售总额。"
        dependsOnTurn: 7
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=全部订单数据"
          - "过滤=region='Northeast'"
        oracle:
          kind: exact
          ref: "baseline:demo-mysql.superstore_orders.sales_by_region.Northeast"
          expect:
            total_sales: 302200.0925
            region: Northeast
      - turnIndex: 9
        text: "查询 demo-mysql 连接 superstore_orders 表在全部订单数据上 Southwest 区域的销售总额。"
        dependsOnTurn: 8
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=全部订单数据"
          - "过滤=region='Southwest'"
        oracle:
          kind: exact
          ref: "baseline:demo-mysql.superstore_orders.sales_by_region.Southwest"
          expect:
            total_sales: 242646.2038
            region: Southwest
      - turnIndex: 10
        text: "计算 demo-mysql 连接 superstore_orders 表按区域（East、Central South、Northeast、Southwest）汇总的销售总额合计。"
        dependsOnTurn: 9
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=全部订单数据"
          - "分组=region 后二次汇总"
        oracle:
          kind: invariant
          ref: "baseline:demo-mysql.superstore_orders.sales_by_region.sum"
          expect:
            total_sales: 1459476.0953
            tolerance: 0.01
            regions: [East, Central South, Northeast, Southwest]
            formula: "SUM(SUM(sales) GROUP BY region) == SUM(sales)"
      - turnIndex: 11
        text: "查询 demo-mysql 连接 superstore_orders 表在全部订单数据上的利润率（利润总额除以销售总额）。"
        dependsOnTurn: 10
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=profit_margin（SUM(profit)/NULLIF(SUM(sales),0)）"
          - "时间窗=全部订单数据"
          - "分组=无"
        oracle:
          kind: exact
          ref: "baseline:demo-mysql.superstore_orders.measures.profit_margin"
          expect:
            profit_margin: 0.201572
            formula: "SUM(profit)/NULLIF(SUM(sales),0)"
      - turnIndex: 12
        text: "用销售总额 1459476.0953 与利润总额 294190.223 复算 demo-mysql 连接 superstore_orders 表在全部订单数据上的利润率。"
        dependsOnTurn: 11
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=profit_margin"
          - "时间窗=全部订单数据"
          - "口径=SUM/SUM（禁止 AVG(profit/sales)）"
        oracle:
          kind: invariant
          ref: "baseline:demo-mysql.superstore_orders.measures.profit_margin"
          expect:
            profit_margin: 0.201572
            total_profit: 294190.223
            total_sales: 1459476.0953
            tolerance: 0.000001
            formula: "294190.223/1459476.0953"
      - turnIndex: 13
        text: "按去重订单号统计 demo-mysql 连接 superstore_orders 表在全部订单数据上的订单数。"
        dependsOnTurn: 12
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=order_count（COUNT(DISTINCT order_id)）"
          - "时间窗=全部订单数据"
          - "分组=无"
        oracle:
          kind: invariant
          ref: "baseline:demo-mysql.superstore_orders.measures.order_count"
          expect:
            order_count: 1000
            distinct_order_ids: 1000
            tolerance: 0
            formula: "COUNT(DISTINCT order_id)"
      - turnIndex: 14
        text: "查询 demo-mysql 连接 superstore_orders 表在 2025 年 11 月（2025-11-01 至 2025-11-30）的销售总额。"
        dependsOnTurn: 13
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=2025-11-01..2025-11-30"
          - "分组=无"
        oracle:
          kind: independent-query
          ref: "sql:demo-mysql.superstore_orders.total_sales_month_2025_11"
          expect:
            connectionId: demo-mysql
            source: superstore_orders
            measure: total_sales
            filters:
              - { field: superstore_orders.order_date, op: ">=", value: "2025-11-01" }
              - { field: superstore_orders.order_date, op: "<", value: "2025-12-01" }
            sql: "SELECT SUM(sales) AS total_sales FROM dataforai.superstore_orders WHERE is_deleted = 0 AND order_date >= '2025-11-01' AND order_date < '2025-12-01'"
            rows: 1
      - turnIndex: 15
        text: "查询 demo-mysql 连接 superstore_orders 表在 2025 年 12 月（2025-12-01 至 2025-12-31）的销售总额。"
        dependsOnTurn: 14
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=2025-12-01..2025-12-31"
          - "分组=无"
        oracle:
          kind: independent-query
          ref: "sql:demo-mysql.superstore_orders.total_sales_month_2025_12"
          expect:
            connectionId: demo-mysql
            source: superstore_orders
            measure: total_sales
            filters:
              - { field: superstore_orders.order_date, op: ">=", value: "2025-12-01" }
              - { field: superstore_orders.order_date, op: "<", value: "2026-01-01" }
            sql: "SELECT SUM(sales) AS total_sales FROM dataforai.superstore_orders WHERE is_deleted = 0 AND order_date >= '2025-12-01' AND order_date < '2026-01-01'"
            rows: 1
      - turnIndex: 16
        text: "计算 demo-mysql 连接 superstore_orders 表 2025 年 12 月相对 2025 年 11 月的销售总额环比变化率。"
        dependsOnTurn: 15
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales 环比变化率"
          - "时间窗=2025-11-01..2025-12-31"
          - "对比基期=2025 年 11 月"
        oracle:
          kind: independent-query
          ref: "sql:demo-mysql.superstore_orders.sales_2025_11_12_mom"
          expect:
            connectionId: demo-mysql
            source: superstore_orders
            measure: total_sales
            months: ["2025-11", "2025-12"]
            formula: "(sales_2025_12 - sales_2025_11) / sales_2025_11"
            sql: "SELECT SUM(CASE WHEN order_date >= '2025-11-01' AND order_date < '2025-12-01' THEN sales ELSE 0 END) AS sales_2025_11, SUM(CASE WHEN order_date >= '2025-12-01' AND order_date < '2026-01-01' THEN sales ELSE 0 END) AS sales_2025_12 FROM dataforai.superstore_orders WHERE is_deleted = 0"
            rows: 1
      - turnIndex: 17
        text: "按区域拆分 demo-mysql 连接 superstore_orders 表在 2025 年 11 月（2025-11-01 至 2025-11-30）的销售总额。"
        dependsOnTurn: 16
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=total_sales（SUM(sales)）"
          - "时间窗=2025-11-01..2025-11-30"
          - "分组=region"
        oracle:
          kind: independent-query
          ref: "sql:demo-mysql.superstore_orders.total_sales_by_region_2025_11"
          expect:
            connectionId: demo-mysql
            source: superstore_orders
            measure: total_sales
            groupBy: [superstore_orders.region]
            filters:
              - { field: superstore_orders.order_date, op: ">=", value: "2025-11-01" }
              - { field: superstore_orders.order_date, op: "<", value: "2025-12-01" }
            sql: "SELECT region, SUM(sales) AS total_sales FROM dataforai.superstore_orders WHERE is_deleted = 0 AND order_date >= '2025-11-01' AND order_date < '2025-12-01' GROUP BY region"
            maxRows: 4
            regionVocabulary: [East, Southwest, Central South, Northeast]
      - turnIndex: 18
        text: "查询 demo-mysql 连接 superstore_orders 表中商品类别为 Furniture 的订单数。"
        dependsOnTurn: 17
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=order_count（COUNT(DISTINCT order_id)）"
          - "时间窗=全部订单数据"
          - "过滤=category='Furniture'"
        oracle:
          kind: independent-query
          ref: "sql:demo-mysql.superstore_orders.order_count_category_Furniture"
          expect:
            connectionId: demo-mysql
            source: superstore_orders
            measure: order_count
            filters:
              - { field: superstore_orders.category, op: "=", value: "Furniture" }
            sql: "SELECT COUNT(DISTINCT order_id) AS order_count FROM dataforai.superstore_orders WHERE is_deleted = 0 AND category = 'Furniture'"
            rows: 1
      - turnIndex: 19
        text: "按装运模式拆分 demo-mysql 连接 superstore_orders 表在全部订单数据上的订单行数。"
        dependsOnTurn: 18
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=订单行数（COUNT(*)）"
          - "时间窗=全部订单数据"
          - "分组=ship_mode"
        oracle:
          kind: independent-query
          ref: "sql:demo-mysql.superstore_orders.row_count_by_ship_mode"
          expect:
            connectionId: demo-mysql
            source: superstore_orders
            measure: row_count
            groupBy: [superstore_orders.ship_mode]
            sql: "SELECT ship_mode, COUNT(*) AS row_count FROM dataforai.superstore_orders WHERE is_deleted = 0 GROUP BY ship_mode"
            maxRows: 4
            shipModeVocabulary: [Standard, Second Class, First Class, Same Day]
      - turnIndex: 20
        text: "统计 demo-mysql 连接 superstore_orders 表中折扣大于 0.2 的订单行数。"
        dependsOnTurn: 19
        carriedContext:
          - "连接=demo-mysql"
          - "数据源=superstore_orders"
          - "行过滤=is_deleted=0（active_rows 段）"
          - "指标=订单行数（COUNT(*)）"
          - "时间窗=全部订单数据"
          - "过滤=discount>0.2（high_discount 段）"
        oracle:
          kind: exact
          ref: "baseline:demo-mysql.superstore_orders.counts.high_discount_rows"
          expect:
            high_discount_rows: 132
            segment: high_discount
