lucy_eval_schema_version: 1
kind: lucy_eval_suite
suite_id: chatbi_intl_v1
domain: chatbi_intl
title: chatbi 国际化指标 Eval Suite v1
description: 20 道 numeric（demo-db）+ 80 道口径 text 断言；路径 A 同库对照
metadata:
  document_name: chatbi 国际化指标 Eval Cases
  document_type: Eval
  version: v0.2
  runner_schema_version: v1.4
  written_date: 2026-08-06
  author: Cursor Agent
  requester: zhangxingchen
  based_on:
    - ~/Desktop/lucy_upload/*.yaml
    - wiki/global/chatbi-intl-metrics-playbook.md
    - AI 友好型问答.docx（题型，不绑死样本日）
  scope: chatbi 100 题：20 numeric scalar + 80 logic text must_mention；demo-db 快照
  output_path: eval/chatbi_intl-eval-cases.yaml
  data_source: semantic_layer
  result_assertions_status: filled_v0.2
safety_contract:
  readonly: true
  forbid_secret_paths:
    - .ktx/secrets/
  forbid_cross_source_join: true
  forbidden_ast:
    - type: forbidden_ast
      value: UPDATE | DELETE | INSERT | MERGE | DROP | ALTER | TRUNCATE | CREATE
      reason: eval 只能只读，不允许 DDL 或 DML。
    - type: forbidden_ast
      value: cross_source_join
      reason: 禁止跨数据源 Join。
cases:
  - id: chatbi_intl-country-001
    case_type: single_turn
    skill_version: v0.1
    semantic_version: v0.1
    question: 2026-07-13 韩国 Android 的 DAU 是多少？（单位：人）
    domain: chatbi_intl
    trace_required: true
    context_required:
      keys:
        - global/chatbi-intl-metrics-playbook.md
    risk_tags:
      - unit
      - dau
      - numeric
      - country
    expected_source: semantic_layer
    expected_measures:
      - dau
    comparison_mode: numeric
    golden_sql: SELECT SUM(dau) FROM chatbi.ai_intl_country_daily WHERE date='2026-07-13' AND platform='android' AND
      country_abbr='KR'
    lucy_query:
      connectionId: demo-mysql
      measures:
        - ai_intl_country_daily.dau
      filters:
        - ai_intl_country_daily.date = '2026-07-13'
        - ai_intl_country_daily.platform = 'android'
        - ai_intl_country_daily.country_abbr = 'KR'
    tool_assertions:
      - type: required_tool
        value: sl_query
        reason: 取数题必须走语义查询。
    result_assertions:
      - value_type: scalar
        compare_mode: approx
        numeric_tolerance: 0.01
        data:
          dau: 6000
    notes: 金标来自 demo-db；DAU 单位为人。
    snapshot_date: 2026-07-13
