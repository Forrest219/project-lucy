metadata:
  document_name: Data Agent POC Eval Cases
  document_type: Eval
  version: v0.1
  runner_schema_version: v1.4
  written_date: 2026-06-30
  author: Codex
  requester: project-lucy 团队
  based_on:
    - semantic-layer/poc-mysql-aliyun/_schema/data_agent_poc.yaml
    - wiki/global/poc-data-agent-playbook.md
    - webui/config/data-qa-instructions.md
  scope: POC data agent regression cases for semantic-layer routing, business-date interpretation, and CEO snapshot reconciliation.
  output_path: evals/data_agent_poc/eval/data_agent_poc-eval-cases.yaml
  snapshot_date: 2026-06-30
  data_source: semantic_layer
  paired_quiz:
    path: evals/data_agent_poc/data_agent_poc-quiz-cases.html
    version: v0.1

safety_contract:
  readonly: true
  forbid_secret_paths:
    - ".ktx/secrets/"
  forbid_cross_source_join: true
  forbidden_ast:
    - type: forbidden_ast
      value: "UPDATE | DELETE | INSERT | MERGE | DROP | ALTER | TRUNCATE | CREATE"
      reason: eval / fallback 只能只读，不允许 DDL 或 DML。
    - type: forbidden_ast
      value: "cross_source_join"
      reason: 禁止跨数据源 Join；跨源分析必须拆成单源结果后人工解释。

quiz_cases:
  - id: Q1
    stem: "Lucy 返回 dt=2026-05-30T16:00:00.000Z 时，它对应哪个 POC 业务日期？"
    difficulty: 1
    question_type: single
    display_type: conceptual
    eval_refs:
      - data_agent_poc-timezone-utc-display-001
    options:
      - key: A
        text: "北京 2026-05-31"
      - key: B
        text: "北京 2026-05-30"
      - key: C
        text: "UTC 2026-05-31"
      - key: D
        text: "无法判断"
    answer: "A"
    explanation: "POC 日期字段是北京时间自然日；2026-05-30T16:00:00.000Z 加 8 小时后是北京 2026-05-31 00:00:00。"

cases:
  - id: data_agent_poc-timezone-utc-display-001
    case_type: single_turn
    question: "Lucy / MCP 返回 dt=2026-05-30T16:00:00.000Z。请说明它对应哪个北京时间业务日期，并核对 CEO 快照 2026-05-31 的广告收入是否与同日事实表一致。"
    domain: data_agent_poc
    expected_source: semantic_layer
    expected_measures:
      - poc_ceo_metric_snapshot.metric_value
      - poc_ad_revenue_daily.ad_revenue
      - poc_ad_revenue_by_type_daily.ad_revenue
    tool_assertions:
      - type: required_tool
        value: sl_query
        reason: 必须通过语义层查询快照与事实表，不能只凭字符串日期猜测。
      - type: required_tool_arg
        value: "connectionId=poc-mysql-aliyun"
        reason: POC 查询必须显式限定连接，避免跨源或默认连接漂移。
    result_assertions:
      - value_type: text
        compare_mode: contains_all
        data:
          required_phrases:
            - "北京时间 2026-05-31"
            - "Asia/Shanghai"
            - "196,314.31"
            - "190,213.91"
            - "2026-05-30 的值"
      - value_type: text
        compare_mode: forbids_any
        data:
          forbidden_phrases:
            - "2026-05-30T16:00:00.000Z 对应北京时间 2026-05-30"
            - "5 月 31 日快照与事实表相差 6,100.40"
    context_assertions:
      required:
        - POC dt/snapshot_dt 字段表示北京时间自然日。
        - MCP/JSON UTC ISO 展示值必须先转换为 Asia/Shanghai 业务日期。
        - 2026-05-30T16:00:00.000Z 对应北京 2026-05-31 00:00:00。
        - 北京 2026-05-31 的 snapshot、广告经营表、分品类表广告收入均为 196,314.31。
        - 190,213.91 是北京 2026-05-30 的广告收入，不可用于 2026-05-31 快照对账。
    snapshot_date: "2026-06-30"
    coverage: anti-pattern/timezone; semantic-layer; CEO snapshot reconciliation
    notes: 防止 agent 直接截取 UTC ISO 字符串日期，把北京 2026-05-31 误判成 2026-05-30。
