safety_contract:
  readonly: true
  forbid_secret_paths:
    - .ktx/secrets/
  forbid_cross_source_join: true
  forbidden_ast:
    - type: forbidden_ast
      value: UPDATE | DELETE | INSERT | MERGE | DROP | ALTER | TRUNCATE | CREATE
      reason: eval 只能只读，不允许 DDL 或 DML。
    - type: forbidden_ast
      value: cross_source_join
      reason: 禁止跨数据源 Join。

quiz_cases:
  - id: Q1
    stem: 金额类科目默认单位是什么？
    difficulty: 0.5
    question_type: single
    display_type: conceptual
    eval_refs: [ksc-unit-001]
    options:
      - key: A
        text: 元人民币
      - key: B
        text: 千元人民币
      - key: C
        text: 万元人民币
      - key: D
        text: 美元
    answer: B
    explanation: unit_code=RMB_THOUSAND，默认千元人民币。
  - id: Q2
    stem: 2024 年合并总收入（千元）是多少？
    difficulty: 1
    question_type: single
    display_type: exact_value
    eval_refs: [ksc-income-revenue-2024]
    options:
      - key: A
        text: "7047461"
      - key: B
        text: "7785180"
      - key: C
        text: "8180107"
      - key: D
        text: "9558619"
    answer: B
    explanation: total_revenue @ 2024FY = 7785180 千元。
  - id: Q3
    stem: 杜邦默认资产/权益口径是？
    difficulty: 1
    question_type: single
    display_type: conceptual
    eval_refs: [ksc-dupont-period-end-001]
    options:
      - key: A
        text: 期初余额
      - key: B
        text: 期末余额
      - key: C
        text: 期初期末平均
      - key: D
        text: 任意时点均可
    answer: B
    explanation: Wiki 默认期末；平均口径待 Owner 确认。
  - id: Q4
    stem: 2024 年合并 ROE（期末）约为？
    difficulty: 2
    question_type: single
    display_type: exact_value
    eval_refs: [ksc-dupont-2024]
    options:
      - key: A
        text: "-0.1013"
      - key: B
        text: "-0.2805"
      - key: C
        text: "-0.3595"
      - key: D
        text: "-0.0755"
    answer: C
    explanation: net_loss/total_equity ≈ -0.359478。
  - id: Q5
    stem: 现金流勾稽时，仅加 cfo+cfi+cff 在 2025 年会漏掉哪一项？
    difficulty: 2
    question_type: single
    display_type: conceptual
    eval_refs: [ksc-cashflow-fx-recon-2025]
    options:
      - key: A
        text: 现金及现金等价物（资产负债表）
      - key: B
        text: 汇率影响 fx_effect
      - key: C
        text: EPS
      - key: D
        text: 递延税项资产
    answer: B
    explanation: 2025 年 fx_effect=-67146，必须计入净增减。
  - id: Q6
    stem: 查总收入正确过滤字段是？
    difficulty: 1
    question_type: single
    display_type: conceptual
    eval_refs: [ksc-filter-line-item-code-001]
    options:
      - key: A
        text: line_item_name_cn = '总收入'
      - key: B
        text: line_item_code = 'total_revenue'
      - key: C
        text: section_code = 'net'
      - key: D
        text: source_key LIKE '%revenue%'
    answer: B
    explanation: 中文名含前导空格与注释，必须用业务码。
  - id: Q7
    stem: 2023 流动比率是否低于 1？
    difficulty: 1.5
    question_type: single
    display_type: boolean
    eval_refs: [ksc-current-ratio-2023]
    options:
      - key: A
        text: 是，约 0.89
      - key: B
        text: 否，约 1.65
      - key: C
        text: 恰好等于 1
      - key: D
        text: 无法计算
    answer: A
    explanation: current_ratio ≈ 0.893028。
  - id: Q8
    stem: （多选）默认杜邦分子分母科目码包括？
    difficulty: 2
    question_type: multi
    display_type: conceptual
    eval_refs: [ksc-parent-vs-consol-001, ksc-dupont-2024]
    options:
      - key: A
        text: net_loss
      - key: B
        text: total_revenue
      - key: C
        text: total_assets
      - key: D
        text: parent_equity
      - key: E
        text: total_equity
    answer: [A, B, C, E]
    explanation: 默认合并口径用 net_loss/total_revenue/total_assets/total_equity；parent_equity 属母公司口径。

cases:

- id: ksc-income-revenue-2024
  case_type: single_turn
  skill_version: v0.1
  semantic_version: v0.1
  question: 2024 年金山云合并报表总收入是多少？请写明单位。
  domain: ksc_financial
  trace_required: true
  context_required:
    keys:
      - global/ksc-financial-dupont-playbook.md
  risk_tags: [basic, unit, numeric, income]
  expected_source: semantic_layer
  expected_measures: [总收入]
  comparison_mode: numeric
  golden_sql: |
    SELECT value_amount AS 总收入
    FROM ai.ksc_income_statement_detail
    WHERE line_item_code = 'total_revenue'
      AND fiscal_year = 2024 AND fiscal_quarter = 0 AND value_status = 'OK'
  lucy_query:
    connectionId: starrocks-r1
    measures: [ksc_income_statement_detail.总收入]
    filters:
      - ksc_income_statement_detail.fiscal_year = 2024
      - ksc_income_statement_detail.fiscal_quarter = 0
  tool_assertions:
    - type: required_tool
      value: sl_query
      reason: 取数题必须走语义查询。
  sql_assertions:
    - type: required_normalized_regex
      value: "total_revenue|总收入"
      normalize: true
      reason: 必须按 total_revenue / 总收入取数。
    - type: forbidden_normalized_regex
      value: 'line_item_name_cn\\s*='
      normalize: true
      reason: 禁止用中文科目名等值过滤。
  result_assertions:
    - value_type: scalar
      compare_mode: approx
      numeric_tolerance: 0.01
      data:
        总收入: 7785180
  notes: 单位千元人民币；金标来自 StarRocks ai schema 2026-08-08 抽样。
  snapshot_date: '2026-08-08'
  gold_csv: ../gold/income_core_fy2021_2025.csv


