        + MAX(CASE WHEN line_item_code='revenue_industry_cloud' THEN value_amount END)
        - MAX(CASE WHEN line_item_code='total_revenue' THEN value_amount END) AS pub_ind_vs_total
    FROM ai.ksc_income_statement_detail
    WHERE fiscal_year=2025 AND fiscal_quarter=0 AND value_status='OK'
  result_assertions:
    - value_type: dataframe
      compare_mode: unordered_rows
      key_columns: [pub]
      check_schema: true
      check_row_count: false
      numeric_tolerance: 0.0005
      data:
        rows:
          - pub: 6633492
            ind: 2925127
            tot: 9558619
            pub_share: 0.693980
            pub_ind_vs_total: 0
    - value_type: text
      compare_mode: subset
      check_schema: false
      check_row_count: false
      data:
        must_mention:
          - 等于
  notes: 2025 年分项之和恰好等于总收入；更早年份有小差额。
  snapshot_date: '2026-08-08'


- id: ksc-op-loss-improve-2024-2025
  case_type: single_turn
  skill_version: v0.1
  semantic_version: v0.1
  question: 经营亏损从 2024 年到 2025 年改善了多少（千元，用代数差：2025 − 2024）？
  domain: ksc_financial
  trace_required: true
  context_required:
    keys:
      - global/ksc-financial-dupont-playbook.md
  risk_tags: [trend, sign, numeric]
  expected_source: semantic_layer
  expected_measures: [经营亏损]
  comparison_mode: numeric
  golden_sql: |
    SELECT
      MAX(CASE WHEN fiscal_year=2025 THEN value_amount END)
      - MAX(CASE WHEN fiscal_year=2024 THEN value_amount END) AS op_delta
    FROM ai.ksc_income_statement_detail
    WHERE line_item_code='operating_loss' AND fiscal_quarter=0 AND value_status='OK'
      AND fiscal_year IN (2024,2025)
  sql_assertions:
    - type: forbidden_ast
      value: "ABS("
      normalize: true
      reason: 改善幅度用代数差，不要先取绝对值再减。
  result_assertions:
    - value_type: scalar
      compare_mode: approx
      numeric_tolerance: 0.01
      data:
        op_delta: 966097
  notes: -772913 - (-1739010) = 966097；亏损收窄。
  snapshot_date: '2026-08-08'


