- id: ksc-rowcount-001
  case_type: single_turn
  skill_version: v0.1
  semantic_version: v0.1
  question: 三张 KSC 报表明细表各有多少行？利润表有几个不同的 line_item_code？
  domain: ksc_financial
  trace_required: true
  context_required:
    keys:
      - global/ksc-financial-dupont-playbook.md
  risk_tags: [basic, schema, numeric]
  expected_source: raw_sql_fallback
  expected_measures: []
  comparison_mode: numeric
  golden_sql: |
    SELECT 'income' AS tbl, COUNT(*) AS rows_n, COUNT(DISTINCT line_item_code) AS codes
    FROM ai.ksc_income_statement_detail
    UNION ALL
    SELECT 'balance', COUNT(*), COUNT(DISTINCT line_item_code)
    FROM ai.ksc_balance_sheet_detail
    UNION ALL
    SELECT 'cashflow', COUNT(*), COUNT(DISTINCT line_item_code)
    FROM ai.ksc_cash_flow_statement_detail
  tool_assertions:
    - type: required_tool
      value: lucy_query|sl_query|sql
      reason: 规模画像需只读查询。
  result_assertions:
    - value_type: dataframe
      compare_mode: unordered_rows
      key_columns: [tbl]
      check_schema: true
      check_row_count: true
      numeric_tolerance: 0
      data:
        rows:
          - tbl: income
            rows_n: 125
            codes: 25
          - tbl: balance
            rows_n: 205
            codes: 41
          - tbl: cashflow
            rows_n: 195
            codes: 39
  notes: 快照规模；用于发现 ingest 漂移。
  snapshot_date: '2026-08-08'


