- id: ksc-dupont-2024
  case_type: single_turn
  skill_version: v0.1
  semantic_version: v0.1
  question: |
    请对 2024 年做合并口径杜邦分析（期末资产/权益）：给出总收入、净亏损、资产总额、权益总额，
    以及销售净利率、总资产周转率、权益乘数、ROE。并用「净亏损/权益总额」验算 ROE。
  domain: ksc_financial
  trace_required: true
  context_required:
    keys:
      - global/ksc-financial-dupont-playbook.md
  risk_tags: [dupont, cross_table, numeric, spider2_hard]
  expected_source: semantic_layer
  expected_measures: [总收入, 净亏损, 销售净利率, 资产总额, 权益总额, 权益乘数]
  comparison_mode: numeric
  golden_sql: |
    WITH i AS (
      SELECT
        MAX(CASE WHEN line_item_code='total_revenue' THEN value_amount END) AS total_revenue,
        MAX(CASE WHEN line_item_code='net_loss' THEN value_amount END) AS net_loss
      FROM ai.ksc_income_statement_detail
      WHERE fiscal_year=2024 AND fiscal_quarter=0 AND value_status='OK'
    ),
    b AS (
      SELECT
        MAX(CASE WHEN line_item_code='total_assets' THEN value_amount END) AS total_assets,
        MAX(CASE WHEN line_item_code='total_equity' THEN value_amount END) AS total_equity
      FROM ai.ksc_balance_sheet_detail
      WHERE fiscal_year=2024 AND fiscal_quarter=0 AND value_status='OK'
    )
    SELECT 2024 AS fiscal_year,
      i.total_revenue, i.net_loss, b.total_assets, b.total_equity,
      i.net_loss/i.total_revenue AS npm,
      i.total_revenue/b.total_assets AS asset_turnover,
      b.total_assets/b.total_equity AS equity_multiplier,
      (i.net_loss/i.total_revenue)*(i.total_revenue/b.total_assets)*(b.total_assets/b.total_equity) AS roe_3factor,
      i.net_loss/b.total_equity AS roe_direct
    FROM i CROSS JOIN b
  tool_assertions:
    - type: required_tool
      value: sl_query
      reason: 杜邦需分表取数后按期间对齐。
  sql_assertions:
    - type: forbidden_ast
      value: "ABS("
      normalize: true
      reason: 禁止对亏损取绝对值。
  result_assertions:
    - value_type: dataframe
      compare_mode: unordered_rows
      key_columns: [fiscal_year]
      check_schema: true
      check_row_count: true
      numeric_tolerance: 0.0005
      data:
        rows:
          - fiscal_year: 2024
            total_revenue: 7785180
            net_loss: -1979042
            total_assets: 17592654
            total_equity: 5505320
            npm: -0.254206
            asset_turnover: 0.442524
            equity_multiplier: 3.195573
            roe_3factor: -0.359478
            roe_direct: -0.359478
  notes: Spider2 风格跨表多步题；金标见 gold/dupont_fy2024.csv。
  snapshot_date: '2026-08-08'
  gold_csv: ../gold/dupont_fy2024.csv


