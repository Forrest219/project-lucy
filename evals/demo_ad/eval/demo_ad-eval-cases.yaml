lucy_eval_schema_version: 1
kind: lucy_eval_suite
suite_id: demo_ad_funnel_v1
domain: demo_ad
title: 投放账户漏斗 Eval Suite（demo-0807 → Lucy）
description: |
  由 AskTable demo-0807 Batch-1 业务问数 + 口径反模式迁移。
  判分以 result_assertions（exec-result）为主；golden_sql / gold CSV 供复现。
  Batch-3 AskTable 产品专属题（图表等）不在首轮范围。
metadata:
  document_name: 投放账户漏斗 Eval Cases
  document_type: Eval
  version: v0.1
  runner_schema_version: v1.4
  written_date: '2026-08-08'
  author: Cursor Agent
  requester: zhangxingchen
  based_on:
    - /Users/zhangxingchen/Desktop/demo-0807/
    - wiki/global/demo-ad-account-funnel-playbook.md
    - ad_account_daily.yaml
  scope: |
    dataforai.ad_account_daily：覆盖区间、账户映射、月度花费/预约、近30天渠道CPA、
    自运营vs代理、预约CPA口径反模式（禁止日均再平均）。
  output_path: evals/demo_ad/eval/demo_ad-eval-cases.yaml
  data_source: semantic_layer
  result_assertions_status: filled_v0.1
  snapshot_date: '2026-08-08'
  snapshot_batch: mysql-aliyun_dataforai_ad_account_daily_20260808
  snapshot_rows:
    ad_account_daily: 10000
  gold_dir: evals/demo_ad/gold/
  connectionId: mysql-aliyun
  coverage_matrix:
    basic:
      - demo-ad-date-coverage-001
      - demo-ad-account-map-001
      - demo-ad-jun2026-spend-appt-001
      - demo-ad-top-spend-last30-001
    ratio:
      - demo-ad-channel-cpa-last30-001
      - demo-ad-self-vs-agency-jun-001
    anti_pattern:
      - demo-ad-cpa-sum-not-avg-001
      - demo-ad-default-cpa-is-appointment-001
      - demo-ad-anchor-max-date-001
safety_contract:
  readonly: true
  forbid_secret_paths:
    - .ktx/secrets/
  forbid_cross_source_join: true
  forbidden_ast:
    - type: forbidden_ast
      value: UPDATE | DELETE | INSERT | MERGE | DROP | ALTER | TRUNCATE | CREATE
      reason: eval 只能只读，不允许 DDL 或 DML。

quiz_cases:
  - id: Q1
    stem: 默认「获客成本 / CPA」指哪个指标？
    difficulty: 0.4
    question_type: single
    display_type: conceptual
    eval_refs: [demo-ad-default-cpa-is-appointment-001]
    options:
      - key: A
        text: 预约 CPA（花费合计÷预约合计）
      - key: B
        text: 有效客户 CPA
      - key: C
        text: 各日 CPA 的算术平均
      - key: D
        text: 花费合计÷有效客户合计（且禁止声明）
    answer: A
    explanation: 未特别声明时，CPA/获客成本默认=预约 CPA，且必须 SUM/SUM。

  - id: Q2
    stem: 相对「最近一周」应如何锚定日期？
    difficulty: 0.4
    question_type: single
    display_type: conceptual
    eval_refs: [demo-ad-anchor-max-date-001]
    options:
      - key: A
        text: 用操作系统今天往前推
      - key: B
        text: 锚定数据表 max(date) 再往前推
      - key: C
        text: 固定用 2026-07-06，写死在配置里
      - key: D
        text: 用 min(date) 作为末日
    answer: B
    explanation: 相对时间锚定当前数据最大日期，不用系统今天；配置勿写死起止日。

cases:
  - id: demo-ad-date-coverage-001
    case_type: single_turn
    skill_version: v0.1
    semantic_version: v0.1
    question: 投放数据覆盖到什么时候了？从什么时候开始有的？
    domain: demo_ad
    trace_required: true
    context_required:
      keys:
        - global/demo-ad-account-funnel-playbook.md
    risk_tags: [basic, time, numeric]
    expected_source: semantic_layer
    comparison_mode: numeric
    golden_sql: |
      SELECT MIN(date) AS min_date, MAX(date) AS max_date
      FROM dataforai.ad_account_daily
    lucy_query:
      connectionId: mysql-aliyun
      measures: [ad_account_daily.spend]
      dimensions:
        - { field: "ad_account_daily.date" }
      # 取覆盖区间时也可用聚合或 catalog；金标见 result_assertions
    tool_assertions:
      - type: required_tool
        value: sl_query
        reason: 覆盖区间须查实表，不能猜。
    result_assertions:
      - value_type: scalar
        compare_mode: exact
        data:
          min_date: '2023-10-11'
          max_date: '2026-07-06'
    notes: 起止日期对即可；不要求行数。
    snapshot_date: '2026-08-08'
    gold_csv: ../gold/date_coverage.csv

  - id: demo-ad-account-map-001
    case_type: single_turn
    skill_version: v0.1
    semantic_version: v0.1
    question: 现在有哪些广告账户在投？各是什么渠道、什么等级？
    domain: demo_ad
    trace_required: true
    context_required:
      keys:
        - global/demo-ad-account-funnel-playbook.md
    risk_tags: [basic, dimension]
    expected_source: semantic_layer
    comparison_mode: set
    golden_sql: |
      SELECT account_name, channel, customer_level
      FROM dataforai.ad_account_daily
      GROUP BY account_name, channel, customer_level
      ORDER BY account_name
    tool_assertions:
      - type: required_tool
        value: sl_query
        reason: 账户×渠道×等级映射须查表。
    result_assertions:
      - value_type: table
        compare_mode: set_equal
        data_ref: ../gold/account_channel_map.csv
    notes: 10 组映射，顺序不限。
    snapshot_date: '2026-08-08'
    gold_csv: ../gold/account_channel_map.csv

  - id: demo-ad-jun2026-spend-appt-001
    case_type: single_turn
    skill_version: v0.1
    semantic_version: v0.1
    question: 2026 年 6 月花了多少、约到多少人？跟上个月比怎么样？
    domain: demo_ad
    trace_required: true
    context_required:
      keys:
        - global/demo-ad-account-funnel-playbook.md
    risk_tags: [basic, numeric, mom]
    expected_source: semantic_layer
    expected_measures: [spend, appointments]
    comparison_mode: numeric
    golden_sql: |
      SELECT ROUND(SUM(spend),0) AS spend, SUM(appointments) AS appointments
      FROM dataforai.ad_account_daily
      WHERE date BETWEEN '2026-06-01' AND '2026-06-30'
    lucy_query:
      connectionId: mysql-aliyun
      measures:
        - ad_account_daily.spend
        - ad_account_daily.appointments
      filters:
        - ad_account_daily.date >= '2026-06-01'
        - ad_account_daily.date <= '2026-06-30'
    tool_assertions:
      - type: required_tool
        value: sl_query
        reason: 月度花费与预约必须语义取数。
    result_assertions:
      - value_type: scalar
        compare_mode: approx
        numeric_tolerance: 0.01
        data:
          spend: 2399900
          appointments: 2807
    notes: |
      5 月对照：spend=2459300，appointments=2905；环比花费约 -2.4%，预约约 -3.4%。
      有环比方向即加分。
    snapshot_date: '2026-08-08'
    gold_csv: ../gold/spend_appt_may_jun_2026.csv

  - id: demo-ad-top-spend-last30-001
    case_type: single_turn
    skill_version: v0.1
    semantic_version: v0.1
    question: 最近 30 天哪个账户花钱最多？前三名分别花了多少？
    domain: demo_ad
    trace_required: true
    context_required:
      keys:
        - global/demo-ad-account-funnel-playbook.md
    risk_tags: [basic, numeric, time_anchor]
    expected_source: semantic_layer
    expected_measures: [spend]
    comparison_mode: numeric
    golden_sql: |
      SELECT account_name, ROUND(SUM(spend),0) AS spend
      FROM dataforai.ad_account_daily
      WHERE date BETWEEN '2026-06-07' AND '2026-07-06'
      GROUP BY account_name
      ORDER BY spend DESC
      LIMIT 3
    tool_assertions:
      - type: required_tool
        value: sl_query
        reason: 近 30 天账户花费排名须查表。
    result_assertions:
      - value_type: table
        compare_mode: ordered_approx
        numeric_tolerance: 0.01
        data_ref: ../gold/top_spend_accounts_last30.csv
    notes: 相对数据末日 2026-07-06 往前 30 天（约 6/7–7/6），不能按系统今天。
    snapshot_date: '2026-08-08'
    gold_csv: ../gold/top_spend_accounts_last30.csv

  - id: demo-ad-channel-cpa-last30-001
    case_type: single_turn
    skill_version: v0.1
    semantic_version: v0.1
    question: 最近哪个渠道获客更划算？哪个最贵？把各渠道成本排一下。
    domain: demo_ad
    trace_required: true
    context_required:
      keys:
        - global/demo-ad-account-funnel-playbook.md
    risk_tags: [ratio, channel, cpa]
    expected_source: semantic_layer
    expected_measures: [预约CPA]
    comparison_mode: numeric
    golden_sql: |
      SELECT channel, ROUND(SUM(spend)/SUM(appointments),2) AS appointment_cpa
      FROM dataforai.ad_account_daily
      WHERE date BETWEEN '2026-06-07' AND '2026-07-06'
      GROUP BY channel
      ORDER BY appointment_cpa
    lucy_query:
      connectionId: mysql-aliyun
      measures: [ad_account_daily.预约CPA]
      dimensions:
        - { field: "ad_account_daily.channel" }
      filters:
        - ad_account_daily.date >= '2026-06-07'
        - ad_account_daily.date <= '2026-07-06'
    tool_assertions:
      - type: required_tool
        value: sl_query
        reason: 渠道预约 CPA 须语义取数。
    result_assertions:
      - value_type: table
        compare_mode: ordered_approx
        numeric_tolerance: 0.01
        data_ref: ../gold/channel_cpa_last30.csv
    notes: 巨量最低≈762.69，快手最高≈1115.32；误差 ≤1%。
    snapshot_date: '2026-08-08'
    gold_csv: ../gold/channel_cpa_last30.csv

  - id: demo-ad-self-vs-agency-jun-001
    case_type: single_turn
    skill_version: v0.1
    semantic_version: v0.1
    question: 最近自运营和代理比，谁花得多？谁获客更便宜？（可用 2026 年 6 月）
    domain: demo_ad
    trace_required: true
    context_required:
      keys:
        - global/demo-ad-account-funnel-playbook.md
    risk_tags: [ratio, segment, cpa]
    expected_source: semantic_layer
    expected_measures: [spend, 预约CPA]
    comparison_mode: numeric
    golden_sql: |
      SELECT CASE WHEN account_name LIKE '%自运营%' THEN '自运营' ELSE '代理' END AS op_type,
             ROUND(SUM(spend),0) AS spend,
             ROUND(SUM(spend)/SUM(appointments),2) AS appointment_cpa
      FROM dataforai.ad_account_daily
      WHERE date BETWEEN '2026-06-01' AND '2026-06-30'
      GROUP BY op_type
    tool_assertions:
      - type: required_tool
        value: sl_query
        reason: 自运营/代理对比须按账户名分段聚合。
    result_assertions:
      - value_type: table
        compare_mode: set_approx
        numeric_tolerance: 0.01
        data_ref: ../gold/self_vs_agency_jun2026.csv
    notes: 自运营花费 1459200、CPA≈804.41；代理花费 940700、CPA≈947.33。方向：自运营花得多且更便宜。
    snapshot_date: '2026-08-08'
    gold_csv: ../gold/self_vs_agency_jun2026.csv

  - id: demo-ad-cpa-sum-not-avg-001
    case_type: single_turn
    skill_version: v0.1
    semantic_version: v0.1
    question: 你这个成本是怎么算的？是按天平均的吗？
    domain: demo_ad
    trace_required: true
    context_required:
      keys:
        - global/demo-ad-account-funnel-playbook.md
    risk_tags: [anti_pattern, cpa, conceptual]
    expected_source: wiki_or_semantic
    comparison_mode: conceptual
    tool_assertions:
      - type: forbidden_normalized_regex
        value: 'AVG\\s*\\(\\s*.*spend.*appointment|avg\\(.*cpa'
        normalize: true
        reason: 禁止对日 CPA 再平均。
    result_assertions:
      - value_type: conceptual
        must_include:
          - 花费合计
          - 预约合计
        must_not_claim:
          - 按天平均再汇总
          - 日均 CPA 再平均
    notes: 正确公式=花费合计÷预约合计；明确否定日均再平均。
    snapshot_date: '2026-08-08'

  - id: demo-ad-default-cpa-is-appointment-001
    case_type: single_turn
    skill_version: v0.1
    semantic_version: v0.1
    question: 最近获客成本大概多少？默认口径是哪个指标？
    domain: demo_ad
    trace_required: true
    context_required:
      keys:
        - global/demo-ad-account-funnel-playbook.md
    risk_tags: [anti_pattern, cpa, synonym]
    expected_source: semantic_layer
    expected_measures: [预约CPA]
    comparison_mode: hybrid
    golden_sql: |
      SELECT ROUND(SUM(spend)/SUM(appointments),2) AS appointment_cpa
      FROM dataforai.ad_account_daily
      WHERE date BETWEEN '2026-06-07' AND '2026-07-06'
    tool_assertions:
      - type: required_tool
        value: sl_query
        reason: 获客成本数字须取预约 CPA。
    result_assertions:
      - value_type: conceptual
        must_include:
          - 预约 CPA
      - value_type: scalar
        compare_mode: approx
        numeric_tolerance: 0.01
        data:
          appointment_cpa: 853.82
    notes: 近 30 天预约 CPA≈853.82；须声明默认=预约 CPA。
    snapshot_date: '2026-08-08'

  - id: demo-ad-anchor-max-date-001
    case_type: single_turn
    skill_version: v0.1
    semantic_version: v0.1
    question: 算「最近 30 天」时，结束日期应该用哪一天？为什么？
    domain: demo_ad
    trace_required: true
    context_required:
      keys:
        - global/demo-ad-account-funnel-playbook.md
    risk_tags: [anti_pattern, time_anchor, conceptual]
    expected_source: wiki_or_semantic
    comparison_mode: conceptual
    result_assertions:
      - value_type: conceptual
        must_include:
          - max(date)
          - 2026-07-06
        must_not_claim:
          - 系统今天
          - 操作系统当前日期
    notes: 必须以数据末日 2026-07-06（当前快照）为锚，而非系统今天。
    snapshot_date: '2026-08-08'
