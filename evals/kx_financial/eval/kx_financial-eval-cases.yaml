safety_contract:
  readonly: true
  forbid_secret_paths:
    - ".ktx/secrets/"
  forbid_cross_source_join: true
  forbidden_ast:
    - type: forbidden_ast
      value: "UPDATE | DELETE | INSERT | MERGE | DROP | ALTER | TRUNCATE | CREATE"
      reason: eval / fallback 只能只读，不允许 DDL 或 DML。
    - type: forbidden_ast
      value: "cross_source_join"
      reason: 禁止跨数据源 Join；跨源分析必须拆成单源结果后人工解释。

quiz_cases:
  - id: Q1
    stem: "KX 财务域当前应该看到几个 semantic layer source？"
    difficulty: 0.5
    question_type: single
    display_type: exact_value
    eval_refs:
      - kx-schema-001
    options:
      - key: A
        text: "3 个"
      - key: B
        text: "6 个"
      - key: C
        text: "9 个"
      - key: D
        text: "只允许 superstore"
    answer: "B"
    explanation: "KX 当前包含 3 张表和 3 个明细视图，共 6 个 source。"

  - id: Q2
    stem: "KX 财报金额事实表有多少行？"
    difficulty: 1
    question_type: single
    display_type: exact_value
    eval_refs:
      - kx-rowcount-001
    options:
      - key: A
        text: "466 行"
      - key: B
        text: "700 行"
      - key: C
        text: "2330 行"
      - key: D
        text: "5083 行"
    answer: "C"
    explanation: "kx_fact_financial_amount 当前快照为 2330 行。"

  - id: Q3
    stem: "每个 report_period 在 KX 财报事实表中有多少行？"
    difficulty: 1.5
    question_type: single
    display_type: exact_value
    eval_refs:
      - kx-period-001
    options:
      - key: A
        text: "125 行"
      - key: B
        text: "160 行"
      - key: C
        text: "310 行"
      - key: D
        text: "466 行"
    answer: "D"
    explanation: "202601 到 202605 每期都是 466 行。"

  - id: Q4
    stem: "查公司名称时，正确的数据路径是什么？"
    difficulty: 2
    question_type: single
    display_type: conceptual
    eval_refs:
      - kx-join-001
    options:
      - key: A
        text: "从 source_file_name 解析"
      - key: B
        text: "按 company_id 关联 kx_dim_company"
      - key: C
        text: "按 item_id 关联公司维表"
      - key: D
        text: "默认使用 superstore_people"
    answer: "B"
    explanation: "公司名来自 kx_dim_company，事实表通过 company_id 关联。"

  - id: Q5
    stem: "202605 利润表“一、营业收入”的本年累计金额是多少？"
    difficulty: 2
    question_type: single
    display_type: exact_value
    eval_refs:
      - kx-income-001
      - kx-join-002
    options:
      - key: A
        text: "0"
      - key: B
        text: "25872.08"
      - key: C
        text: "69339.62"
      - key: D
        text: "99456.98"
    answer: "C"
    explanation: "202605 一、营业收入 year_to_date 金额为 69339.62。"

  - id: Q6
    stem: "202605 利润表“一、营业收入”的本月金额为空时，应该怎么处理？"
    difficulty: 2.5
    question_type: single
    display_type: conceptual
    eval_refs:
      - kx-income-null-001
    options:
      - key: A
        text: "明确保留为 NULL"
      - key: B
        text: "自动当作 0"
      - key: C
        text: "用本年累计金额填充"
      - key: D
        text: "删除该项目"
    answer: "A"
    explanation: "来源空单元格保留为 NULL，不能用 0 替代。"

  - id: Q7
    stem: "计算资产负债表余额时，为什么不能直接 SUM(amount)？"
    difficulty: 3
    question_type: single
    display_type: conceptual
    eval_refs:
      - kx-amount-type-001
    options:
      - key: A
        text: "会混加不同 amount_type"
      - key: B
        text: "amount 不是数值列"
      - key: C
        text: "只能查 superstore"
      - key: D
        text: "必须按 source_file_name 分组"
    answer: "A"
    explanation: "资产负债表同时有 begin_balance 和 end_balance，必须先限定 amount_type。"

  - id: Q8
    stem: "202605 资产负债表中“货币资金”的期末余额是多少？"
    difficulty: 2
    question_type: single
    display_type: exact_value
    eval_refs:
      - kx-balance-001
    options:
      - key: A
        text: "15871.88"
      - key: B
        text: "25872.08"
      - key: C
        text: "34505.28"
      - key: D
        text: "69339.62"
    answer: "B"
    explanation: "货币资金 202605 期末余额为 25872.08。"

  - id: Q9
    stem: "202605 现金流量表“五、期末现金余额”是多少？"
    difficulty: 2
    question_type: single
    display_type: exact_value
    eval_refs:
      - kx-cashflow-001
      - kx-multiturn-001
    options:
      - key: A
        text: "25872.08"
      - key: B
        text: "34505.28"
      - key: C
        text: "69339.62"
      - key: D
        text: "99456.98"
    answer: "A"
    explanation: "现金流量表五、期末现金余额为 25872.08。"

  - id: Q10
    stem: "查询 KX 财务表时是否需要加 is_deleted=0？"
    difficulty: 2.5
    question_type: boolean
    display_type: boolean
    eval_refs:
      - kx-filter-001
    options:
      - key: A
        text: "需要"
      - key: B
        text: "不需要"
    answer: "B"
    explanation: "KX 财务表不含 is_deleted，不能套用 superstore 软删除过滤。"

  - id: Q11
    stem: "以下哪些字段只用于追溯，不能替代业务维表？（多选）"
    difficulty: 3
    question_type: multi
    display_type: conceptual
    eval_refs:
      - kx-source-file-001
    options:
      - key: A
        text: "source_file_name"
      - key: B
        text: "source_sheet_name"
      - key: C
        text: "company_id"
      - key: D
        text: "item_id"
    answer: "A,B"
    explanation: "source_file_name 和 source_sheet_name 只用于 lineage，不是业务 join key。"

  - id: Q12
    stem: "利润表项目维表有 36 个项目，但利润表明细视图每期只有 32 个项目。缺少哪些项目？（多选）"
    difficulty: 4
    question_type: multi
    display_type: exact_value
    eval_refs:
      - kx-view-gap-001
    options:
      - key: A
        text: "城市建设维护税"
      - key: B
        text: "二、营业利润"
      - key: C
        text: "三、利润总额"
      - key: D
        text: "四、净利润"
      - key: E
        text: "一、营业收入"
    answer: "A,B,C,D"
    explanation: "缺少城市建设维护税、二、营业利润、三、利润总额、四、净利润。"

cases:
  - id: kx-routing-001
    case_type: single_turn
    question: 查询 KX 财报数据时，应该使用哪些 dataforai 表或视图？不要查询 superstore。
    domain: kx_financial
    skill_version: v0.1
    semantic_version: v0.1
    model_id: claude-sonnet-4-6
    expected_source: semantic_layer
    expected_measures: []
    linked_quiz_questions: []
    sql_assertions: []
    tool_assertions:
      - type: required_tool
        value: "mcp__ktx__sl_search | mcp__ktx__sl_read_source | mcp__ktx__sl_validate"
        reason: source 路由题应读取 semantic layer 定义或搜索结果。
      - type: required_tool_input_regex
        value: "kx|财报|财务"
        reason: semantic layer 检索必须面向 KX 财务域。
      - type: max_tool_calls
        tool: mcp__ktx__connection_list
        max: 0
        reason: 已知单 connection KX 路由题不需要读取 connection_list。
      - type: max_repeated_tool_input
        tool: mcp__ktx__sl_read_source
        input_path: sourceName
        max_per_value: 1
        reason: 同一 source 定义在单 case 内不应重复读取。
    result_assertions:
      - value_type: text
        data:
          must_mention:
            - kx_fact_financial_amount
            - kx_dim_company
            - kx_dim_financial_item
            - kx_vw_balance_sheet_detail
            - kx_vw_cash_flow_statement_detail
            - kx_vw_income_statement_detail
        compare_mode: subset
        check_schema: false
        check_row_count: false
    snapshot_date: 2026-06-20
    notes: 路由围栏；财报问题必须进入 KX source，不得沿用超市样例表。

  - id: kx-schema-001
    case_type: single_turn
    question: KTX 里 KX 财务域现在有几个 source？分别是什么？
    domain: kx_financial
    skill_version: v0.1
    semantic_version: v0.1
    model_id: claude-sonnet-4-6
    expected_source: semantic_layer
    expected_measures: []
    linked_quiz_questions: []
    sql_assertions: []
    tool_assertions:
      - type: required_tool
        value: "mcp__ktx__discover_data | mcp__ktx__sl_search | mcp__ktx__sl_read_source | mcp__ktx__sl_validate"
        reason: source 数量题应读取 semantic layer catalog。
      - type: required_tool_input_regex
        value: "kx|source|财务"
        reason: semantic layer 检索必须面向 KX 财务 source。
      - type: max_tool_calls
        tool: mcp__ktx__connection_list
        max: 0
        reason: source 数量题已限定 KX 财务域，不需要列 connection。
      - type: max_repeated_tool_input
        tool: mcp__ktx__sl_read_source
        input_path: sourceName
        max_per_value: 1
        reason: 同一 source 定义在单 case 内不应重复读取。
    result_assertions:
      - value_type: text
        data:
          must_mention:
            - kx_dim_company
            - kx_dim_financial_item
            - kx_fact_financial_amount
            - kx_vw_balance_sheet_detail
            - kx_vw_cash_flow_statement_detail
            - kx_vw_income_statement_detail
        compare_mode: subset
        check_schema: false
        check_row_count: false
      - value_type: scalar
        data:
          source_count: 6
        numeric_tolerance: 0
        compare_mode: exact
        check_schema: false
        check_row_count: false
    snapshot_date: 2026-06-20
    notes: 接入冒烟；确保新增 3 张表和 3 个视图都可被 semantic layer 读取。

  - id: kx-rowcount-001
    case_type: single_turn
    question: KX 财报金额事实表有多少行、多少个期间、期间范围是什么？
    domain: kx_financial
    skill_version: v0.1
    semantic_version: v0.1
    model_id: claude-sonnet-4-6
    expected_source: raw_sql_fallback
    expected_measures: []
    linked_quiz_questions: []
    sql_assertions:
      - type: required_ast
        value: "COUNT(*)"
        normalize: true
        reason: 行数画像需要统计事实表记录数。
      - type: required_ast
        value: "COUNT(DISTINCT report_period)"
        normalize: true
        reason: 必须统计 distinct 报表期间。
      - type: required_ast
        value: "MIN(report_period)"
        normalize: true
        reason: 必须给出最早期间。
      - type: required_ast
        value: "MAX(report_period)"
        normalize: true
        reason: 必须给出最新期间。
    result_assertions:
      - value_type: dataframe
        data:
          rows:
            - row_count: 2330
              periods: 5
              min_period: "202601"
              max_period: "202605"
        numeric_tolerance: 0
        compare_mode: unordered_rows
        key_columns:
          - min_period
          - max_period
        check_schema: true
        check_row_count: true
    snapshot_date: 2026-06-20
    notes: 基础规模画像；用于快速发现 ingest 或表范围漂移。KX 事实表当前没有 SL measures，ground truth 用 ktx sql read-only fallback 计算。

  - id: kx-period-001
    case_type: single_turn
    question: KX 财报事实表每个 report_period 各有多少行？是否每期都是 466 行？
    domain: kx_financial
    skill_version: v0.1
    semantic_version: v0.1
    model_id: claude-sonnet-4-6
    expected_source: raw_sql_fallback
    expected_measures: []
    linked_quiz_questions: []
    sql_assertions:
      - type: required_ast
        value: "GROUP BY report_period"
        normalize: true
        reason: 必须按报表期间分组。
      - type: required_ast
        value: "COUNT(*)"
        normalize: true
        reason: 必须统计每期事实行数。
    result_assertions:
      - value_type: dataframe
        data:
          rows:
            - report_period: "202601"
              row_count: 466
            - report_period: "202602"
              row_count: 466
            - report_period: "202603"
              row_count: 466
            - report_period: "202604"
              row_count: 466
            - report_period: "202605"
              row_count: 466
        numeric_tolerance: 0
        compare_mode: unordered_rows
        key_columns:
          - report_period
        check_schema: true
        check_row_count: true
    snapshot_date: 2026-06-20
    notes: 基础期间完整性；每月 466 行来自 5 个 source sheets。

  - id: kx-join-001
    case_type: single_turn
    question: KX 事实表里的公司是谁？请通过 company_id 关联公司维表回答。
    domain: kx_financial
    skill_version: v0.1
    semantic_version: v0.1
    model_id: claude-sonnet-4-6
    expected_source: raw_sql_fallback
    expected_measures: []
    linked_quiz_questions: []
    sql_assertions:
      - type: required_ast
        value: "JOIN kx_dim_company | kx_dim_company"
        normalize: true
        reason: 公司名必须从公司维表取得，可通过 JOIN 或等价 EXISTS/subquery。
      - type: required_ast
        value: "company_id"
        normalize: true
        reason: 必须用 company_id 关联事实表和公司维表。
      - type: forbidden_ast
        value: "source_file_name"
        normalize: true
        reason: 禁止从文件名解析公司名作为业务 join 替代。
    result_assertions:
      - value_type: text
        data:
          must_mention:
            - 深圳市柯西信息科技有限公司
            - company_id
            - "1"
        compare_mode: subset
        check_schema: false
        check_row_count: false
    snapshot_date: 2026-06-20
    notes: join 路径围栏；公司名来自维表而不是源文件名。

  - id: kx-join-002
    case_type: single_turn
    question: 查 202605 的“一、营业收入”本年累计金额是多少？必须通过 item_id 关联财报项目维表。
    domain: kx_financial
    skill_version: v0.1
    semantic_version: v0.1
    model_id: claude-sonnet-4-6
    expected_source: raw_sql_fallback
    expected_measures: []
    linked_quiz_questions: []
    sql_assertions:
      - type: required_ast
        value: "JOIN kx_dim_financial_item"
        normalize: true
        reason: 财报项目名必须从项目维表取得。
      - type: required_ast
        value: "item_id"
        normalize: true
        reason: 必须用 item_id 关联事实表和财报项目维表。
      - type: required_ast
        value: "report_period = '202605'"
        normalize: true
        reason: 必须限定报表期间。
      - type: required_ast
        value: "amount_type = 'year_to_date'"
        normalize: true
        reason: 本年累计金额必须限定 year_to_date。
    result_assertions:
      - value_type: dataframe
        data:
          rows:
            - item_name: 一、营业收入
              amount: 69339.62
        numeric_tolerance: 0.01
        compare_mode: unordered_rows
        key_columns:
          - item_name
        check_schema: true
        check_row_count: true
    snapshot_date: 2026-06-20
    notes: 典型项目查询；防止直接猜项目列或混用 amount_type。

  - id: kx-balance-001
    case_type: single_turn
    question: 202605 资产负债表中“货币资金”的期末余额和年初余额分别是多少？
    domain: kx_financial
    skill_version: v0.1
    semantic_version: v0.1
    model_id: claude-sonnet-4-6
    expected_source: raw_sql_fallback
    expected_measures: []
    linked_quiz_questions: []
    sql_assertions:
      - type: required_normalized_regex
        value: "kx_vw_balance_sheet_detail|kx_fact_financial_amount"
        normalize: true
        reason: 可用资产负债表视图，或事实表加 item 维表查询。
      - type: required_normalized_regex
        value: "期末余额|end_balance"
        normalize: true
        reason: 必须区分期末余额。
      - type: required_normalized_regex
        value: "年初余额|begin_balance"
        normalize: true
        reason: 必须区分年初余额。
    result_assertions:
      - value_type: dataframe
        data:
          rows:
            - report_period: "202605"
              item_name: 货币资金
              end_balance: 25872.08
              begin_balance: 15871.88
        numeric_tolerance: 0.01
        compare_mode: unordered_rows
        key_columns:
          - report_period
          - item_name
        check_schema: true
        check_row_count: false
    snapshot_date: 2026-06-20
    notes: 资产负债表金额类型围栏；不能混加 begin/end balance。

  - id: kx-balance-002
    case_type: single_turn
    question: 202605 资产合计是否等于负债和所有者权益合计？请给出两个期末余额。
