  - id: kx-income-001
    case_type: single_turn
    question: 202605 利润表“一、营业收入”的本年累计金额是多少？
    domain: kx_financial
    skill_version: v0.1
    semantic_version: v0.1
    model_id: claude-sonnet-4-6
    expected_source: raw_sql_fallback
    expected_measures: []
    linked_quiz_questions: []
    sql_assertions:
      - type: required_normalized_regex
        value: "一、营业收入"
        normalize: true
        reason: 必须精确匹配利润表项目名，不能省略中文序号造成错配。
      - type: required_normalized_regex
        value: "本年累计金额|year_to_date"
        normalize: true
        reason: 必须查询本年累计金额。
      - type: required_normalized_regex
        value: "202605"
        normalize: true
        reason: 必须限定 202605。
    result_assertions:
