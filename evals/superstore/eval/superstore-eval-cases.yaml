cases:
  - id: superstore-discount-001
    case_type: single_turn
    question: superstore_orders 的整体加权平均折扣率是多少？
    domain: superstore
    skill_version: v1.0
    semantic_version: v1.0
    model_id: claude-sonnet-4-6
    expected_source: semantic_layer
    expected_measures:
      - weighted_discount
    linked_quiz_questions:
      - Q21
    sql_assertions:
      - type: measure_lineage
        value: weighted_discount
        normalize: true
        reason: 必须使用语义层加权平均折扣率口径
      - type: required_ast
        value: "SUM(discount * sales)"
        normalize: true
        reason: 加权平均折扣率分子必须按销售额加权
      - type: required_ast
        value: "NULLIF(SUM(sales), 0)"
        normalize: true
        reason: 分母必须保护除零
      - type: forbidden_ast
        value: "AVG(discount)"
        normalize: true
        reason: 禁止使用简单平均折扣率
    result_assertions:
      - value_type: scalar
        data:
          weighted_discount: 0.1398
        numeric_tolerance: 0.0001
        compare_mode: approx
        check_schema: true
        check_row_count: true
    snapshot_date: 2026-06-17
    notes: 最基础的折扣聚合用例，验证是否使用加权平均口径。

  - id: superstore-discount-002
    case_type: single_turn
    question: 各品类（category）的加权平均折扣率分别是多少？按折扣从高到低排序。
    domain: superstore
    skill_version: v1.0
    semantic_version: v1.0
    model_id: claude-sonnet-4-6
    expected_source: semantic_layer
    expected_measures:
      - weighted_discount
    linked_quiz_questions: []
    sql_assertions:
      - type: measure_lineage
        value: weighted_discount
        normalize: true
        reason: 分组后仍必须使用加权平均折扣率
      - type: required_ast
        value: "SUM(discount * sales)"
        normalize: true
        reason: 分子必须按销售额加权
      - type: required_ast
        value: "NULLIF(SUM(sales), 0)"
        normalize: true
        reason: 分母必须保护除零
      - type: required_ast
        value: "GROUP BY category"
        normalize: true
        reason: 必须按品类分组
      - type: forbidden_ast
        value: "AVG(discount)"
        normalize: true
        reason: 禁止退化为简单平均
    result_assertions:
      - value_type: dataframe
        data:
          rows:
            - category: 家具
              weighted_discount: 0.17
            - category: 办公用品
              weighted_discount: 0.14
            - category: 技术
              weighted_discount: 0.12
        numeric_tolerance: 0.01
        compare_mode: unordered_rows
        key_columns:
          - category
        check_schema: true
        check_row_count: true
    snapshot_date: 2026-06-17
    notes: 验证分组场景下仍使用加权平均，不退化为 AVG。

  - id: superstore-discount-003
    case_type: single_turn
    question: 折扣超过 20% 的订单，平均利润率是多少？
    domain: superstore
    skill_version: v1.0
    semantic_version: v1.0
    model_id: claude-sonnet-4-6
    expected_source: semantic_layer
    expected_measures:
      - profit_margin
    linked_quiz_questions: []
    sql_assertions:
      - type: measure_lineage
        value: profit_margin
        normalize: true
        reason: 利润率必须使用语义层口径
      - type: required_ast
        value: "SUM(profit)"
        normalize: true
        reason: 利润率分子为利润求和
      - type: required_ast
        value: "NULLIF(SUM(sales), 0)"
        normalize: true
        reason: 利润率分母为销售额求和并保护除零
      - type: required_ast
        value: "discount > 0.2"
        normalize: true
        reason: 必须过滤高折扣订单
      - type: forbidden_ast
        value: "AVG(profit / sales)"
        normalize: true
        reason: 禁止逐行利润率平均
      - type: forbidden_ast
        value: "AVG(discount)"
        normalize: true
        reason: 本题不应计算平均折扣
    result_assertions:
      - value_type: scalar
        data:
          profit_margin_sign: negative
        compare_mode: exact
        check_schema: true
        check_row_count: true
    snapshot_date: 2026-06-17
    notes: 验证高折扣段利润率为负，同时验证利润率公式正确。profit 亏损行不可过滤。

  - id: superstore-ordercount-001
    case_type: single_turn
    question: superstore_orders 共有多少笔订单？
    domain: superstore
    skill_version: v1.0
    semantic_version: v1.0
    model_id: claude-sonnet-4-6
    expected_source: semantic_layer
    expected_measures:
      - order_count
    linked_quiz_questions:
      - Q22
      - Q23
    sql_assertions:
      - type: measure_lineage
        value: order_count
        normalize: true
        reason: 订单数必须使用语义层 order_count
      - type: required_ast
        value: "COUNT(DISTINCT order_id)"
        normalize: true
        reason: 明细表粒度为 row_id，订单数必须去重
      - type: forbidden_ast
        value: "COUNT(*)"
        normalize: true
        reason: 禁止把明细行数当作订单数
    result_assertions:
      - value_type: scalar
        data:
          order_count: 5083
        numeric_tolerance: 0
        compare_mode: exact
        check_schema: true
        check_row_count: true
    snapshot_date: 2026-06-18
    notes: superstore_orders 是明细表（10194 行），订单数应为 5083 而非 10194。

  - id: superstore-ordercount-002
    case_type: single_turn
    question: 各区域（region）的订单数和总销售额分别是多少？
    domain: superstore
    skill_version: v1.0
    semantic_version: v1.0
    model_id: claude-sonnet-4-6
    expected_source: semantic_layer
    expected_measures:
      - order_count
      - total_sales
    linked_quiz_questions:
      - Q1
      - Q6
    sql_assertions:
      - type: measure_lineage
        value: order_count
        normalize: true
        reason: 订单数必须按 order_id 去重
      - type: measure_lineage
        value: total_sales
        normalize: true
        reason: 销售额必须使用 total_sales
      - type: required_ast
        value: "COUNT(DISTINCT order_id)"
        normalize: true
        reason: 禁止 COUNT(*) 误算订单数
      - type: required_ast
        value: "SUM(sales)"
        normalize: true
        reason: total_sales 底层为销售额求和
      - type: required_ast
        value: "GROUP BY region"
        normalize: true
        reason: 必须按区域分组
      - type: forbidden_ast
        value: "COUNT(*)"
        normalize: true
        reason: 禁止把明细行数当作订单数
    result_assertions:
      - value_type: dataframe
        data:
          total_order_count_sum: 5083
          total_sales: 16867374
        numeric_tolerance: 1
        compare_mode: approx
        check_schema: true
        check_row_count: false
    snapshot_date: 2026-06-18
    notes: 验证分组后 COUNT(DISTINCT) 正确，且各区域订单数之和 = 总订单数。

