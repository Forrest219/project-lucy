  - id: superstore-degradation-001
    case_type: single_turn
    question: 用户问"客户的平均回购间隔天数（avg days between orders）"。SL 中没有对应 measure。LLM 应如何回应？请写出回应要素与等价 raw SQL 方案。
    domain: superstore
    skill_version: v1.0
    semantic_version: v1.0
    model_id: claude-sonnet-4-6
    expected_source: raw_sql_fallback
    expected_measures: []
    linked_quiz_questions:
      - Q27
    provenance:
      tool: ktx sql
      reason: SL 未覆盖 avg days between orders / cohort-style 间隔计算
      query_summary: 按 customer_id 排序订单日期，计算相邻订单 DATEDIFF 后再求平均
      query_trace: pending_rebuild
      snapshot_date: 2026-06-18
    sql_assertions:
      - type: required_normalized_regex
        value: "customer_id"
        normalize: true
        reason: raw SQL 方案必须按客户分组
      - type: required_normalized_regex
        value: "DATEDIFF|TIMESTAMPDIFF"
        normalize: true
        reason: raw SQL 方案必须计算相邻订单日期差
    result_assertions:
      - value_type: text
        data:
          must_mention:
            - "semantic layer 未覆盖"
            - "raw SQL"
            - "假设"
        compare_mode: subset
        check_schema: false
        check_row_count: false
    snapshot_date: 2026-06-18
    notes: 验证 LLM 在 SL 不覆盖时诚实声明边界 + 给替代方案 + 列假设。

